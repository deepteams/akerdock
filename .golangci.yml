version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errname
    - gocritic
    - misspell
    - nilerr
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    generated: lax
    paths:
      - internal/api/api.gen.go
      - internal/store
      # An npm dependency ships Go sources under web/node_modules: they are not
      # ours, and linting them says nothing about this codebase.
      - web/node_modules
    rules:
      # Handlers implement the oapi-codegen generated interface: method and
      # parameter names (EnableApi, teamUuid, unused params) are imposed.
      - path: internal/handlers/
        linters: [revive]
        text: "var-naming|unused-parameter"
      # Test code is held to a lighter bar: fakes must mirror the GENERATED store
      # method names (GetActiveApiTokensByPrefix…) so they cannot be renamed, and
      # ignored errors / unused params / always-same args are the norm in fixtures.
      - path: _test\.go
        linters: [errcheck, unparam, gocritic]
      - path: _test\.go
        linters: [revive]
        text: "var-naming|unused-parameter"
      # The CLI mirrors the API's JSON field names (Uuid, matching the generated
      # store types and the "uuid" wire tag) — not worth diverging from them.
      - path: internal/cli/
        linters: [revive]
        text: "var-naming"
      # House style: every file opens with a descriptive header comment tied to
      # the section it implements (see composedeploy.go). That deliberately
      # conflicts with package-comments' "Package jobs ..." single-sentence form.
      - linters: [revive]
        text: "package-comments"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/deepteams/akerdock
