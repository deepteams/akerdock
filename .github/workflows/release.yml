name: Release

# A release is a tag. The compose file pins AKERDOCK_TAG explicitly and never
# accepts `latest` (instance-config §4.1): an upgrade must be a decision, not a
# side effect of a restart. This workflow is what makes such a tag exist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  # Required by the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  # The gates of CI apply to a release too — a tag must not be able to ship
  # what a pull request could not merge.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code || {
            echo "::error::generated code is out of sync with the spec — run 'make generate' and commit"
            exit 1
          }
      - name: Test
        run: go test ./...
      - name: Run the complete E2E journey
        run: make e2e
      - name: Smoke-test the distribution
        run: bash scripts/dist-smoke.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the version tag is published — deliberately no `latest`. A tag
      # that moves is a tag that upgrades an instance behind the operator's
      # back (ADR-021).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/deepteams/akerdock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 and arm64: the target of a self-hosted PaaS is as often an ARM VPS
      # as an x86 one.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach a CycloneDX SBOM to the published image (licensing-sbom.md):
          # what an operator pulls carries its own supply-chain inventory,
          # alongside the signed provenance below.
          sbom: true

      # Signed provenance: what an operator pulls can be traced back to this
      # commit and this workflow, not merely to whoever could push to the
      # registry.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/deepteams/akerdock
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
