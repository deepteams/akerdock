name: Release

# A release is a tag. The compose file pins AKERDOCK_TAG explicitly and never
# accepts `latest` (instance-config §4.1): an upgrade must be a decision, not a
# side effect of a restart. This workflow is what makes such a tag exist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  # Required by the build provenance attestation below.
  id-token: write
  attestations: write

jobs:
  # The gates of CI apply to a release too — a tag must not be able to ship
  # what a pull request could not merge. Enforced by construction: verify IS
  # the CI workflow (workflow_call), so the gate list has one definition and
  # a job added to CI automatically gates releases. A tag push counts as a
  # push event, so the post-merge tiers (docker-integration, e2e, dist) run
  # here too — the pre-release proofs the PRD asks for.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the version tag is published — deliberately no `latest`. A tag
      # that moves is a tag that upgrades an instance behind the operator's
      # back (ADR-021).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/deepteams/akerdock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 and arm64: the target of a self-hosted PaaS is as often an ARM VPS
      # as an x86 one.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach a CycloneDX SBOM to the published image (licensing-sbom.md):
          # what an operator pulls carries its own supply-chain inventory,
          # alongside the signed provenance below.
          sbom: true

      # Signed provenance: what an operator pulls can be traced back to this
      # commit and this workflow, not merely to whoever could push to the
      # registry.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/deepteams/akerdock
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
