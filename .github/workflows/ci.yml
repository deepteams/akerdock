name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml run these exact gates as its verify stage: one
  # definition of what must pass, whether the ref is a PR or a tag.
  workflow_call:

permissions:
  contents: read

# Superseded pushes to the same PR cancel the outdated run instead of queuing
# behind it; pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The queue's guarantees (SKIP LOCKED, leases, lock_key) are properties of
    # the SQL: they are tested against a real PostgreSQL, not a mock.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: akerdock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AKERDOCK_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/akerdock?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:test@127.0.0.1:5432/akerdock?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Apply migrations to the test database
        run: go tool goose up
      # ADR-025: generated code must always match the spec and queries.
      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - name: Build
        run: make build
      # The dockerintegration files only compile with their tag: without this
      # guard they could bit-rot invisibly between pull requests (vet compiles
      # test files too; no daemon needed). Push/dispatch runs skip it — the
      # docker-integration job compiles strictly more.
      - name: Compile the Docker integration tier
        if: github.event_name == 'pull_request'
        run: make vet-docker
      # One execution produces both signals: the race detector and the
      # coverage profile the gate below analyses (-race forces atomic
      # covermode). Two separate runs would double the suite's wall-clock.
      - name: Test (race, with coverage profile)
        run: go test -race -coverprofile=cover.out -count=1 ./...
      - name: Go unit coverage gate
        run: COVERPROFILE=cover.out make go-unit-coverage

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # PRD §24.1: the OpenAPI artifact is versioned and validated in CI.
      - name: Validate OpenAPI spec
        run: make openapi-validate

  # Vulnerability & supply-chain scanning (PRD §23.5, threat-model §5.6, ISO
  # A.8.8 / SOC2 CC7.1). Tools are pinned; the SBOM (licensing-sbom.md) is
  # published as an artifact.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Go vulnerabilities that are actually REACHABLE in our code (govulncheck's
      # call-graph analysis keeps false positives low): a hard gate — except for
      # advisories with no fixed release, triaged with a written justification
      # in scripts/vulncheck-triage.txt. Any NEW advisory still breaks the build.
      - name: govulncheck (Go, triaged)
        run: bash scripts/check-govulncheck.sh
      # Dashboard advisories: production dependencies gate on high — the
      # baseline is clean, so anything caught here is new. Dev-only advisories
      # (build tooling never shipped in the bundle) stay out of the gate.
      - name: npm audit (dashboard)
        run: npm --prefix web audit --omit=dev --audit-level=high
      # Cross-ecosystem advisory scan (Go + npm lockfiles), including unfixable
      # transitive ones — reported, not yet a gate, so it informs triage without
      # breaking main. Promote to a gate once the baseline is triaged.
      - name: osv-scanner (report)
        continue-on-error: true
        run: go run github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2 -r .
      # Committed-secret scan (ISO A.8.12): a credential must never reach the
      # repository. The config allowlists known non-secrets (test fixtures,
      # docs, the generated dashboard bundle, the dummy Argon2 hash).
      - name: gitleaks (committed secrets)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 detect --no-git --redact --config .gitleaks.toml
      # Supply-chain inventory: a CycloneDX SBOM of the Go module graph
      # (licensing-sbom.md), attached to the build for auditors/consumers.
      - name: Generate SBOM (CycloneDX)
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0 mod -json -output sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  # ADR-051 integration tier: the SDK runtime implementation against a real
  # daemon (the runner's own). PRs compile-check it (see build-and-test);
  # actually driving a daemon stays on the post-merge cadence, like e2e.
  docker-integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Docker runtime integration tier
        run: make test-docker

  # ADR-028: exactly one assembled-product journey. Pull requests are gated by
  # fast unit/module tests; the expensive DinD proof runs after merge to main
  # (or explicitly on demand) and again before a release.
  e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: e2e (complete journey)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the complete E2E journey
        run: make e2e

  # The dashboard: type-checked against the generated contract (a spec drift
  # breaks HERE, not in a user's browser), unit-tested, and the Storybook
  # catalogue must build — it is the design system's source of truth for the
  # implementation (design-system §5.2).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Type-check against the contract
        run: npm --prefix web run typecheck
      - name: Unit tests
        run: npm --prefix web test
      # The binary embeds internal/web/dist, not web/src: a stale copy ships
      # an old UI no matter what the sources say (.gitignore documents this
      # contract). The Angular build is byte-deterministic for identical
      # inputs; if this step ever fails with no web/src change, suspect a
      # toolchain bump and rebuild+commit rather than loosening the check.
      - name: Check the embedded dashboard is current
        run: |
          make web
          git diff --exit-code -- internal/web/dist
      - name: Build the Storybook catalogue
        run: npm --prefix web run build-storybook

  # The artefact an operator actually installs: the distroless image and the
  # reference compose file. A binary that passes E2E but ships in an image that
  # cannot start has not shipped. Keep this Docker-heavy packaging check out of
  # the pull-request feedback loop too; the release workflow repeats it.
  dist:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Smoke-test the distribution
        run: bash scripts/dist-smoke.sh
