name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The queue's guarantees (SKIP LOCKED, leases, lock_key) are properties of
    # the SQL: they are tested against a real PostgreSQL, not a mock.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: akerdock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      AKERDOCK_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/akerdock?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:test@127.0.0.1:5432/akerdock?sslmode=disable
      GOOSE_MIGRATION_DIR: db/migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply migrations to the test database
        run: go tool goose up
      # ADR-025: generated code must always match the spec and queries.
      - name: Check generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - name: Build
        run: make build
      - name: Test
        run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # PRD §24.1: the OpenAPI artifact is versioned and validated in CI.
      - name: Validate OpenAPI spec
        run: make openapi-validate

  # Vulnerability & supply-chain scanning (PRD §23.5, threat-model §5.6, ISO
  # A.8.8 / SOC2 CC7.1). Tools are pinned; the SBOM (licensing-sbom.md) is
  # published as an artifact.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Go vulnerabilities that are actually REACHABLE in our code (govulncheck's
      # call-graph analysis keeps false positives low): a hard gate.
      - name: govulncheck (Go)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      # Dashboard advisories: gate on critical only. Transitive highs are triaged,
      # not build-breaking on day one; tighten once the baseline is clean.
      - name: npm audit (dashboard)
        run: npm --prefix web audit --audit-level=critical
      # Cross-ecosystem advisory scan (Go + npm lockfiles), including unfixable
      # transitive ones — reported, not yet a gate, so it informs triage without
      # breaking main. Promote to a gate once the baseline is triaged.
      - name: osv-scanner (report)
        continue-on-error: true
        run: go run github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2 -r .
      # Committed-secret scan (ISO A.8.12): a credential must never reach the
      # repository. The config allowlists known non-secrets (test fixtures,
      # docs, the generated dashboard bundle, the dummy Argon2 hash).
      - name: gitleaks (committed secrets)
        run: go run github.com/zricethezav/gitleaks/v8@v8.21.2 detect --no-git --redact --config .gitleaks.toml
      # Supply-chain inventory: a CycloneDX SBOM of the Go module graph
      # (licensing-sbom.md), attached to the build for auditors/consumers.
      - name: Generate SBOM (CycloneDX)
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.7.0 mod -json -output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # The dashboard: type-checked against the generated contract (a spec drift
  # breaks HERE, not in a user's browser), unit-tested, and the Storybook
  # catalogue must build — it is the design system's source of truth for the
  # implementation (design-system §5.2).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Type-check against the contract
        run: npm --prefix web run typecheck
      - name: Unit tests
        run: npm --prefix web test
      - name: Build the Storybook catalogue
        run: npm --prefix web run build-storybook
