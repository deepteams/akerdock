  /databases:
    get:
      tags: [Databases]
      operationId: listDatabases
      summary: List databases
      description: >-
        Sensitive fields (password, connection URLs) are `null`
        without `read:sensitive`.
      x-required-permission: databases:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: environment_uuid
          in: query
          required: false
          description: Filter by environment.
          schema:
            type: string
        - name: server_uuid
          in: query
          required: false
          description: Filter by server.
          schema:
            type: string
      responses:
        "200":
          description: Page of databases.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Database"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/postgresql:
    post:
      tags: [Databases]
      operationId: createPostgresqlDatabase
      summary: Create a PostgreSQL database
      description: >-
        Creates a managed PostgreSQL database (§6). Omitted credentials are
        auto-generated (64-character password). Creation performs
        no start, unless `instant_start=true`.
      x-required-permission: databases:create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseCreatePostgresql"
      responses:
        "201":
          description: Database created (credentials returned depending on permission).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    get:
      tags: [Databases]
      operationId: getDatabase
      summary: Database details
      description: >-
        `postgres_password`, `internal_url` and `external_url` require
        `read:sensitive` (otherwise `null`, `is_redacted=true`).
      x-required-permission: databases:read
      responses:
        "200":
          description: The database.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Databases]
      operationId: updateDatabase
      summary: Update a database
      description: >-
        Sensitive PATCH — `If-Match` required. Some changes
        (image, configuration, credentials) require a restart to
        take effect — the `restart_required` field of the response indicates it.
      x-required-permission: databases:update
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseUpdate"
      responses:
        "200":
          description: Database updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Databases]
      operationId: deleteDatabase
      summary: Delete a database
      description: >-
        Asynchronous deletion (§20.6). By default the data volumes
        are KEPT; `delete_volumes=true` to destroy them (INV-008).
        Refused with `409` if active backup plans reference the database
        (delete them first).
      x-required-permission: databases:delete
      parameters:
        - name: delete_volumes
          in: query
          required: false
          description: Also destroy the data volumes.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Deletion accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/start:
    parameters:
