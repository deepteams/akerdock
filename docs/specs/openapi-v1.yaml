      responses:
        "204":
          description: Channel deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notification-channels/{channel_uuid}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelUuid"
    post:
      tags: [Notifications]
      operationId: testNotificationChannel
      summary: Send a test message
      description: >-
        Immediately sends a test event on the channel and returns the
        delivery result — an invalid configuration shows up here, not at the
        first outage.
      x-required-permission: notifications:manage
      responses:
