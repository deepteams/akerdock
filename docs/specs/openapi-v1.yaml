  /teams/{team_uuid}/audit:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
    get:
      tags: [Teams]
      operationId: listTeamAudit
      summary: Team audit log
      description: >-
        The append-only audit log (§23.4): authenticated actions, secret
        access, RBAC changes, authentication (login/logout/failures/MFA).
        Paginated (cursor), filterable and scriptable (`-o json`).
      x-required-permission: audit:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          required: false
          description: Exact filter on the action (e.g. `auth.login`, `secret.reveal`).
          schema:
            type: string
        - name: action_prefix
          in: query
          required: false
          description: >-
            Keep the events whose action starts with any of these prefixes
            (e.g. `port-forward.`, `external-endpoint.`). A feature's trail is
            spread over several action names — open, close, grant, revoke — and
            asking for them one at a time gives an operator four incomplete
            lists instead of one story. Combined with `action` it narrows
            further; at most 10 prefixes.
          schema:
            type: array
            maxItems: 10
            items:
              type: string
          style: form
          explode: true
        - name: result
          in: query
          required: false
          description: Filter on the outcome.
          schema:
            type: string
            enum: [success, failure, denied]
        - name: actor_uuid
          in: query
          required: false
          description: Filter on the actor's UUID (user or token).
          schema:
            type: string
        - name: target_uuid
          in: query
          required: false
          description: Filter on the target resource's UUID.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: Lower bound (inclusive) on occurred_at (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Upper bound (inclusive) on occurred_at (RFC 3339).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Page of audit events (newest to oldest).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

