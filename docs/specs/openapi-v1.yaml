# =============================================================================
# AkerDock — API publique v1 (artefact §29.3 du PRD, docs/PRD.md)
#
# Périmètre couvert : P0 + cœur de P1 (§26.1) — system, teams/tokens,
# projects/environments, private keys, servers, applications (image Docker,
# Dockerfile, git public/privé), variables d'environnement, deployments
# (+ logs SSE), deploy webhook générique, databases PostgreSQL (+ backups),
# certificats (inventaire par serveur, renouvellement forcé), chiffrement au
# repos (état et rotation de clé maître — ADR-003), jobs (suivi, dead-letter
# retry/forget — spec deployment-engine §2.4), adoption de ressources Docker
# existantes (§20.7, ADR-013/023 — scan, adopt, disown).
#
# Volontairement HORS de cette v1 (P2/P3 ou hors scope API) :
#   - Services one-click et stacks Docker Compose (§9, P2)
#   - Preview deployments (§5.6, §20.4, P2)
#   - Cloud provisioning (Hetzner) et cloud provider tokens (§3.2, P3)
#   - GitHub Apps (P1 tardif) — les webhooks Git signés par endpoint sont, eux,
#     dans cette v1 (/applications/{uuid}/webhook-endpoint)
#   - Destinations (réseaux Docker) en tant que ressource API dédiée
#   - Moteurs de bases autres que PostgreSQL (MySQL, MariaDB, MongoDB, Redis…)
#   - Le flux WebSocket du terminal (§24.4 — WebSocket hors OpenAPI ; la
#     création de session terminal, elle, est dans cette v1 :
#     POST .../terminal-sessions), MCP, config-as-code (export/apply §24.5),
#     log drains, Sentinel
#   - Gestion des sessions/login (UI uniquement, §10.2)
#
# Décisions structurantes appliquées (§27) :
#   - §27.1  : port unique du control plane, tout sous /api/v1
#   - §27.24 : SSE pour logs/statuts (Last-Event-ID), WebSocket réservé au terminal
#   - §27.25 : spec-first — handlers Go (oapi-codegen/chi) et client TypeScript
#              générés depuis ce fichier ; operationId stables en camelCase
#   - Version OpenAPI : 3.0.3 (pas 3.1) tant qu'oapi-codegen ne supporte pas
#     3.1 — nullable via `nullable: true`, pas de `const`/`examples` de schéma.
# =============================================================================
openapi: 3.0.3

info:
  title: AkerDock API
  version: 1.0.0
  description: |
    API REST publique de AkerDock. Tous les endpoints sont servis sous
    `/api/v1` sur le port unique du control plane (§27.1).

    ## Authentification et permissions
    - Authentification par token Bearer (`Authorization: Bearer <token>`).
      Les tokens sont scopés par team, hashés côté serveur et affichés une
      seule fois à la création (§10.3).
    - L'API est désactivée par défaut ; elle s'active dans les réglages de
      l'instance ou via `POST /system/api/enable` (permission `root`).
    - Chaque opération documente sa permission minimale via l'extension
      `x-required-permission` : `read`, `read:sensitive`, `write`, `deploy`
      ou `root`. Hiérarchie : `root` inclut tout ; `write` et
      `read:sensitive` incluent `read` ; `deploy` permet de déclencher et
      suivre les déploiements et actions de lifecycle, plus la lecture des
      ressources strictement nécessaires.
    - Les secrets (valeurs de variables, clés privées, mots de passe,
      URLs de connexion) ne sont JAMAIS renvoyés sans `read:sensitive`
      (INV-003) : les champs concernés sont alors `null` et le booléen
      `is_redacted` (quand présent) vaut `true`.

    ## Format d'erreur (§24.1)
    Toutes les erreurs utilisent le schéma `Error` :
    `{ "code", "message", "details": [], "request_id" }`.
    `code` est un identifiant stable lisible machine (ex. `validation_failed`,
    `not_found`, `dependency_exists`, `version_conflict`, `rate_limited`,
    `idempotency_conflict`). Aucune stack trace ni commande sensible.

    ## Pagination par curseur
    Les collections se paginent avec `?cursor=&limit=` (limit 1–100,
    défaut 25) et répondent `{ "data": [...], "next_cursor": "..." }`.
    `next_cursor` vaut `null` sur la dernière page. Les curseurs sont
    opaques : ne pas les interpréter ni les construire.

    ## Idempotence
    Les `POST` de création, de déploiement, de backup et de restore
    acceptent l'en-tête `Idempotency-Key` (§24.1). Rejouer la même clé avec
    le même corps renvoie la réponse originale ; la même clé avec un corps
    différent renvoie `409` (`idempotency_conflict`).

    ## Concurrence optimiste (ETag / If-Match)
    Les `GET` unitaires des ressources mutables renvoient un en-tête `ETag`
    (version optimiste). Les `PATCH` sensibles exigent `If-Match` ; en cas
    de décalage, réponse `409` (`version_conflict`) dont `details` contient
    la version courante.

    ## Opérations longues (202 + job)
    Toute mutation longue (validation de serveur, start/stop/restart,
    suppression distante, backup, restore) répond `202 Accepted` avec
    `{ "job_uuid", "status_url" }` ; le suivi se fait sur
    `GET /jobs/{job_uuid}`. Un déclenchement de déploiement répond `202`
    avec `deployment_uuid` et se suit sur `GET /deployments/{uuid}`.

    ## Temps réel (§27.24)
    Les logs de déploiement sont disponibles en JSON paginé par curseur ou
    en flux SSE (`Accept: text/event-stream`), avec reprise par
    `Last-Event-ID`. Le WebSocket est réservé au terminal (hors OpenAPI).

    ## Limites
    Rate limit de référence : 200 requêtes/minute par token (parité §10.3) ;
    dépassement → `429` avec en-tête `Retry-After`.

    Tous les horodatages sont en UTC, au format RFC 3339.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: AkerDock
    url: https://github.com/deepteams/akerdock

servers:
  - url: /api/v1
    description: Control plane AkerDock (port unique, chemin relatif à l'instance).

security:
  - bearerAuth: []

tags:
  - name: System
    description: Santé, version, activation de l'API, état du chiffrement et rotation de clé maître.
  - name: Teams
    description: Teams, membres, invitations et tokens API. La gestion des sessions (login, MFA) est hors scope API (UI uniquement).
  - name: Projects
    description: Projets et environnements (hiérarchie Team → Project → Environment → Resource).
  - name: PrivateKeys
    description: Clés SSH privées. Le matériel de clé n'est jamais renvoyé sans read:sensitive.
  - name: Notifications
    description: Canaux et règles de routage des alertes (ADR-019).
  - name: S3Storages
    description: Destinations S3 des backups. Les credentials ne sortent jamais de l'instance.
  - name: Servers
    description: Serveurs cibles SSH, validation et inventaire.
  - name: Certificates
    description: Certificats TLS servis par le proxy d'un serveur — inventaire (reflet observé), expiration et renouvellement forcé.
  - name: Applications
    description: Applications (image Docker, Dockerfile, git), configuration, variables d'environnement et lifecycle.
  - name: Deployments
    description: Historique, suivi, logs (JSON ou SSE) et annulation des déploiements.
  - name: Webhooks
    description: Deploy webhook générique pour CI externes.
  - name: DnsCredentials
    description: Credentials DNS-01 des certificats wildcard.
  - name: RegistryCredentials
    description: Credentials des registries privés (docker login sur le serveur).
  - name: ScheduledTasks
    description: Crons exécutant une commande dans le container d'une ressource.
  - name: Databases
    description: Bases de données managées (v1 — PostgreSQL uniquement).
  - name: Backups
    description: Plans de backup, exécutions et restore.
  - name: Jobs
    description: Suivi des opérations asynchrones (réponses 202), inventaire des jobs et gestion de la dead-letter (retry/forget).

paths:
  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Vérification de vivacité
      description: >-
        Healthcheck non authentifié du control plane. Reste disponible même
        lorsque l'API est désactivée.
      security: []
      responses:
        "200":
          description: Le control plane est vivant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Version de l'instance
      x-required-permission: read
      responses:
        "200":
          description: Version du control plane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events:
    get:
      tags: [System]
      operationId: streamEvents
      summary: Flux SSE des événements de la team (statuts, jobs, déploiements)
      description: |
        Flux temps réel des événements de domaine de la team (ADR-024,
        §24.2) — statuts de ressources, progression des jobs et transitions
        de déploiement. Alimenté par l'outbox transactionnelle : un
        événement n'est publié que si la mutation a été committée.

        Chaque événement SSE porte `event: <event_type>` (versionné, ex.
        `deployment.succeeded.v1`), `id: <sequence>` et `data: <Event JSON>`.
        Reprise native par `Last-Event-ID` — les événements manqués sont
        rejoués depuis la séquence indiquée. Un commentaire `: keepalive`
        est émis périodiquement pour tenir la connexion ouverte.
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Flux d'événements.
          content:
            text/event-stream:
              schema:
                type: string
                description: Flux SSE — un événement par mutation publiée (schéma `Event`).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/api/enable:
    post:
      tags: [System]
      operationId: enableApi
      summary: Activer l'API
      description: >-
        Active l'API publique de l'instance. Réservé aux tokens `root`
        (§10.3 — l'API est désactivée par défaut).
      x-required-permission: root
      responses:
        "200":
          description: État de l'API après activation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/api/disable:
    post:
      tags: [System]
      operationId: disableApi
      summary: Désactiver l'API
      description: >-
        Désactive l'API publique. Après cet appel, seuls `GET /health` et la
        réactivation via l'UI restent disponibles.
      x-required-permission: root
      responses:
        "200":
          description: État de l'API après désactivation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/email:
    get:
      tags: [System]
      operationId: getTransactionalEmail
      summary: Configuration de l'email transactionnel de l'instance
      description: >-
        Email transactionnel (§14.2, amendement n°20) : celui qui porte les
        invitations. Les credentials ne sont **jamais** renvoyés — seulement le
        fait qu'ils existent.
      x-required-permission: root
      responses:
        "200":
          description: L'état de la configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionalEmail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [System]
      operationId: setTransactionalEmail
      summary: Configurer l'email transactionnel de l'instance
      description: >-
        La configuration est **vérifiée avant d'être acceptée** : un relais
        injoignable est refusé ici, pas découvert à la première invitation.
      x-required-permission: root
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionalEmailSet"
      responses:
        "200":
          description: Configuration enregistrée et vérifiée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionalEmail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/encryption:
    get:
      tags: [System]
      operationId: getEncryptionStatus
      summary: État du chiffrement au repos et de la rotation de clé maître
      description: >-
        Retourne l'état du chiffrement enveloppe (ADR-003, §23.2) : version
        de clé active, versions de clé encore référencées en base et
        compteurs de lignes par colonne chiffrée et par version. Sert à
        constater la convergence d'une rotation de clé maître — une
        ancienne version ne peut être retirée du fichier de clés que
        lorsqu'elle n'est plus référencée par aucune ligne. Ne contient
        jamais de matériel de clé. Réservé aux tokens `root`.
      x-required-permission: root
      responses:
        "200":
          description: État du chiffrement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/encryption/rotate:
    post:
      tags: [System]
      operationId: rotateEncryption
      summary: Forcer le re-chiffrement vers la version de clé active
      description: >-
        Déclenche le re-chiffrement actif de toutes les lignes portant une
        version de clé antérieure vers la version active (ADR-003) —
        nécessaire quand la réécriture paresseuse ne suffit pas (fuite
        suspectée, retrait planifié d'une ancienne version). Réécriture par
        lots, sans blocage global (§19.2). Opération longue — répond `202`
        avec un job de suivi ; `409` (`operation_in_progress`) si un
        re-chiffrement est déjà en cours. Action auditée (§23.4). Réservé
        aux tokens `root`.
      x-required-permission: root
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Re-chiffrement accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Teams
  # ---------------------------------------------------------------------------
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Lister les teams accessibles
      description: >-
        Liste les teams accessibles au token. Un token étant scopé par team,
        la liste contient en général une seule entrée (plusieurs pour un
        token `root` d'instance).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de teams.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Détail d'une team
      x-required-permission: read
      responses:
        "200":
          description: La team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}/members:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: Lister les membres d'une team
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de membres.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamMember"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}/invitations:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
    get:
      tags: [Teams]
      operationId: listTeamInvitations
      summary: Lister les invitations
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page d'invitations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Teams]
      operationId: createTeamInvitation
      summary: Inviter un membre
      description: >-
        Crée une invitation par email. L'envoi effectif requiert l'email
        transactionnel de l'instance (§14.2) ; à défaut, le lien d'invitation
        est retourné dans la ressource pour transmission manuelle.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: Invitation créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}/invitations/{invitation_uuid}:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
      - $ref: "#/components/parameters/InvitationUuid"
    delete:
      tags: [Teams]
      operationId: revokeTeamInvitation
      summary: Révoquer une invitation
      description: Révoque une invitation en attente. Le lien devient immédiatement invalide.
      x-required-permission: write
      responses:
        "204":
          description: Invitation révoquée.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}/tokens:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
    get:
      tags: [Teams]
      operationId: listApiTokens
      summary: Lister les tokens API
      description: >-
        Liste les métadonnées des tokens API de la team. La valeur du token
        n'est JAMAIS renvoyée (seul le préfixe d'identification l'est) — elle
        n'est visible qu'une seule fois, à la création (§10.3).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de tokens (métadonnées uniquement).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Teams]
      operationId: createApiToken
      summary: Créer un token API
      description: >-
        Crée un token API scopé à la team. La valeur en clair n'est présente
        que dans cette réponse (champ `token`) puis n'est plus jamais
        récupérable. Anti-élévation de privilèges : un token ne peut pas
        créer un token portant des permissions qu'il ne possède pas lui-même
        (sinon `403`).
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token créé — seule occasion de lire sa valeur en clair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}/tokens/{token_uuid}:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
      - $ref: "#/components/parameters/TokenUuid"
    delete:
      tags: [Teams]
      operationId: revokeApiToken
      summary: Révoquer un token API
      description: >-
        Révocation immédiate et définitive. Un token peut se révoquer
        lui-même. L'opération est auditée (§23.4).
      x-required-permission: write
      responses:
        "204":
          description: Token révoqué.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Projects / Environments
  # ---------------------------------------------------------------------------
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Lister les projets
      x-required-permission: read
      parameters:
