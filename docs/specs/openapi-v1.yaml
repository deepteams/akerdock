        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notification-channels/{channel_uuid}/test:
    parameters:
      - $ref: "#/components/parameters/ChannelUuid"
    post:
      tags: [Notifications]
      operationId: testNotificationChannel
      summary: Envoyer un message de test
      description: >-
        Envoie immédiatement un événement de test sur le canal et renvoie le
        résultat de l'envoi — une configuration invalide se voit ici, pas à la
        première panne.
      x-required-permission: write
      responses:
        "200":
          description: Résultat de l'envoi.
          content:
            application/json:
              schema:
                type: object
                required: [delivered]
                properties:
                  delivered:
                    type: boolean
                  error:
                    type: string
                    nullable: true
                    description: Raison de l'échec — jamais un credential.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notification-channels/{channel_uuid}/rules:
    parameters:
      - $ref: "#/components/parameters/ChannelUuid"
    get:
      tags: [Notifications]
      operationId: listNotificationRules
      summary: Lister les règles de routage d'un canal
      x-required-permission: read
      responses:
        "200":
          description: Règles du canal.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Notifications]
      operationId: createNotificationRule
      summary: Ajouter une règle de routage
      description: >-
        Route un type d'événement vers ce canal (ADR-019) : portée
        projet/environnement, seuil de sévérité, débounce anti-flapping et
        heures calmes. Un événement `critical` traverse toujours le débounce
        et les heures calmes.
      x-required-permission: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRuleCreate"
      responses:
        "201":
          description: Règle créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /notification-channels/{channel_uuid}/rules/{rule_uuid}:
    parameters:
      - $ref: "#/components/parameters/ChannelUuid"
      - name: rule_uuid
        in: path
        required: true
        description: UUID de la règle.
        schema:
          type: string
    delete:
      tags: [Notifications]
      operationId: deleteNotificationRule
      summary: Supprimer une règle de routage
      x-required-permission: write
      responses:
        "204":
          description: Règle supprimée.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # S3 Storages (destinations de backup, §7.2)
  # ---------------------------------------------------------------------------
  /s3-storages:
    get:
      tags: [S3Storages]
      operationId: listS3Storages
      summary: Lister les stockages S3
      description: >-
        Liste les destinations de backup de la team. Les credentials ne sont
        jamais renvoyés (INV-003) ; seul `is_usable` indique si un
        aller-retour écriture/lecture/suppression a réussi (§20.5).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de stockages S3.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/S3Storage"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [S3Storages]
      operationId: createS3Storage
      summary: Enregistrer un stockage S3
      description: >-
        Enregistre une destination S3 (credentials chiffrés au repos, §23.2).
        La connectivité est vérifiée immédiatement par un aller-retour
        écriture/lecture/suppression : un stockage qui échoue est créé avec
        `is_usable: false` et `last_check_error` renseigné — il ne peut pas
        être référencé par un plan de backup tant qu'il n'est pas utilisable.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/S3StorageCreate"
      responses:
        "201":
          description: Stockage enregistré (credentials jamais renvoyés).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /s3-storages/{s3_storage_uuid}:
    parameters:
      - $ref: "#/components/parameters/S3StorageUuid"
    get:
      tags: [S3Storages]
      operationId: getS3Storage
      summary: Détail d'un stockage S3
      x-required-permission: read
      responses:
        "200":
          description: Le stockage (sans credentials).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [S3Storages]
      operationId: updateS3Storage
      summary: Modifier un stockage S3
      description: >-
        Met à jour la configuration ou remplace les credentials. PATCH
        sensible — `If-Match` obligatoire (§24.1). La connectivité est
        revérifiée après modification.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/S3StorageUpdate"
      responses:
        "200":
          description: Stockage mis à jour.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [S3Storages]
      operationId: deleteS3Storage
      summary: Supprimer un stockage S3
      description: >-
        Refusé avec `409` (`dependency_exists`) tant qu'un plan de backup le
        référence (§19.2). Les objets déjà déposés dans le bucket ne sont
        jamais supprimés (INV-008).
      x-required-permission: write
      responses:
        "204":
          description: Stockage supprimé.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /s3-storages/{s3_storage_uuid}/validate:
    parameters:
      - $ref: "#/components/parameters/S3StorageUuid"
    post:
      tags: [S3Storages]
      operationId: validateS3Storage
      summary: Vérifier la connectivité d'un stockage S3
      description: >-
        Rejoue l'aller-retour écriture/lecture/suppression et met à jour
        `is_usable` et `last_check_error` (§20.5).
      x-required-permission: write
      responses:
        "200":
          description: Résultat de la vérification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Servers
  # ---------------------------------------------------------------------------
  /servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: Lister les serveurs
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de serveurs de la team.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Servers]
      operationId: createServer
      summary: Enregistrer un serveur
      description: >-
        Enregistre un serveur SSH en statut `pending` (§20.1). La clé
        référencée doit appartenir à la même team (INV-002). La validation
        effective (connectivité, Docker, prérequis) se déclenche via
        `POST /servers/{uuid}/validate`.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCreate"
      responses:
        "201":
          description: Serveur enregistré (statut `pending`).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: getServer
      summary: Détail d'un serveur
      x-required-permission: read
      responses:
        "200":
          description: Le serveur (états désiré et observé, §21.2).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Servers]
      operationId: updateServer
      summary: Modifier un serveur
      description: >-
        PATCH sensible — `If-Match` obligatoire. Changer l'adresse, le port,
        l'utilisateur ou la clé repasse le serveur en `pending` et requiert
        une nouvelle validation.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdate"
      responses:
        "200":
          description: Serveur mis à jour.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Servers]
      operationId: deleteServer
      summary: Retirer un serveur
      description: >-
        Retire le serveur de AkerDock (INV-008 — ne détruit jamais la
        machine). Refusé avec `409` (`dependency_exists`) tant que des
        ressources y sont déployées.
      x-required-permission: write
      responses:
        "204":
          description: Serveur retiré.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/ca:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: getServerCA
      summary: Certificat de la CA du serveur (SSL des bases)
      description: >-
        CA gérée par la plateforme (§6.3, amendement n°23), qui signe les
        certificats des bases de ce serveur. **Publique par nature** : c'est ce
        qu'un client doit connaître pour vérifier la base à laquelle il se
        connecte. La clé privée, elle, ne quitte jamais l'instance (chiffrée au
        repos) et n'est jamais renvoyée.
      x-required-permission: read
      responses:
        "200":
          description: Le certificat de la CA, en PEM.
          content:
            application/json:
              schema:
                type: object
                required: [ca_cert]
                properties:
                  ca_cert:
                    type: string
                    nullable: true
                    description: PEM ; `null` tant qu'aucune base SSL n'a été créée sur ce serveur.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/validate:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: validateServer
      summary: Valider un serveur et installer les prérequis
      description: >-
        Lance le workflow d'onboarding (§20.1) — connectivité SSH, host key,
        sudo, OS/architecture, disque, installation Docker et helpers, proxy.
        Opération longue — répond `202` avec un job de suivi. Chaque étape
        du job est visible et rejouable ; chaque échec produit une erreur
        distincte avec remédiation.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Validation acceptée — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/resources:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: listServerResources
      summary: Lister les ressources d'un serveur
      description: >-
        Inventaire des ressources gérées déployées sur ce serveur
        (applications et bases). Les ressources non gérées découvertes sur
        le serveur ne figurent pas ici (INV-015).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de ressources.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerResource"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/proxy/{action}:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
      - name: action
        in: path
        required: true
        description: >-
          Cycle de vie du proxy géré du serveur (§3). **`stop` coupe TOUT le
          trafic entrant du serveur** — chaque domaine routé par ce proxy
          cesse de répondre jusqu'au redémarrage.
        schema:
          type: string
          enum: [start, stop, restart]
    post:
      tags: [Servers]
      operationId: proxyLifecycle
      summary: Démarrer, arrêter ou redémarrer le proxy d'un serveur
      description: >-
        Action longue → `202` + job (§4.2). L'état désiré du proxy est
        persisté : un `stop` explicite n'est pas « réparé » par la
        réconciliation. `409` si le serveur n'a pas de proxy géré
        (`proxy_type: none`).
      x-required-permission: write
      responses:
        "202":
          description: Action acceptée — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/proxy/logs:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: getProxyLogs
      summary: Logs du proxy d'un serveur
      description: >-
        Les dernières lignes du container de proxy (§3) — lecture directe sur
        le serveur, jamais stockées. `409` si le serveur n'a pas de proxy géré.
      x-required-permission: read
      parameters:
        - name: lines
          in: query
          required: false
          description: Nombre de lignes de queue (défaut 200, max 2000).
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: Logs du proxy.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: createServerTerminalSession
      summary: Ouvrir une session terminal shell sur le serveur
      description: >-
        Crée une session terminal (§5.7, §24.4) ouvrant un shell SSH sur le
        serveur avec l'utilisateur configuré (`ssh_user`) — de fait un
        **terminal root** au sens de la matrice RBAC (§10.4), soumis au
        double contrôle : une session navigateur doit avoir été ré-authentifiée
        par **passkey** récemment (step-up — sinon `403` avec le code
        `stepup_required`), et un token API doit porter la permission `root`.
        Renvoie un **token court à usage unique** à présenter sur le WebSocket
        `websocket_path` (hors OpenAPI, §27.24). Session bornée à la team,
        auditée à l'ouverture et à la fermeture, idle timeout, durée maximum,
        kill garanti (§24.4). `409` si la team a atteint son plafond de
        sessions simultanées (`terminal_session_limit`).
      x-required-permission: write
      responses:
        "201":
          description: >-
            Session créée — le token n'est visible que dans cette réponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/adoption-scans:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: createAdoptionScan
      summary: Scanner les ressources Docker non gérées d'un serveur
      description: >-
        Inventorie les containers et stacks compose du serveur qui ne sont PAS
        gérés par AkerDock (aucun label `akerdock.*` — INV-015) et propose un
        mapping vers le modèle AkerDock (§20.7, ADR-013) : application ou
        service, volumes, variables (noms seulement — INV-003), ports, réseaux
        et domaines détectés par inspection et labels. C'est le chemin de
        migration entrant depuis n'importe quelle plateforme (ADR-023).
        Opération longue — répond `202` avec un job de suivi et l'UUID du scan
        à interroger. `409` (`operation_in_progress`) si un scan de ce serveur
        est déjà en cours.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Scan accepté — suivre le job puis lire le scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionScanAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [Servers]
      operationId: listAdoptionScans
      summary: Lister les scans d'adoption d'un serveur
      description: >-
        Historique des scans d'adoption du serveur (§20.7), du plus récent au
        plus ancien.
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de scans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdoptionScan"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /adoption-scans/{adoption_scan_uuid}:
    parameters:
      - $ref: "#/components/parameters/AdoptionScanUuid"
    get:
      tags: [Servers]
      operationId: getAdoptionScan
      summary: Lire un scan d'adoption et ses candidats
      description: >-
        Le résultat du scan (§20.7) : candidats adoptables avec leur mapping
        proposé et ce qui sera modifié, candidats non adoptables avec le
        motif — jamais d'adoption partielle silencieuse. Les valeurs des
        variables d'environnement ne figurent JAMAIS dans le scan (INV-003) :
        seuls les noms sont listés ; les valeurs sont capturées et chiffrées
        au moment de l'adoption.
      x-required-permission: read
      responses:
        "200":
          description: Le scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionScan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /adoption-scans/{adoption_scan_uuid}/adopt:
    parameters:
      - $ref: "#/components/parameters/AdoptionScanUuid"
    post:
      tags: [Servers]
      operationId: adoptResources
      summary: Adopter des candidats d'un scan, sans redéploiement
      description: >-
        Prend le contrôle des candidats sélectionnés SANS redémarrer les
        workloads (§20.7, ADR-013) : les objets AkerDock (application ou
        service, variables chiffrées, volumes, domaines) sont créés en
        pointant sur les containers existants. Le premier redéploiement
        normalise complètement la ressource (labels, noms, réseau) en
        conservant les données (volumes repris sous leur nom d'origine).
        Opération longue — répond `202` avec un job ; le résultat du job
        liste les ressources créées. `409` (`invalid_state`) si le scan n'est
        pas terminé ; `422` si un candidat est inconnu ou non adoptable.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptRequest"
      responses:
        "202":
          description: Adoption acceptée — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/domains:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: listServerDomains
      summary: Lister les domaines servis par un serveur
      description: Domaines routés par le proxy du serveur, groupés par ressource.
      x-required-permission: read
      responses:
        "200":
          description: Domaines par ressource.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerDomain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/certificates:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Certificates]
      operationId: listServerCertificates
      summary: Lister les certificats d'un serveur
      description: >-
        Inventaire des certificats TLS servis par le proxy du serveur (ACME
        HTTP-01/DNS-01, custom, fallback self-signed). Cette collection est
        un **reflet observé** (table `certificates`) : l'état réel vit dans
        `acme.json` et les fichiers du serveur, synchronisés après chaque
        application de configuration proxy et par réconciliation périodique
        (§18.3) — voir `observed_at`. Le matériel de clé privée ne quitte
        jamais le serveur et n'apparaît jamais dans l'API.
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: expiring_within_days
          in: query
          required: false
          description: >-
            Ne retourne que les certificats dont `not_after` est inférieur
            ou égal à maintenant + N jours (certificats déjà expirés
            inclus). Usage typique du monitoring d'expiration (alerte
            J-30/J-7).
          schema:
            type: integer
            minimum: 1
            maximum: 3650
        - name: status
          in: query
          required: false
          description: Filtrer par statut observé (ex. `failed`, `expired`).
          schema:
            $ref: "#/components/schemas/CertificateStatus"
      responses:
        "200":
          description: Page de certificats.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Certificate"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Certificates
  # ---------------------------------------------------------------------------
  /certificates/{certificate_uuid}:
    parameters:
      - $ref: "#/components/parameters/CertificateUuid"
    get:
      tags: [Certificates]
      operationId: getCertificate
      summary: Détail d'un certificat
      description: >-
        Détail du reflet observé d'un certificat : domaines couverts
        (wildcards inclus), émetteur, fenêtre de validité
        (`not_before`/`not_after`), statut et dernière erreur d'émission.
        `observed_at` indique la fraîcheur de l'observation.
      x-required-permission: read
      responses:
        "200":
          description: Le certificat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /certificates/{certificate_uuid}/renew:
    parameters:
      - $ref: "#/components/parameters/CertificateUuid"
    post:
      tags: [Certificates]
      operationId: renewCertificate
      summary: Forcer le renouvellement d'un certificat
      description: >-
        Force une nouvelle tentative d'émission/renouvellement ACME :
        sauvegarde puis retrait ciblé de l'entrée du storage ACME
        (`/data/akerdock/proxy/acme.json`), redémarrage du proxy qui
        retente l'émission, puis resynchronisation du reflet (statut
        `renewing` pendant l'opération). Opération longue — répond `202`
        avec un job de suivi. `409` (`operation_in_progress`) si un
        renouvellement est déjà en cours pour ce certificat ; `422`
        (`validation_failed`) pour un certificat non renouvelable par la
        plateforme (`custom`, `self_signed`). Attention aux rate limits
        Let's Encrypt : chaque échec de validation consomme du quota —
        corriger la cause (DNS, port 80, credentials DNS-01) avant de
        rejouer. Action auditée (§23.4).
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Renouvellement accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Applications
  # ---------------------------------------------------------------------------
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: Lister les applications
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: project_uuid
          in: query
          required: false
          description: Filtrer par projet.
          schema:
            type: string
        - name: environment_uuid
          in: query
          required: false
          description: Filtrer par environnement.
          schema:
            type: string
        - name: server_uuid
          in: query
          required: false
          description: Filtrer par serveur.
          schema:
            type: string
      responses:
        "200":
          description: Page d'applications.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Créer une application
      description: >-
        Crée une application dans un environnement. Le type de source est
        déterminé par le discriminant `source_type` — `docker_image` et
        `dockerfile` (P0), `git` public ou privé via `private_key_uuid` (P1).
        La création n'implique pas de déploiement, sauf `instant_deploy=true`
        (le `deployment_uuid` figure alors dans la réponse).
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application créée.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Détail et configuration d'une application
      description: >-
        Renvoie l'application complète — configuration désirée (source,
        build, domaines, ports, health check, limites) et statut observé
        (§21.2). L'en-tête `ETag` porte la version optimiste à réutiliser
        dans `If-Match` pour `PATCH`.
      x-required-permission: read
      responses:
        "200":
          description: L'application.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Modifier la configuration d'une application
      description: >-
        Mise à jour partielle de la configuration. PATCH sensible —
        `If-Match` obligatoire ; conflit de version → `409` avec la version
        courante dans `details` (§24.1). Les changements sont versionnés
        (INV-014) et ne prennent effet qu'au prochain déploiement, sauf
        champs à effet immédiat documentés dans le schéma.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application mise à jour.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Supprimer une application
      description: >-
        Suppression asynchrone (§20.6) — retire d'abord le routage, puis les
        workloads, puis l'objet logique. Par défaut les volumes persistants
        sont CONSERVÉS ; passer `delete_volumes=true` pour les détruire
        (INV-008).
      x-required-permission: write
      parameters:
        - name: delete_volumes
          in: query
          required: false
          description: Détruire aussi les volumes persistants de l'application.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Suppression acceptée — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/storages:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: listApplicationStorages
      summary: Lister les stockages persistants
      description: >-
        Volumes nommés et bind mounts de l'application (§8). Le nom d'un
        volume est préfixé par l'UUID de la ressource (anti-collision,
        INV-011).
      x-required-permission: read
      responses:
        "200":
          description: Stockages de l'application.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PersistentStorage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createApplicationStorage
      summary: Déclarer un stockage persistant
      description: >-
        Déclare un volume nommé ou un bind mount (§8). Le volume distant est
        créé au prochain déploiement, de façon idempotente ; les données
        survivent aux redéploiements et à la suppression de l'application,
        sauf `delete_volumes=true` explicite (INV-008).
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersistentStorageCreate"
      responses:
        "201":
          description: Stockage déclaré.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistentStorage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/storages/{storage_uuid}:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - $ref: "#/components/parameters/StorageUuid"
    delete:
      tags: [Applications]
      operationId: deleteApplicationStorage
      summary: Retirer un stockage persistant
      description: >-
        Retire la déclaration du stockage. Les **données distantes ne sont
        jamais détruites** par cette opération (INV-008) : le volume orphelin
        reste sur le serveur et est signalé par le cleanup. Prend effet au
        prochain déploiement.
      x-required-permission: write
      responses:
        "204":
          description: Stockage retiré de la configuration.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/envs:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: listApplicationEnvs
      summary: Lister les variables d'environnement
      description: >-
        Le jeu de PRODUCTION par défaut ; `preview=true` renvoie le jeu dédié
        aux previews (§5.6, INV-010) — dont les variables générées par la
        plateforme, comme `AKERDOCK_PREVIEW_BASIC_AUTH` (credential d'accès
        des URLs de preview, §20.4.4). Sans `read:sensitive`, le champ `value`
        de chaque variable est `null` et `is_redacted` vaut `true` (INV-003).
        Les variables `is_locked` ne révèlent jamais leur valeur, quelle que
        soit la permission.
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: preview
          in: query
          required: false
          description: Renvoie le jeu de variables des previews au lieu de celui de production.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page de variables.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvironmentVariable"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createApplicationEnv
      summary: Créer une variable d'environnement
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableCreate"
      responses:
        "201":
          description: Variable créée (valeur restituée selon permission).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [Applications]
      operationId: replaceApplicationEnvs
      summary: Remplacer en bloc les variables d'environnement
      description: >-
        Remplacement complet du jeu de variables (sémantique PUT) — les
        variables absentes du corps sont SUPPRIMÉES, les présentes sont
        créées ou mises à jour par `key`. Exception : les variables
        `is_locked` existantes absentes du corps sont conservées (elles ne
        peuvent être supprimées qu'unitairement). Équivalent de la vue
        Developer / éditeur bulk (§5.4).
      x-required-permission: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/EnvironmentVariableCreate"
      responses:
        "200":
          description: Jeu de variables après remplacement.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvironmentVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/envs/{env_uuid}:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - $ref: "#/components/parameters/EnvUuid"
    patch:
      tags: [Applications]
      operationId: updateApplicationEnv
      summary: Modifier une variable d'environnement
      description: >-
        Une variable `is_locked` ne peut pas être rééditée (valeur en écriture
        seule définitive) — seule sa suppression puis recréation est possible
        (§5.4).
      x-required-permission: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableUpdate"
      responses:
        "200":
          description: Variable mise à jour.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Applications]
      operationId: deleteApplicationEnv
      summary: Supprimer une variable d'environnement
      x-required-permission: write
      responses:
        "204":
          description: Variable supprimée.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/start:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: startApplication
      summary: Démarrer une application
      description: >-
        Passe l'état désiré à `running` et démarre les containers existants
        (sans rebuild). Opération distante longue — `202` + job.
      x-required-permission: deploy
      responses:
        "202":
          description: Démarrage accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/stop:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: stopApplication
      summary: Arrêter une application
      description: >-
        Passe l'état désiré à `stopped` et arrête les containers (délai de
        grâce configuré sur l'application). `202` + job.
      x-required-permission: deploy
      responses:
        "202":
          description: Arrêt accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/restart:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: restartApplication
      summary: Redémarrer une application
      description: Redémarre les containers sans rebuild. `202` + job.
      x-required-permission: deploy
      responses:
        "202":
          description: Redémarrage accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/disown:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: disownApplication
      summary: Désadopter une application — rendue non gérée, jamais détruite
      description: >-
        Inverse de l'adoption (§20.7, ADR-013) : AkerDock retire son routage
        éventuel puis oublie la ressource — les containers, volumes et
        fichiers distants restent EXACTEMENT en l'état. Fonctionne sur toute
        application, adoptée ou non : c'est le chemin de sortie sans
        destruction. Opération longue — répond `202` avec un job.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Désadoption acceptée — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
