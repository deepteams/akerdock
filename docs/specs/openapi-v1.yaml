      summary: Components of an application using the compose build pack
      description: >-
        The stack's sub-containers (one per service of the compose file,
        compose-spec.md, data dictionary §9.2), with their individual
        observed status. Synchronized at each deployment. Empty for other
        build packs.
      x-required-permission: applications:read
      responses:
        "200":
          description: The stack's components.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceComponent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
