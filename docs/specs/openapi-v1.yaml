        for an inline stack — with no source to clone, there is nothing to
        build; services deploy images. Creation does not
        deploy, unless `instant_deploy=true`.
      x-required-permission: services:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
