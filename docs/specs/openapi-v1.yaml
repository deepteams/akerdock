  # ---------------------------------------------------------------------------
  /deploy:
    get:
      tags: [Webhooks]
      operationId: webhookDeploy
      summary: Trigger deployments by UUID or tag (CI webhook)
      description: >-
        Generic deploy webhook for external CIs (§5.5) — authenticated with a
        `deploy` Bearer token. Targets one or more resources by `uuid`
        (comma-separated list) and/or all resources carrying a
        `tag`. At least one of the two parameters is required. Accepted as GET
        for compatibility with systems that can only emit GETs;
        POST is the recommended form.
      x-required-permission: deploy
      parameters:
        - $ref: "#/components/parameters/WebhookUuid"
        - $ref: "#/components/parameters/WebhookTag"
        - $ref: "#/components/parameters/WebhookForce"
      responses:
