  # ---------------------------------------------------------------------------
  # Private keys
  # ---------------------------------------------------------------------------
  /private-keys:
    get:
      tags: [PrivateKeys]
      operationId: listPrivateKeys
      summary: Lister les clés privées
      description: >-
        Liste les métadonnées des clés (nom, fingerprint, clé publique). Le
        champ `private_key` est toujours `null` dans les listes, quelle que
        soit la permission.
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de clés (sans matériel privé).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrivateKey"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [PrivateKeys]
      operationId: createPrivateKey
      summary: Enregistrer une clé privée
      description: >-
        Enregistre une clé SSH privée (stockée chiffrée, §23.2). La réponse
        ne contient jamais le matériel privé, même avec `read:sensitive`
        immédiatement après création.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateKeyCreate"
      responses:
        "201":
          description: Clé enregistrée (métadonnées uniquement).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /private-keys/{private_key_uuid}:
    parameters:
      - $ref: "#/components/parameters/PrivateKeyUuid"
    get:
      tags: [PrivateKeys]
      operationId: getPrivateKey
      summary: Détail d'une clé privée
      description: >-
        Renvoie les métadonnées de la clé. Le champ `private_key` n'est
        renseigné que si le token possède `read:sensitive` ET que le
        paramètre `reveal=true` est passé explicitement ; sinon il vaut
        `null` et `is_redacted` vaut `true`. Chaque révélation est auditée
        (§23.4).
      x-required-permission: read
      parameters:
        - name: reveal
          in: query
          required: false
          description: >-
            Demande explicite de révélation du matériel privé. Requiert
            `read:sensitive` (sinon `403`).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: La clé (matériel privé selon permission et `reveal`).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [PrivateKeys]
      operationId: updatePrivateKey
      summary: Modifier une clé privée
      description: >-
        Met à jour le nom, la description ou remplace le matériel de clé
        (rotation). PATCH sensible — `If-Match` obligatoire (§24.1).
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateKeyUpdate"
      responses:
        "200":
          description: Clé mise à jour (métadonnées uniquement).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [PrivateKeys]
      operationId: deletePrivateKey
      summary: Supprimer une clé privée
      description: >-
        Refusé avec `409` (`dependency_exists`) tant que la clé est
        référencée par un serveur ou une application (§19.2).
      x-required-permission: write
      responses:
        "204":
          description: Clé supprimée.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"




  /applications/{application_uuid}/webhook-endpoint:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: createWebhookEndpoint
      summary: Créer l'endpoint de webhook Git de l'application
      description: >-
        Génère l'URL de réception et le secret HMAC à coller dans l'interface
        du fournisseur (§5.1). Le secret est renvoyé **une seule fois** : il
        est chiffré au repos et jamais relu (§23.2). Un push sur la branche
        déployée déclenche alors un déploiement, sous réserve des politiques
        (`auto_deploy`, `[skip ci]`, `watch_paths`).
      x-required-permission: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreate"
      responses:
        "201":
          description: Endpoint créé — le secret n'est visible que dans cette réponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Applications]
      operationId: deleteWebhookEndpoint
      summary: Supprimer l'endpoint de webhook Git
      x-required-permission: write
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [github, gitlab, gitea]
      responses:
        "204":
          description: Endpoint supprimé — les livraisons suivantes répondront 404.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Notifications (§11, ADR-019)
  # ---------------------------------------------------------------------------
  /notification-channels:
    get:
      tags: [Notifications]
      operationId: listNotificationChannels
      summary: Lister les canaux de notification
      description: >-
        Liste les canaux de la team. La configuration (URL de webhook, token
        de bot) n'est jamais renvoyée (INV-003).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de canaux.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationChannel"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Notifications]
      operationId: createNotificationChannel
      summary: Créer un canal de notification
      description: >-
        Enregistre un canal (configuration chiffrée au repos, §23.2). Les
        types `smtp`, `resend`, `telegram` et `pushover` sont déclarés par le
        modèle mais refusés en `422` tant qu'ils ne sont pas implémentés —
        jamais acceptés puis ignorés silencieusement.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelCreate"
      responses:
        "201":
          description: Canal créé.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

