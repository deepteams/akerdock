  # ---------------------------------------------------------------------------
  # Uptime monitoring (ADR-017) — HTTP/TCP checks executed from the control
  # plane, OUTSIDE the monitored workload; up/down and latency, no APM. The
  # transitions (thresholds crossed) feed the notification channels (§11).
  # ---------------------------------------------------------------------------
  /uptime-checks:
    get:
      tags: [Uptime]
      operationId: listUptimeChecks
      summary: List the team's uptime checks
      x-required-permission: uptime:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of checks.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UptimeCheck"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Uptime]
      operationId: createUptimeCheck
      summary: Create an uptime check
      description: >-
        HTTP check (public URL, up = response < 400) or TCP check (public
        host:port, up = connection). Private, loopback, link-local, metadata
        and reserved destinations are rejected after DNS resolution on every
        connection. Probed from the control plane every
        `interval_seconds`; the verdict only flips after
        `failure_threshold` consecutive failures (and recovers after
        `success_threshold` successes) — anti-flapping lives in the
        thresholds, not in the notifier. The effective granularity is bounded
        by the scheduler tick.
      x-required-permission: uptime:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UptimeCheckCreate"
      responses:
        "201":
          description: Check created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /uptime-checks/{uptime_check_uuid}:
    parameters:
      - $ref: "#/components/parameters/UptimeCheckUuid"
    get:
      tags: [Uptime]
      operationId: getUptimeCheck
