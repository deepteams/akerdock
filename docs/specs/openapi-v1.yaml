# =============================================================================
# AkerDock — public API v1 (PRD artifact §29.3, docs/PRD.md)
#
# Covered scope: P0 + core of P1 (§26.1) — system, teams/tokens,
# projects/environments, private keys, servers, applications (Docker image,
# Dockerfile, public/private git), environment variables, deployments
# (+ SSE logs), generic deploy webhook, PostgreSQL databases (+ backups),
# certificates (per-server inventory, forced renewal), encryption at
# rest (state and master key rotation — ADR-003), jobs (tracking, dead-letter
# retry/forget — deployment-engine spec §2.4), adoption of existing Docker
# resources (§20.7, ADR-013/023 — scan, adopt, disown).
#
# Deliberately OUT of this v1 (P2/P3 or out of API scope):
#   - One-click services and Docker Compose stacks (§9, P2)
#   - Preview deployments (§5.6, §20.4, P2)
#   - Cloud provisioning and cloud provider tokens: removed from scope (ADR-027)
#   - GitHub Apps (late P1) — per-endpoint signed Git webhooks, however, are
#     in this v1 (/applications/{uuid}/webhook-endpoint)
#   - Destinations (Docker networks) as a dedicated API resource
#   - Database engines other than PostgreSQL (MySQL, MariaDB, MongoDB, Redis…)
#   - The terminal WebSocket stream (§24.4 — WebSocket is outside OpenAPI; the
#     terminal session creation, however, is in this v1:
#     POST .../terminal-sessions), MCP, config-as-code (export/apply §24.5),
#     log drains, Sentinel
#   - The CLI TCP tunnel WebSocket stream (`/tunnel/ws`, subprotocol
#     akerdock-tunnel-v1, ADR-032) — the session CREATION (.../port-forwards)
#     is, however, in this v1; the stream protocol is normative in
#     docs/specs/cli.md §7
#   - The CLI authentication endpoints (`/auth/cli/start|approve|token`,
#     ADR-031) — out of contract like /auth/*, normative in docs/specs/cli.md §5
#   - Session/login management (UI only, §10.2), including invitation
#     acceptance (`POST /auth/invitations/accept`, ADR-038 — session + CSRF)
#
# Structuring decisions applied (§27):
#   - §27.1  : single control plane port, everything under /api/v1
#   - §27.24 : SSE for logs/statuses (Last-Event-ID), WebSocket reserved for the terminal
#   - §27.25 : spec-first — Go handlers (oapi-codegen/chi) and TypeScript client
#              generated from this file; stable camelCase operationIds
#   - OpenAPI version: 3.0.3 (not 3.1) as long as oapi-codegen does not support
#     3.1 — nullable via `nullable: true`, no schema-level `const`/`examples`.
# =============================================================================
openapi: 3.0.3

info:
  title: AkerDock API
  version: 1.0.0
  description: |
    Public REST API of AkerDock. All endpoints are served under
    `/api/v1` on the control plane's single port (§27.1).

    ## Authentication and permissions
    - Authentication via Bearer token (`Authorization: Bearer <token>`).
      Tokens are scoped per team, hashed server-side and shown only
      once at creation (§10.3).
    - The API is disabled by default; it is enabled in the instance
      settings or via `POST /system/api/enable` (`root` permission).
    - Each operation documents its minimal permission through the
      `x-required-permission` extension: `read`, `read:sensitive`, `write`,
      `deploy` or `root`. Hierarchy: `root` includes everything; `write` and
      `read:sensitive` include `read`; `deploy` allows triggering and
      tracking deployments and lifecycle actions, plus reading the
      strictly necessary resources.
    - Secrets (variable values, private keys, passwords,
      connection URLs) are NEVER returned without `read:sensitive`
      (INV-003): the affected fields are then `null` and the boolean
      `is_redacted` (when present) is `true`.

    ## Error format (§24.1)
    All errors use the `Error` schema:
    `{ "code", "message", "details": [], "request_id" }`.
    `code` is a stable machine-readable identifier (e.g. `validation_failed`,
    `not_found`, `dependency_exists`, `version_conflict`, `rate_limited`,
    `idempotency_conflict`). No stack traces or sensitive commands.

    ## Cursor pagination
    Collections are paginated with `?cursor=&limit=` (limit 1–100,
    default 25) and respond `{ "data": [...], "next_cursor": "..." }`.
    `next_cursor` is `null` on the last page. Cursors are
    opaque: do not interpret or construct them.

    ## Idempotency
    Creation, deployment, backup and restore `POST` requests
    accept the `Idempotency-Key` header (§24.1). Replaying the same key with
    the same body returns the original response; the same key with a
    different body returns `409` (`idempotency_conflict`).

    ## Optimistic concurrency (ETag / If-Match)
    Single-resource `GET`s of mutable resources return an `ETag` header
    (optimistic version). Sensitive `PATCH`es require `If-Match`; on
    mismatch, a `409` response (`version_conflict`) whose `details` contains
    the current version.

    ## Long-running operations (202 + job)
    Any long-running mutation (server validation, start/stop/restart,
    remote deletion, backup, restore) responds `202 Accepted` with
    `{ "job_uuid", "status_url" }`; progress is tracked on
    `GET /jobs/{job_uuid}`. Triggering a deployment responds `202`
    with `deployment_uuid` and is tracked on `GET /deployments/{uuid}`.

    ## Real time (§27.24)
    Deployment logs are available as cursor-paginated JSON or
    as an SSE stream (`Accept: text/event-stream`), with resume via
    `Last-Event-ID`. WebSocket is reserved for the terminal (outside OpenAPI).

    ## Limits
    Reference rate limit: 200 requests/minute per token (parity §10.3);
    exceeding it → `429` with a `Retry-After` header.

    All timestamps are in UTC, in RFC 3339 format.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: AkerDock
    url: https://github.com/deepteams/akerdock

servers:
  - url: /api/v1
    description: AkerDock control plane (single port, path relative to the instance).

security:
  - bearerAuth: []

tags:
  - name: System
    description: Health, version, API enablement, encryption state and master key rotation.
  - name: Teams
    description: Teams, members, invitations and API tokens. Session management (login, MFA) is out of API scope (UI only).
  - name: Projects
    description: Projects and environments (hierarchy Team → Project → Environment → Resource).
  - name: PrivateKeys
    description: Private SSH keys. Key material is never returned without read:sensitive.
  - name: Notifications
    description: Alert channels and routing rules (ADR-019).
  - name: S3Storages
    description: S3 backup destinations. Credentials never leave the instance.
  - name: Servers
    description: SSH target servers, validation and inventory.
  - name: Certificates
    description: TLS certificates served by a server's proxy — inventory (observed reflection), expiration and forced renewal.
  - name: Applications
    description: Applications (Docker image, Dockerfile, git), configuration, environment variables and lifecycle.
  - name: Deployments
    description: History, tracking, logs (JSON or SSE) and cancellation of deployments.
  - name: Webhooks
    description: Generic deploy webhook for external CIs.
  - name: DnsCredentials
    description: DNS-01 credentials for wildcard certificates.
  - name: RegistryCredentials
    description: Private registry credentials (sent per request over the typed agent channel, ADR-055).
  - name: ScheduledTasks
    description: Crons running a command inside a resource's container.
  - name: Databases
    description: Managed databases (v1 — PostgreSQL only).
  - name: Backups
    description: Backup plans, runs and restore.
  - name: Jobs
    description: Tracking of asynchronous operations (202 responses), job inventory and dead-letter management (retry/forget).
  - name: ExternalEndpoints
    description: >-
      Declared bastion targets outside the server (ADR-045) and the access
      grants that gate tunnels to them.
  - name: Ingress
    description: >-
      Declared public URLs relayed to a developer's machine (ADR-060) and
      their attach sessions.

paths:
  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      description: >-
        Unauthenticated healthcheck of the control plane. Remains available
        even when the API is disabled.
      security: []
      responses:
        "200":
          description: The control plane is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /version:
    get:
      tags: [System]
      operationId: getVersion
      summary: Instance version
      x-required-permission: read
      responses:
        "200":
          description: Control plane version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /permissions:
    get:
      tags: [Teams]
      operationId: listPermissions
      summary: Catalog of granular permissions
      description: >-
        The catalog of granular permissions (ADR-038) with their prerequisites:
        everything needed to build the custom role composer on the UI side.
        Static — does not depend on the team.
      x-required-permission: roles:read
      responses:
        "200":
          description: Permission catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionCatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events:
    get:
      tags: [System]
      operationId: streamEvents
      summary: SSE stream of team events (statuses, jobs, deployments)
      description: |
        Real-time stream of the team's domain events (ADR-024,
        §24.2) — resource statuses, job progress and deployment
        transitions. Fed by the transactional outbox: an event
        is only published if the mutation has been committed.

        Each SSE event carries `event: <event_type>` (versioned, e.g.
        `deployment.succeeded.v1`), `id: <sequence>` and `data: <Event JSON>`.
        Native resume via `Last-Event-ID` — missed events are
        replayed from the given sequence. A `: keepalive` comment
        is emitted periodically to keep the connection open.
      x-required-permission: audit:read
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream — one event per published mutation (`Event` schema).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/api/enable:
    post:
      tags: [System]
      operationId: enableApi
      summary: Enable the API
      description: >-
        Enables the instance's public API. Restricted to `root` tokens
        (§10.3 — the API is disabled by default).
      x-required-permission: instance:manage
      responses:
        "200":
          description: API state after enablement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/api/disable:
    post:
      tags: [System]
      operationId: disableApi
      summary: Disable the API
      description: >-
        Disables the public API. After this call, only `GET /health` and
        re-enablement via the UI remain available.
      x-required-permission: instance:manage
      responses:
        "200":
          description: API state after disablement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/instance:
    get:
      tags: [System]
      operationId: getInstanceSettings
      summary: Instance identity settings
      description: >-
        FQDN and ACME email (§14.2). Environment variables only
        seed these values at first startup (§6.2) — afterwards this is where
        they are read and modified.
      x-required-permission: instance:manage
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [System]
      operationId: setInstanceSettings
      summary: Update the instance FQDN and ACME email
      description: >-
        A non-empty FQDN implies an instance served over HTTPS: session
        cookies become `Secure` (at the next restart of the binary) and
        public URLs (invitations, OAuth callbacks, previews) are built
        with `https://`. Clearing it allows plain HTTP — trusted networks
        only.
      x-required-permission: instance:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceIdentityUpdate"
      responses:
        "200":
          description: Settings saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/email:
    get:
      tags: [System]
      operationId: getTransactionalEmail
      summary: Instance transactional email configuration
      description: >-
        Transactional email (§14.2, amendment #20): the one that carries
        invitations. Credentials are **never** returned — only the
        fact that they exist.
      x-required-permission: instance:manage
      responses:
        "200":
          description: The configuration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionalEmail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [System]
      operationId: setTransactionalEmail
      summary: Configure the instance transactional email
      description: >-
        The configuration is **verified before being accepted**: an
        unreachable relay is rejected here, not discovered at the first invitation.
      x-required-permission: instance:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionalEmailSet"
      responses:
        "200":
          description: Configuration saved and verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionalEmail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/telemetry:
    get:
      tags: [System]
      operationId: getTelemetry
      summary: Remote OTLP export configuration
      description: >-
        OpenTelemetry export (§14.2, ADR-008/§27.8): where traces,
        metrics and logs go. Auth headers are **never** returned —
        only the fact that they exist.
      x-required-permission: instance:manage
      responses:
        "200":
          description: The configuration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [System]
      operationId: setTelemetry
      summary: Configure the remote OTLP export
      description: >-
        Records where to export traces/metrics/logs. **Takes effect at the
        next restart** of the binary (telemetry initializes once at boot).
        An empty `endpoint` disables the export.
      x-required-permission: instance:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryConfigSet"
      responses:
        "200":
          description: Configuration saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/audit:
    get:
      tags: [System]
      operationId: listInstanceAudit
      summary: Instance-wide audit log
      description: >-
        The append-only audit log (§23.4) across the WHOLE instance — all
        teams AND team-less system/instance actions (key rotation,
        instance settings…), which no per-team view shows. Restricted to
        the instance administrator. Paginated, filterable.
      x-required-permission: instance:audit
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [success, failure, denied]
        - name: actor_uuid
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Page of audit events (newest to oldest).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/encryption:
    get:
      tags: [System]
      operationId: getEncryptionStatus
      summary: State of encryption at rest and master key rotation
      description: >-
        Returns the state of envelope encryption (ADR-003, §23.2): active
        key version, key versions still referenced in the database and
        row counts per encrypted column and per version. Used to
        confirm the convergence of a master key rotation — an
        old version can only be removed from the key file once
        it is no longer referenced by any row. Never contains
        key material. Restricted to `root` tokens.
      x-required-permission: instance:encryption
      responses:
        "200":
          description: Encryption state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/encryption/rotate:
    post:
      tags: [System]
      operationId: rotateEncryption
      summary: Force re-encryption to the active key version
      description: >-
        Triggers active re-encryption of all rows carrying a key
        version older than the active one (ADR-003) —
        needed when lazy rewriting is not enough (suspected
        leak, planned removal of an old version). Rewrites in
        batches, without a global lock (§19.2). Long-running operation —
        responds `202` with a tracking job; `409` (`operation_in_progress`)
        if a re-encryption is already in progress. Audited action (§23.4).
        Restricted to `root` tokens.
      x-required-permission: instance:encryption
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Re-encryption accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/oauth-providers:
    get:
      tags: [System]
      operationId: listOauthProviders
      summary: OAuth/OIDC providers configured for dashboard login
      description: >-
        Identity providers for dashboard login (§10.2, amendment #30):
        Azure/Bitbucket/GitHub/GitLab/Google OAuth and generic OIDC SSO. The
        client secret is **never** returned (INV-003) — only the fact
        that a provider is configured and enabled. The login flow itself
        lives outside this contract (`/auth/oauth/*`, UI only — §10.2).
      x-required-permission: instance:manage
      responses:
        "200":
          description: The configured providers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OauthProviderConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /system/oauth-providers/{oauth_provider}:
    put:
      tags: [System]
      operationId: setOauthProvider
      summary: Configure an OAuth/OIDC provider
      description: >-
        Replaces the provider configuration (idempotent upsert). The
        client secret follows the secret store (envelope-encrypted, §23.2) and
        is never returned. `issuer_url` is required for `oidc` and
        `azure` (OpenID Connect discovery) and rejected for providers
        with fixed endpoints. Strict validation of the login-side flow: issuer,
        audience, nonce and PKCE (§23.3). Audited action (§23.4).
      x-required-permission: instance:manage
      parameters:
        - $ref: "#/components/parameters/OauthProviderName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthProviderSet"
      responses:
        "200":
          description: Configuration saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthProviderConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [System]
      operationId: deleteOauthProvider
      summary: Remove an OAuth/OIDC provider
      description: >-
        Removes the configuration: the button disappears from the login page.
        Already-linked identities are kept — they become usable again
        if the provider is reconfigured; the affected accounts
        keep their other credentials (password, passkey). Audited.
      x-required-permission: instance:manage
      parameters:
        - $ref: "#/components/parameters/OauthProviderName"
      responses:
        "204":
          description: Provider removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Teams
  # ---------------------------------------------------------------------------
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: List accessible teams
      description: >-
        Lists the teams accessible to the token. Since a token is scoped per
        team, the list generally contains a single entry (several for an
        instance `root` token).
      x-required-permission: team:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of teams.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team
      description: >-
        Creates a team on the instance. Reserved to the instance root
        (`instance:manage`): teams are the isolation boundary of every
        resource (INV-002), so their creation is an instance-level act, not a
        team-level one. The caller becomes `admin` of the new team so it is
        immediately usable.
      x-required-permission: instance:manage
      requestBody:
        required: true
