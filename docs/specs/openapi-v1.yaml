      operationId: listBackupPlans
      summary: List a database's backup plans
      x-required-permission: backups:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of plans.
          content:
            application/json:
              schema:
                type: object
