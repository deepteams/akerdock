    post:
      tags: [Applications]
      operationId: rollbackApplication
      summary: Rollback vers une image précédente
      description: >-
        Redéploie une image antérieure vérifiée — par `deployment_uuid` ou
        `image_digest` explicite, sinon la dernière image précédente encore
        disponible (registry par digest OCI si configuré, sinon rétention
        locale, §27.6). L'artifact demandé doit encore exister → sinon `409`.
      x-required-permission: deploy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                Cible du rollback. `deployment_uuid` et `image_digest` sont
                mutuellement exclusifs ; corps vide = artifact précédent le
                plus récent.
              properties:
                deployment_uuid:
                  type: string
                  description: Déploiement réussi dont l'image doit être redéployée.
                image_digest:
                  type: string
                  description: Digest OCI explicite (ex. sha256:…).
      responses:
        "202":
          description: Rollback mis en file (déploiement de type rollback).
          content:
