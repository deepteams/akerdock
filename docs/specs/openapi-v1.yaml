  /applications/{application_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: createApplicationTerminalSession
      summary: Ouvrir une session terminal dans le container de l'application
      description: >-
        Crée une session terminal (§5.7, §24.4) vers le container courant de
        l'application et renvoie un **token court à usage unique** à présenter
        sur le WebSocket `websocket_path` (hors OpenAPI, §27.24). Le token
        n'est renvoyé qu'une seule fois et expire en quelques dizaines de
        secondes ; la session est bornée à la team, auditée à l'ouverture et
        à la fermeture, soumise à un idle timeout et à une durée maximum,
        avec kill garanti à la déconnexion (§24.4). Les frappes ne sont pas
        enregistrées. `409` si la team a atteint son plafond de sessions
        simultanées (`terminal_session_limit`).
      x-required-permission: write
      responses:
        "201":
          description: >-
            Session créée — le token n'est visible que dans cette réponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/deploy:
