      tags: [Databases]
      operationId: createPostgresqlDatabase
      summary: Créer une base PostgreSQL
      description: >-
        Crée une base PostgreSQL managée (§6). Les credentials omis sont
        auto-générés (mot de passe 64 caractères). La création n'effectue
        aucun démarrage, sauf `instant_start=true`.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseCreatePostgresql"
      responses:
        "201":
          description: Base créée (credentials restitués selon permission).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}:
    parameters:
