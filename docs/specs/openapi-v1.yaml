  /databases/{database_uuid}/restart:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    post:
      tags: [Databases]
      operationId: restartDatabase
      summary: Redémarrer une base
      x-required-permission: deploy
      responses:
        "202":
          description: Redémarrage accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    post:
      tags: [Databases]
      operationId: createDatabaseTerminalSession
      summary: Ouvrir une session terminal dans le container de la base
      description: >-
        Crée une session terminal (§5.7, §24.4) vers le container de la base
        managée (shell du container — `psql` y est disponible) et renvoie un
        **token court à usage unique** à présenter sur le WebSocket
        `websocket_path` (hors OpenAPI, §27.24). Mêmes garanties que le
        terminal d'application : token une seule fois, session bornée à la
        team, auditée, idle timeout, durée maximum, kill garanti (§24.4).
        `409` si la team a atteint son plafond de sessions simultanées
        (`terminal_session_limit`).
      x-required-permission: write
      responses:
        "201":
          description: >-
            Session créée — le token n'est visible que dans cette réponse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Backups
  # ---------------------------------------------------------------------------
  /databases/{database_uuid}/backups:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    get:
      tags: [Backups]
      operationId: listBackupPlans
      summary: Lister les plans de backup d'une base
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de plans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupPlan"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Backups]
      operationId: createBackupPlan
      summary: Créer un plan de backup
      description: >-
        Plan de backup planifié (§7.1) — cron ou alias (`daily`, `hourly`…),
        destination locale et/ou S3, règles de rétention séparées (§7.2).
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPlanCreate"
      responses:
        "201":
          description: Plan créé.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/backups/{backup_plan_uuid}:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
      - $ref: "#/components/parameters/BackupPlanUuid"
    get:
      tags: [Backups]
      operationId: getBackupPlan
      summary: Détail d'un plan de backup
      x-required-permission: read
      responses:
        "200":
          description: Le plan.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Backups]
      operationId: updateBackupPlan
      summary: Modifier un plan de backup
      description: PATCH sensible — `If-Match` obligatoire.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupPlanUpdate"
      responses:
        "200":
          description: Plan mis à jour.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Backups]
      operationId: deleteBackupPlan
      summary: Supprimer un plan de backup
      description: >-
        Supprime le plan et sa planification. Les exécutions passées et
        leurs fichiers de backup sont conservés selon la rétention — jamais
        supprimés implicitement (INV-008).
      x-required-permission: write
      responses:
        "204":
          description: Plan supprimé.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/backups/{backup_plan_uuid}/execute:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
      - $ref: "#/components/parameters/BackupPlanUuid"
    post:
      tags: [Backups]
      operationId: executeBackupPlan
      summary: Lancer un backup immédiat (Backup Now)
      description: >-
        Exécute le plan immédiatement, hors planification (§7.1). Une seule
        exécution simultanée par plan (verrou §20.5) → `409` si une
        exécution est déjà en cours.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Backup accepté — suivre le job et l'exécution créée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupExecutionAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/backups/{backup_plan_uuid}/drill:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
      - $ref: "#/components/parameters/BackupPlanUuid"
    post:
      tags: [Backups]
      operationId: runRestoreDrill
      summary: Lancer immédiatement un restore drill
      description: >-
        Restaure le dernier backup réussi dans une base **jetable** sur le même
        serveur, recompte ce qui est revenu, puis détruit la base. Même chemin
        que le drill périodique. `409` si le plan n'a aucun backup réussi à
        restaurer — il n'y a alors rien à prouver.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Drill accepté.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/backups/{backup_plan_uuid}/drills:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
      - $ref: "#/components/parameters/BackupPlanUuid"
    get:
      tags: [Backups]
      operationId: listRestoreDrills
      summary: Historique des restore drills d'un plan
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page de drills.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestoreDrill"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/backups/{backup_plan_uuid}/executions:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
      - $ref: "#/components/parameters/BackupPlanUuid"
    get:
      tags: [Backups]
      operationId: listBackupExecutions
      summary: Lister les exécutions d'un plan de backup
      description: >-
        Historique des exécutions (statut, fichier, taille, upload S3,
        §7.3), du plus récent au plus ancien. Un succès local avec échec S3
        apparaît en statut `partial`, jamais en succès global (§20.5).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page d'exécutions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupExecution"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/backups/{backup_plan_uuid}/executions/{execution_uuid}/restore:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
      - $ref: "#/components/parameters/BackupPlanUuid"
      - $ref: "#/components/parameters/ExecutionUuid"
    post:
      tags: [Backups]
      operationId: restoreBackupExecution
      summary: Restaurer une base depuis une exécution de backup
      description: >-
        Opération destructive et confirmée (§20.5) — le corps DOIT porter
        `confirm=true`, sinon `422`. Le format du backup est testé avant
        exécution ; un restore vers une base non vide exige en plus
        `allow_non_empty=true`. Journal complet dans le job. `409` si un
        restore ou un backup est déjà en cours sur la base.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Restore accepté — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Jobs
  # ---------------------------------------------------------------------------
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Lister les jobs
      description: >-
        Liste paginée des jobs de la team (INV-002), du plus récent au plus
        ancien. Usage principal : inventaire de la **dead-letter**
        (`?status=dead_letter`) — les jobs en dead-letter ne sont jamais
        rejoués automatiquement et sont conservés jusqu'à intervention
        (retry/forget, §21.3).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: Filtrer par statut (ex. `dead_letter`).
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: queue
          in: query
          required: false
          description: Filtrer par file logique (ex. `deploy`, `backup`, `cleanup`, `maintenance` — §24.3).
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filtrer par type de job (ex. `resource.delete`, `backup.execute`).
          schema:
            type: string
      responses:
        "200":
          description: Page de jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /jobs/{job_uuid}:
    parameters:
      - $ref: "#/components/parameters/JobUuid"
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Suivi d'une opération asynchrone
      description: >-
        Retourne l'état d'un job créé par une réponse `202` (machine à états
        §21.3), avec ses étapes, sa progression et son résultat ou son
        erreur. Les jobs sont scopés par team comme toute ressource
        (INV-002).
      x-required-permission: read
      responses:
        "200":
          description: Le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /jobs/{job_uuid}/retry:
    parameters:
      - $ref: "#/components/parameters/JobUuid"
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Rejouer un job en dead-letter
      description: >-
        Rejeu depuis la dead-letter (spec deployment-engine §2.4) : action
        manuelle **auditée** (§23.4) qui crée une **nouvelle tentative
        liée** — un nouveau job est mis en file avec `retry_of_uuid`
        pointant vers le job d'origine ; le job d'origine n'est jamais
        remis en file (l'historique des tentatives est préservé). Corriger
        la cause racine avant de rejouer, sinon la nouvelle tentative
        échouera à l'identique. `409` (`invalid_state`) si le job n'est pas
        en `dead_letter`.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Nouvelle tentative liée créée — suivre le nouveau job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /jobs/{job_uuid}/forget:
    parameters:
      - $ref: "#/components/parameters/JobUuid"
    post:
      tags: [Jobs]
      operationId: forgetJob
      summary: Abandonner un job en dead-letter
      description: >-
        Clôture définitive **auditée** (§23.4) d'un job en dead-letter dont
        l'opération n'a plus de sens (le job passe en `cancelled`). Si le
        job laisse des **restes distants** (ex. `resource.delete` avec
        `remnants`, §20.6.4), le corps DOIT porter
        `acknowledge_remnants=true`, sinon `409` (`remnants_present`) avec
        la liste des restes dans `details` — le forget n'effectue aucun
        nettoyage distant, les objets orphelins restent à traiter
        manuellement. `409` (`invalid_state`) si le job n'est pas en
        `dead_letter`.
      x-required-permission: write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobForgetRequest"
      responses:
        "200":
          description: Job clôturé (statut `cancelled`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Token API scopé par team (§10.3). Format `Authorization: Bearer
        <token>`. Les tokens portent des permissions granulaires (read,
        read:sensitive, write, deploy, root), une expiration optionnelle et
        une IP allowlist CIDR optionnelle.

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Curseur opaque de pagination, issu de `next_cursor` de la page précédente.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments par page (1 à 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Clé d'idempotence (§24.1). Rejouer la même clé avec un corps
        identique renvoie la réponse originale ; même clé avec un corps
        différent → `409` (`idempotency_conflict`). Conservée au moins 24 h.
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Version optimiste attendue de la ressource (valeur de l'en-tête
        `ETag` du dernier `GET`). Décalage → `409` (`version_conflict`) avec
        la version courante dans `details`.
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        Reprise d'un flux SSE — sequence du dernier événement reçu
        (uniquement avec `Accept: text/event-stream`).
      schema:
        type: string
    WebhookUuid:
      name: uuid
      in: query
      required: false
      description: >-
        UUID(s) de ressources à déployer, séparés par des virgules.
        Requis si `tag` est absent.
      schema:
        type: string
      examples:
        single:
          value: rg8ks8c
          summary: Une seule ressource
        multiple:
          value: rg8ks8c,fj3dk2a
          summary: Plusieurs ressources
    WebhookTag:
      name: tag
      in: query
      required: false
      description: >-
        Tag(s) séparés par des virgules — déploie toutes les ressources de la
        team portant l'un de ces tags. Requis si `uuid` est absent.
      schema:
        type: string
    WebhookForce:
      name: force
      in: query
      required: false
      description: Force un rebuild sans cache.
      schema:
        type: boolean
        default: false
    TeamUuid:
      name: team_uuid
      in: path
      required: true
      description: UUID de la team.
      schema:
        type: string
    InvitationUuid:
      name: invitation_uuid
      in: path
      required: true
      description: UUID de l'invitation.
      schema:
        type: string
    TokenUuid:
      name: token_uuid
      in: path
      required: true
      description: UUID du token API (jamais sa valeur).
      schema:
        type: string
    ProjectUuid:
      name: project_uuid
      in: path
      required: true
      description: UUID du projet.
      schema:
        type: string
    EnvironmentUuid:
      name: environment_uuid
      in: path
      required: true
      description: UUID de l'environnement.
      schema:
        type: string
    PrivateKeyUuid:
      name: private_key_uuid
      in: path
      required: true
      description: UUID de la clé privée.
      schema:
        type: string
    ChannelUuid:
      name: channel_uuid
      in: path
      required: true
      description: UUID du canal de notification.
      schema:
        type: string
    S3StorageUuid:
      name: s3_storage_uuid
      in: path
      required: true
      description: UUID du stockage S3.
      schema:
        type: string
    ServerUuid:
      name: server_uuid
      in: path
      required: true
      description: UUID du serveur.
      schema:
        type: string
    AdoptionScanUuid:
      name: adoption_scan_uuid
      in: path
      required: true
      description: UUID du scan d'adoption (§20.7).
      schema:
        type: string
    RegistryCredentialUuid:
      name: registry_credential_uuid
      in: path
      required: true
      description: UUID du credential de registry.
      schema:
        type: string
    TaskUuid:
      name: task_uuid
      in: path
      required: true
      description: UUID de la tâche planifiée.
      schema:
        type: string
    ApplicationUuid:
      name: application_uuid
      in: path
      required: true
      description: UUID de l'application.
      schema:
        type: string
    ServiceUuid:
      name: service_uuid
      in: path
      required: true
      description: UUID du stack compose.
      schema:
        type: string
    GithubAppUuid:
      name: github_app_uuid
      in: path
      required: true
      description: UUID de la GitHub App.
      schema:
        type: string
    StorageUuid:
      name: storage_uuid
      in: path
      required: true
      description: UUID du stockage persistant.
      schema:
        type: string
    EnvUuid:
      name: env_uuid
      in: path
      required: true
      description: UUID de la variable d'environnement.
      schema:
        type: string
    DeploymentUuid:
      name: deployment_uuid
      in: path
      required: true
      description: UUID du déploiement.
      schema:
        type: string
    DatabaseUuid:
      name: database_uuid
      in: path
      required: true
      description: UUID de la base de données.
      schema:
        type: string
    BackupPlanUuid:
      name: backup_plan_uuid
      in: path
      required: true
      description: UUID du plan de backup.
      schema:
        type: string
    ExecutionUuid:
      name: execution_uuid
      in: path
      required: true
      description: UUID de l'exécution de backup.
      schema:
        type: string
    CertificateUuid:
      name: certificate_uuid
      in: path
      required: true
      description: UUID du certificat (reflet observé).
      schema:
        type: string
    JobUuid:
      name: job_uuid
      in: path
      required: true
      description: UUID du job.
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Headers
  # ---------------------------------------------------------------------------
  headers:
    ETag:
      description: >-
        Version optimiste de la ressource, à renvoyer dans `If-Match` lors
        d'un `PATCH` sensible.
      schema:
        type: string
    RetryAfter:
      description: Nombre de secondes à attendre avant de réessayer.
      schema:
        type: integer

  # ---------------------------------------------------------------------------
  # Responses (erreurs réutilisables — schéma unique Error, §24.1)
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Requête malformée (syntaxe, paramètre invalide).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: bad_request
            message: Paramètre de requête invalide.
            details:
              - field: limit
                code: out_of_range
                message: limit doit être compris entre 1 et 100.
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    Unauthorized:
      description: Token absent, invalide, expiré, révoqué, hors IP allowlist, ou API désactivée.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: Authentification requise.
            details: []
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    Forbidden:
      description: >-
        Permission insuffisante pour cette action (voir
        `x-required-permission`), ou ressource appartenant à une autre team
        (INV-002 — peut aussi répondre 404 pour ne pas révéler l'existence).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: Permission insuffisante pour cette action.
            details:
              - code: missing_permission
                message: "Permission requise : write."
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    NotFound:
      description: Ressource inexistante ou hors du périmètre de la team du token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: Ressource introuvable.
            details: []
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    Conflict:
      description: >-
        Conflit d'état — dépendances existantes (`dependency_exists`),
        opération concurrente en cours (`operation_in_progress`), unicité
        violée (`already_exists`), clé d'idempotence rejouée avec un corps
        différent (`idempotency_conflict`), ou transition d'état invalide
        (`invalid_state`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: dependency_exists
            message: Le projet contient encore des ressources.
            details:
              - code: environment_not_empty
                message: L'environnement production contient 3 ressources.
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    VersionConflict:
      description: >-
        Conflit de version optimiste — le `If-Match` fourni ne correspond
        pas à la version courante. `details` contient la version courante
        (`current_version`) à récupérer via un nouveau `GET` avant de
        rejouer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: version_conflict
            message: La ressource a été modifiée par ailleurs.
            details:
              - field: If-Match
                code: current_version
                message: "7"
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    UnprocessableEntity:
      description: Corps syntaxiquement valide mais sémantiquement invalide (validation métier).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: La requête contient des champs invalides.
            details:
              - field: git_repository
                code: invalid_url
                message: URL de dépôt Git invalide.
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    TooManyRequests:
      description: >-
        Rate limit dépassé (200 req/min par token) ou file de déploiement
        pleine (`deployment_queue_limit`). Respecter `Retry-After`.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Trop de requêtes, réessayez plus tard.
            details: []
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Transverse ----------------------------------------------------------
    Error:
      type: object
      description: Schéma d'erreur unique de l'API (§24.1). Ne contient jamais de secret ni de stack trace.
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: >-
            Code d'erreur stable lisible machine. Valeurs notables —
            bad_request, unauthorized, forbidden, not_found, already_exists,
            dependency_exists, operation_in_progress, invalid_state,
            version_conflict, idempotency_conflict, validation_failed,
            rate_limited, internal.
          example: validation_failed
        message:
          type: string
          description: Message générique lisible humain (sans donnée sensible).
        details:
          type: array
          description: Détails structurés et validés (erreurs de champ, contexte).
          items:
            $ref: "#/components/schemas/ErrorDetail"
          default: []
        request_id:
          type: string
          description: Identifiant de corrélation de la requête (repris dans les logs et l'audit, §23.4).

    ErrorDetail:
      type: object
      description: Détail d'erreur — cible optionnelle et code spécifique.
      required: [message]
      properties:
        field:
          type: string
          nullable: true
          description: Champ ou paramètre concerné (notation pointée), si applicable.
        code:
          type: string
          nullable: true
          description: Code du détail (ex. required, invalid_url, out_of_range, current_version).
        message:
          type: string
          description: Explication lisible humain.

    NextCursor:
      type: string
      nullable: true
      description: Curseur opaque de la page suivante — `null` sur la dernière page.

    JobAccepted:
      type: object
      description: Réponse standard des mutations longues (§24.1) — `202` avec job de suivi.
      required: [job_uuid, status_url]
      properties:
        job_uuid:
          type: string
          description: UUID du job créé.
        status_url:
          type: string
          description: URL de suivi du job (relative à /api/v1).
          example: /jobs/jb9x2mc

    DeploymentAccepted:
      type: object
      description: Réponse d'un déclenchement de déploiement — le déploiement est l'objet de suivi principal.
      required: [deployment_uuid, status_url]
      properties:
        deployment_uuid:
          type: string
          description: UUID du déploiement mis en file.
        status_url:
          type: string
          description: URL de suivi du déploiement (relative à /api/v1).
          example: /deployments/dp4k1zq
        job_uuid:
          type: string
          nullable: true
          description: Job interne associé, si exposé.

    BackupExecutionAccepted:
      allOf:
        - $ref: "#/components/schemas/JobAccepted"
        - type: object
          required: [execution_uuid]
          properties:
            execution_uuid:
              type: string
              description: UUID de l'exécution de backup créée (traçée dans l'historique du plan).
      description: Réponse d'un Backup Now — job de suivi + exécution créée.

    WebhookDeployAccepted:
      type: object
      description: Résultat du deploy webhook — un déploiement par ressource ciblée.
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeployResult"

    WebhookDeployResult:
      type: object
      required: [resource_uuid, deployment_uuid]
      properties:
        resource_uuid:
          type: string
          description: UUID de la ressource ciblée.
        deployment_uuid:
          type: string
          description: UUID du déploiement mis en file pour cette ressource.
        message:
          type: string
          nullable: true
          description: Précision éventuelle (ex. déploiement coalescé avec un déploiement en attente).

    # --- System --------------------------------------------------------------
    Event:
      type: object
      description: >-
        Événement de domaine publié par l'outbox transactionnelle (§24.2) —
        référence les objets par UUID public, ne contient jamais de valeur de
        secret (INV-003).
      required: [sequence, event_type, occurred_at]
      properties:
        sequence:
          type: integer
          description: Séquence monotone — sert de `Last-Event-ID` pour la reprise.
        event_type:
          type: string
          description: Type versionné de l'événement (ex. deployment.succeeded.v1).
        occurred_at:
          type: string
          format: date-time
        resource_uuid:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: Métadonnées de l'événement (UUIDs, statuts) — jamais de secret.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Toujours `ok` si le control plane répond.

    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Version sémantique de l'instance AkerDock.
          example: 1.0.0
        commit:
          type: string
          nullable: true
          description: SHA du commit de build.
        built_at:
          type: string
          nullable: true
          format: date-time
          description: Date de build (UTC).

    ApiState:
      type: object
      required: [api_enabled]
      properties:
        api_enabled:
          type: boolean
          description: État d'activation de l'API publique.

    EncryptionStatus:
      type: object
      description: >-
        État du chiffrement enveloppe au repos (ADR-003, §23.2) : version
        de clé active et répartition des lignes chiffrées par version de
        clé et par colonne. Ne contient jamais de matériel de clé.
      required: [active_key_version, key_versions]
      properties:
        active_key_version:
          type: integer
          description: Version de clé utilisée pour tout nouveau chiffrement.
          example: 2
        key_versions:
          type: array
          description: >-
            Une entrée par version de clé encore référencée en base. Une
            rotation est convergée quand seule la version active reste
            référencée.
          items:
            $ref: "#/components/schemas/EncryptionKeyVersion"
          readOnly: true
        rotation_job_uuid:
          type: string
          nullable: true
          description: UUID du job de re-chiffrement en cours, le cas échéant (`null` sinon).
          readOnly: true

    EncryptionKeyVersion:
      type: object
      description: Usage d'une version de clé maître dans les colonnes chiffrées.
      required: [key_version, total_rows]
      properties:
        key_version:
          type: integer
          description: Version de clé (préfixe 4 octets des colonnes `*_enc`).
        total_rows:
          type: integer
          description: Nombre total de lignes chiffrées avec cette version, toutes colonnes confondues.
        columns:
          type: array
          description: Détail par colonne chiffrée (inventaire §12 du data dictionary).
          items:
            $ref: "#/components/schemas/EncryptionColumnCount"
          readOnly: true

    EncryptionColumnCount:
      type: object
      description: Compteur de lignes d'une colonne chiffrée pour une version de clé.
      required: [table, column, rows]
      properties:
        table:
          type: string
          example: private_keys
        column:
          type: string
          example: private_key_enc
        rows:
          type: integer

    # --- Teams ---------------------------------------------------------------
    Team:
      type: object
      description: Team — périmètre d'isolation des serveurs, ressources, clés et tokens (§2, §23.1).
      required: [uuid, name, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        personal:
          type: boolean
          description: Team personnelle créée automatiquement avec l'utilisateur.
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    TeamMember:
      type: object
      description: Appartenance d'un utilisateur à une team.
      required: [user_uuid, email, role, joined_at]
      properties:
        user_uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin, member]
          description: Rôle dans la team (§10.1). Le RBAC fin par projet/environnement (§27.7) viendra dans une version ultérieure du contrat.
        joined_at:
          type: string
          format: date-time

    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email de la personne invitée.
        role:
          type: string
          enum: [admin, member]
          default: member
          description: Rôle attribué à l'acceptation.
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
          description: Durée de validité de l'invitation en heures (défaut 7 jours).

    Invitation:
      type: object
      description: Invitation d'un membre dans une team.
      required: [uuid, email, role, status, created_at, expires_at]
      properties:
        uuid:
          type: string
          readOnly: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          readOnly: true
        invite_url:
          type: string
          nullable: true
          description: >-
            Lien d'acceptation — renvoyé uniquement à la création et
            uniquement si l'email transactionnel de l'instance n'est pas
            configuré (transmission manuelle).
          readOnly: true
        invited_by:
          type: string
          nullable: true
          description: UUID de l'utilisateur ou du token à l'origine de l'invitation.
          readOnly: true
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true

    ApiTokenPermission:
      type: string
      enum: [read, "read:sensitive", write, deploy, root]
      description: Permission granulaire d'un token API (§10.3).

    ApiTokenCreate:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nom lisible du token (ex. ci-github-actions).
        permissions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiTokenPermission"
          description: >-
            Permissions accordées. Un token ne peut pas accorder une
            permission qu'il ne possède pas lui-même.
        expires_at:
          type: string
          nullable: true
          format: date-time
          description: Expiration optionnelle (UTC). `null` = sans expiration.
        ip_allowlist:
          type: array
          items:
            type: string
          description: Liste de CIDR autorisés (ex. 203.0.113.0/24). Vide = toutes IP.
          default: []

    ApiToken:
      type: object
      description: >-
        Métadonnées d'un token API. La valeur du token est hashée (SHA-256)
        côté serveur et n'apparaît jamais ici — seul `token_prefix` permet
        l'identification.
      required: [uuid, name, permissions, token_prefix, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenPermission"
        token_prefix:
          type: string
          description: Préfixe d'identification du token (premiers caractères).
          readOnly: true
        ip_allowlist:
          type: array
          items:
            type: string
          default: []
        expires_at:
          type: string
          nullable: true
          format: date-time
        last_used_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >-
                Valeur du token en clair — présente UNIQUEMENT dans cette
                réponse de création, jamais récupérable ensuite (§10.3).
      description: Token API à la création — inclut la valeur en clair, une seule fois.

    # --- Projects / Environments --------------------------------------------
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    ProjectUpdate:
      type: object
      description: Mise à jour partielle — seuls les champs fournis sont modifiés.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    Project:
      type: object
      description: Projet — regroupement logique d'environnements (§2).
      required: [uuid, name, team_uuid, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        team_uuid:
          type: string
          readOnly: true
        environments:
          type: array
          description: Environnements du projet (résumé, non paginé — borné en pratique).
          items:
            $ref: "#/components/schemas/Environment"
          readOnly: true
        version:
          type: integer
          description: Version optimiste (reflétée dans l'ETag).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    EnvironmentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nom unique dans le projet (ex. production, staging).
        description:
          type: string
          nullable: true

    EnvironmentUpdate:
      type: object
      description: Mise à jour partielle.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    Environment:
      type: object
      description: Environnement d'un projet — contient les ressources (§2).
      required: [uuid, name, project_uuid, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
          readOnly: true
        resource_count:
          type: integer
          description: Nombre de ressources contenues (0 requis pour la suppression).
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Private keys --------------------------------------------------------
    WebhookEndpoint:
      type: object
      required: [uuid, provider, url, enabled]
      properties:
        uuid:
          type: string
        provider:
          type: string
          enum: [github, gitlab, gitea]
        url:
          type: string
          description: URL de réception à déclarer chez le fournisseur.
        secret:
          type: string
          nullable: true
          description: >-
            Secret HMAC — renvoyé **uniquement** à la création, jamais relu
            ensuite (INV-003).
        enabled:
          type: boolean

    WebhookEndpointCreate:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [github, gitlab, gitea]

    TerminalSession:
      type: object
      required:
        [
          uuid,
          target_kind,
          target_name,
          websocket_path,
          token,
          token_expires_at,
          idle_timeout_seconds,
          max_duration_seconds,
        ]
      properties:
        uuid:
          type: string
        target_kind:
          type: string
          enum: [server, container]
          description: Serveur (shell SSH) ou container (`docker exec`) — §5.7.
        target_name:
          type: string
          description: >-
            Libellé de la cible, snapshot au moment de l'ouverture (survit à
            la suppression de la cible).
        websocket_path:
          type: string
          description: >-
            Chemin du WebSocket à ouvrir sur la **même origine** que l'API
            (`ws://` ou `wss://` selon le schéma de la page), avec le token
            en query string (`?token=…`). Le protocole du flux est hors
            OpenAPI (§27.24).
        token:
          type: string
          description: >-
            Token d'attache **à usage unique**, renvoyé uniquement à la
            création, jamais relu (§23.2, §24.4) — seul son hash est stocké.
        token_expires_at:
          type: string
          format: date-time
          description: >-
            Expiration du token d'attache (courte) — pas de la session : une
            fois le WebSocket ouvert, ce sont l'idle timeout et la durée
            maximum qui bornent la session.
        idle_timeout_seconds:
          type: integer
          description: Inactivité (aucune frappe) au-delà de laquelle la session est fermée.
        max_duration_seconds:
          type: integer
          description: Durée maximum d'une session, quelle que soit l'activité.

    AdoptionScanAccepted:
      allOf:
        - $ref: "#/components/schemas/JobAccepted"
        - type: object
          required: [adoption_scan_uuid]
          properties:
            adoption_scan_uuid:
              type: string
              description: UUID du scan créé, à lire une fois le job terminé.
      description: Réponse d'un scan d'adoption — job de suivi + scan créé.

    AdoptionScan:
      type: object
      description: >-
        Un scan d'adoption (§20.7, ADR-013) : inventaire des ressources Docker
        non gérées d'un serveur et mapping proposé vers le modèle AkerDock.
      required: [uuid, server_uuid, status, created_at]
      properties:
        uuid:
          type: string
        server_uuid:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        error:
          type: string
          nullable: true
          description: Cause de l'échec quand `status = failed`.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        candidates:
          type: array
          description: >-
            Présent quand `status = completed`. Contient TOUS les candidats,
            adoptables ou non — un candidat non adoptable porte ses motifs
            (`reasons`), jamais d'omission silencieuse.
          items:
            $ref: "#/components/schemas/AdoptionCandidate"

    AdoptionCandidate:
      type: object
      description: >-
        Un container isolé ou un stack compose non géré, avec le mapping
        proposé (§20.7). `modifications` liste ce que l'adoption puis la
        première normalisation changeront — l'adoption elle-même ne redémarre
        jamais le workload.
      required: [id, kind, proposed_name, adoptable, containers]
      properties:
        id:
          type: string
          description: >-
            Identifiant stable du candidat dans ce scan : ID court du
            container, ou `compose:<projet>` pour un stack.
        kind:
          type: string
          enum: [container, compose_stack]
        proposed_name:
          type: string
          description: Nom de ressource proposé (modifiable à l'adoption).
        proposed_resource_type:
          type: string
          enum: [application, service]
          nullable: true
          description: application (container isolé) ou service (stack compose).
        compose_project:
          type: string
          nullable: true
          description: Nom du projet compose (`com.docker.compose.project`).
        adoptable:
          type: boolean
        reasons:
          type: array
          description: Motifs de non-adoptabilité quand `adoptable = false`.
          items:
            type: string
        modifications:
          type: array
          description: >-
            Ce qui sera modifié — à l'adoption (rien sur le workload) et à la
            première normalisation (labels, nom, réseau).
          items:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionCandidateContainer"

    AdoptionCandidateContainer:
      type: object
      required: [container_id, container_name, image, state]
      properties:
        container_id:
          type: string
          description: ID court du container.
        container_name:
          type: string
        image:
          type: string
        state:
          type: string
          description: État Docker observé (`running`, `exited`, …).
        compose_service:
          type: string
          nullable: true
          description: Nom du service compose, pour un membre de stack.
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Labels Docker du container (hors namespace `akerdock.*`) — c'est
            ce qui permet à un outil de migration de reconnaître les workloads
            d'une plateforme donnée (ex. `coolify.*`) sans rien connaître de
            son schéma interne (ADR-023).
        env_keys:
          type: array
          description: >-
            NOMS des variables d'environnement — jamais les valeurs
            (INV-003) ; elles sont capturées et chiffrées à l'adoption.
          items:
            type: string
        ports:
          type: array
          items:
            type: object
            required: [container_port, protocol]
            properties:
              container_port:
                type: integer
              host_port:
                type: integer
                nullable: true
              protocol:
                type: string
        mounts:
          type: array
          items:
            type: object
            required: [kind, source, destination]
            properties:
              kind:
                type: string
                description: '`volume` ou `bind`.'
              source:
                type: string
                description: Nom du volume ou chemin hôte.
              destination:
                type: string
        networks:
          type: array
          items:
            type: string
        domains:
          type: array
          description: FQDN détectés dans les labels de reverse proxy (Traefik).
          items:
            type: string

    AdoptRequest:
      type: object
      description: Sélection de candidats d'un scan à adopter (§20.7).
      required: [environment_uuid, items]
      properties:
        environment_uuid:
          type: string
          description: Environnement cible des ressources créées.
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [candidate_id]
            properties:
              candidate_id:
                type: string
                description: '`id` du candidat dans le scan.'
              name:
                type: string
                description: Nom de ressource, à défaut `proposed_name`.

    NotificationChannel:
      type: object
      required: [uuid, kind, name, enabled, created_at, version]
      properties:
        uuid:
          type: string
        kind:
          type: string
          enum: [smtp, resend, discord, telegram, slack, pushover, webhook]
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    TransactionalEmail:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          readOnly: true
        kind:
          type: string
          nullable: true
          enum: [smtp, resend, null]
          readOnly: true
        from:
          type: string
          nullable: true
          readOnly: true
    TransactionalEmailSet:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [smtp, resend]
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        resend:
          $ref: "#/components/schemas/ResendConfig"

    SmtpConfig:
      type: object
      description: Configuration SMTP (amendement n°18). Le mot de passe est chiffré au repos et jamais renvoyé (INV-003).
      required: [host, from, to]
      properties:
        host:
          type: string
        port:
          type: integer
          default: 587
        username:
          type: string
        password:
          type: string
        from:
          type: string
        to:
          type: array
          minItems: 1
          items:
            type: string
        encryption:
          type: string
          enum: [starttls, tls, none]
          default: starttls
          description: >-
            `none` n'est acceptable que vers un relais local : le mot de passe
            et le contenu de l'alerte traversent alors le réseau en clair.
    ResendConfig:
      type: object
      required: [api_key, from, to]
      properties:
        api_key:
          type: string
        from:
          type: string
        to:
          type: array
          minItems: 1
          items:
            type: string
    TelegramConfig:
      type: object
      required: [bot_token, chat_id]
      properties:
        bot_token:
          type: string
        chat_id:
          type: string
        topic_id:
          type: string
          nullable: true
    PushoverConfig:
      type: object
      required: [token, user_key]
      properties:
        token:
          type: string
        user_key:
          type: string
    NotificationChannelCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [smtp, resend, discord, telegram, slack, pushover, webhook]
        name:
          type: string
          maxLength: 255
        url:
          type: string
          description: >-
            URL du webhook (Slack, Discord, endpoint custom) — **requis** pour
            ces trois types. Sensible : chiffrée au repos, jamais renvoyée
            (INV-003).
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        resend:
          $ref: "#/components/schemas/ResendConfig"
        telegram:
          $ref: "#/components/schemas/TelegramConfig"
        pushover:
          $ref: "#/components/schemas/PushoverConfig"
        enabled:
          type: boolean
          default: true

    NotificationChannelUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        resend:
          $ref: "#/components/schemas/ResendConfig"
        telegram:
          $ref: "#/components/schemas/TelegramConfig"
        pushover:
          $ref: "#/components/schemas/PushoverConfig"
        url:
          type: string
        enabled:
          type: boolean

    NotificationRule:
      type: object
      required: [uuid, event_type, enabled, min_severity]
      properties:
        uuid:
          type: string
        event_type:
          type: string
          description: "Type d'événement écouté (§24.2) : deployment.failed.v1, server.unreachable.v1…"
        enabled:
          type: boolean
        project_uuid:
          type: string
          nullable: true
          description: Portée projet — `null` = toute la team.
        environment_uuid:
          type: string
          nullable: true
        min_severity:
          type: string
          enum: [info, warning, critical]
        debounce_seconds:
          type: integer
          description: Fenêtre d'agrégation anti-flapping. Un événement `critical` la traverse toujours.
        quiet_hours_start:
          type: string
          nullable: true
          description: "Début des heures calmes (HH:MM). La fenêtre peut passer minuit (22:00 → 07:00)."
        quiet_hours_end:
          type: string
          nullable: true
        digest_enabled:
          type: boolean
        digest_interval_minutes:
          type: integer
          description: Fenêtre du résumé différé (ADR-019 §4). Un événement `critical` n'attend jamais un résumé.
        created_at:
          type: string
          format: date-time

    NotificationRuleCreate:
      type: object
      required: [event_type]
      properties:
        event_type:
          type: string
        enabled:
          type: boolean
          default: true
        project_uuid:
          type: string
          nullable: true
        environment_uuid:
          type: string
          nullable: true
        min_severity:
          type: string
          enum: [info, warning, critical]
          default: info
        debounce_seconds:
          type: integer
          default: 0
          minimum: 0
        quiet_hours_start:
          type: string
          nullable: true
        quiet_hours_end:
          type: string
          nullable: true
        digest_enabled:
          type: boolean
          default: false
        digest_interval_minutes:
          type: integer
          default: 60
          minimum: 1

    S3Storage:
      type: object
      required: [uuid, name, endpoint, bucket, is_usable, created_at, version]
      properties:
        uuid:
          type: string
        name:
          type: string
        endpoint:
          type: string
          description: Endpoint S3 (https://s3.eu-west-3.amazonaws.com, MinIO self-hosted…).
        region:
          type: string
          nullable: true
        bucket:
          type: string
        path_prefix:
          type: string
          nullable: true
          description: Préfixe des objets déposés dans le bucket.
        is_usable:
          type: boolean
          description: Un aller-retour écriture/lecture/suppression a réussi (§20.5).
        last_check_error:
          type: string
          nullable: true
          description: Raison du dernier échec de vérification — jamais un credential.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    S3StorageCreate:
      type: object
      required: [name, endpoint, bucket, access_key, secret_key]
      properties:
        name:
          type: string
          maxLength: 255
        endpoint:
          type: string
        region:
          type: string
          nullable: true
        bucket:
          type: string
        path_prefix:
          type: string
          nullable: true
        access_key:
          type: string
          description: Sensible — chiffré au repos, jamais renvoyé (INV-003).
        secret_key:
          type: string
          description: Sensible — chiffré au repos, jamais renvoyé (INV-003).

    S3StorageUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        endpoint:
          type: string
        region:
          type: string
          nullable: true
        bucket:
          type: string
        path_prefix:
          type: string
          nullable: true
        access_key:
          type: string
        secret_key:
          type: string

    PrivateKeyCreate:
      type: object
      required: [name, private_key]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        private_key:
          type: string
          writeOnly: true
          description: >-
            Matériel de clé privée SSH au format PEM/OpenSSH, sans
            passphrase (§3.1). Stocké chiffré (AEAD, §23.2) ; jamais
            renvoyé dans la réponse de création.

    PrivateKeyUpdate:
      type: object
      description: Mise à jour partielle. Fournir `private_key` remplace le matériel (rotation).
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        private_key:
          type: string
          writeOnly: true
          description: Nouveau matériel de clé (rotation). Les serveurs référencés repassent en `pending`.

    PrivateKey:
      type: object
      description: >-
        Clé SSH privée. Le champ `private_key` n'est renseigné que sur
        `GET` unitaire avec permission `read:sensitive` ET `reveal=true`
        (INV-003) ; sinon `null` et `is_redacted=true`.
      required: [uuid, name, fingerprint, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        fingerprint:
          type: string
          description: Fingerprint SHA256 de la clé publique dérivée.
          readOnly: true
        public_key:
          type: string
          description: Clé publique dérivée (utilisable comme deploy key).
          readOnly: true
        private_key:
          type: string
          nullable: true
          description: Matériel privé — voir conditions de révélation dans la description du schéma.
        is_redacted:
          type: boolean
          description: Vrai si `private_key` a été masqué faute de permission ou de `reveal=true`.
          readOnly: true
        in_use:
          type: boolean
          description: Vrai si la clé est référencée par au moins un serveur ou une application.
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Servers -------------------------------------------------------------
    ServerCreate:
      type: object
      required: [name, host, private_key_uuid]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        host:
          type: string
          description: Adresse IP ou FQDN joignable en SSH.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        user:
          type: string
          default: root
          description: Utilisateur SSH (non-root expérimental, exige sudo NOPASSWD, §3.1).
        private_key_uuid:
          type: string
          description: Clé privée SSH de la même team (INV-002).
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            Credential DNS-01 utilisé pour les wildcards de ce serveur
            (amendement n°21). **Requis** dès qu'un `wildcard_domain` est
            défini : un wildcard ne peut pas être émis en HTTP-01, la CA n'ayant
            aucun hôte unique à interroger.
        is_build_server:
          type: boolean
          default: false
          description: Serveur dédié au build (§3.4) — ne peut pas héberger d'applications.
        wildcard_domain:
          type: string
          nullable: true
          description: Domaine wildcard du serveur (§4.2) — les nouvelles apps reçoivent uuid.domaine.
        proxy_type:
          type: string
          enum: [traefik, none]
          default: traefik
          description: Proxy géré sur le serveur. Traefik seul en P0 (§27.9) ; `none` pour un serveur sans trafic entrant.
        proxy_http_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 80
          description: Port d'écoute HTTP du proxy — configurable par serveur (§27.1).
        proxy_https_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 443
          description: Port d'écoute HTTPS du proxy — configurable par serveur (§27.1).

    ServerUpdate:
      type: object
      description: >-
        Mise à jour partielle. Modifier `host`, `port`, `user` ou
        `private_key_uuid` repasse le serveur en `pending` (revalidation
        requise).
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        user:
          type: string
        private_key_uuid:
          type: string
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            Credential DNS-01 utilisé pour les wildcards de ce serveur
            (amendement n°21). **Requis** dès qu'un `wildcard_domain` est
            défini : un wildcard ne peut pas être émis en HTTP-01, la CA n'ayant
            aucun hôte unique à interroger.
        is_build_server:
          type: boolean
        wildcard_domain:
          type: string
          nullable: true
        proxy_type:
          type: string
          enum: [traefik, none]
        proxy_http_port:
          type: integer
          minimum: 1
          maximum: 65535
        proxy_https_port:
          type: integer
          minimum: 1
          maximum: 65535

    Server:
      type: object
      description: Serveur cible SSH (§3) — états du cycle de vie §21.2.
      required: [uuid, name, host, port, user, private_key_uuid, status, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        private_key_uuid:
          type: string
        ssh_timeout_seconds:
          type: integer
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            Credential DNS-01 utilisé pour les wildcards de ce serveur
            (amendement n°21). **Requis** dès qu'un `wildcard_domain` est
            défini : un wildcard ne peut pas être émis en HTTP-01, la CA n'ayant
            aucun hôte unique à interroger.
        is_build_server:
          type: boolean
        is_localhost:
          type: boolean
          description: >-
            Vrai pour le serveur `localhost` pré-enregistré à l'amorçage
            (instance-config §6.2) — la machine hébergeant l'instance. Jamais
            positionnable par l'API.
          readOnly: true
        wildcard_domain:
          type: string
          nullable: true
        proxy_type:
          type: string
          enum: [traefik, none]
        proxy_http_port:
          type: integer
        proxy_https_port:
          type: integer
        proxy_desired_state:
          type: string
          enum: [running, stopped]
          description: >-
            Intention de l'opérateur sur le proxy (§3). Un `stopped` explicite
            n'est pas « réparé » par la réconciliation.
          readOnly: true
        proxy_observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        status:
          type: string
          enum: [pending, validating, ready, unreachable, maintenance, deleting]
          description: Cycle de vie du serveur (§21.2).
          readOnly: true
        is_reachable:
          type: boolean
          description: Dernière observation de joignabilité SSH.
          readOnly: true
        observed_at:
          type: string
          nullable: true
          format: date-time
          description: >-
            Horodatage de la dernière observation — au-delà d'un seuil, le
            statut doit être traité comme stale/inconnu (§19.2).
          readOnly: true
        architecture:
          type: string
          nullable: true
          enum: [amd64, arm64, null]
          description: Architecture détectée à la validation.
          readOnly: true
        docker_version:
          type: string
          nullable: true
          description: Version de Docker Engine détectée (≥ 24 requise, §3.1).
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    ServerResource:
      type: object
      description: Ressource gérée déployée sur un serveur (union logique, §19.1).
      required: [uuid, type, name, status]
      properties:
        uuid:
          type: string
        type:
          type: string
          enum: [application, database]
          description: Type de ressource (les services one-click arriveront en P2).
        name:
          type: string
        project_uuid:
          type: string
        environment_uuid:
          type: string
        status:
          $ref: "#/components/schemas/ObservedStatus"

    ServerDomain:
      type: object
      description: Domaines routés par le proxy du serveur pour une ressource.
      required: [resource_uuid, resource_type, domains]
      properties:
        resource_uuid:
          type: string
        resource_type:
          type: string
          enum: [application, database]
        domains:
          type: array
          items:
            type: string
          description: FQDN (avec schéma éventuel https://, port ou path selon la configuration, §4.2).

    # --- Certificates --------------------------------------------------------
    CertificateKind:
      type: string
      enum: [acme_http01, acme_dns01, custom, self_signed]
      description: >-
        Mode d'obtention du certificat (§4.3) : émission ACME par challenge
        HTTP-01 (défaut) ou DNS-01 (obligatoire pour les wildcards),
        certificat custom déposé sur le serveur, ou certificat self-signed
        de fallback servi en attendant une émission valide.

    CertificateStatus:
      type: string
      enum: [pending, issued, renewing, failed, expired, revoked]
      description: >-
        Statut observé du certificat. `pending` = émission en cours (le
        fallback self-signed est servi entre-temps) ; `renewing` =
        renouvellement en cours ; `failed` = échec d'émission ou de
        renouvellement (voir `last_error`).

    Certificate:
      type: object
      description: >-
        Certificat TLS servi par le proxy d'un serveur — **reflet observé**
        (table `certificates`) : l'état réel vit dans `acme.json` et les
        fichiers du serveur, synchronisés après chaque application de
        configuration proxy et par réconciliation périodique (§18.3). Le
        matériel de clé privée ne quitte jamais le serveur et n'apparaît
        jamais dans l'API.
      required: [uuid, server_uuid, kind, main_domain, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          description: Serveur dont le proxy sert ce certificat.
          readOnly: true
        kind:
          $ref: "#/components/schemas/CertificateKind"
        main_domain:
          type: string
          description: Domaine principal couvert (CN / premier SAN).
          example: app.example.com
        sans:
          type: array
          items:
            type: string
          description: Domaines alternatifs couverts, wildcards inclus (ex. `*.preview.example.com`).
          default: []
        issuer:
          type: string
          nullable: true
          description: Émetteur observé (ex. Let's Encrypt R11) — `null` tant que rien n'est émis.
          readOnly: true
        not_before:
          type: string
          nullable: true
          format: date-time
          description: Début de validité observé.
          readOnly: true
        not_after:
          type: string
          nullable: true
          format: date-time
          description: >-
            Expiration observée — donnée clé du monitoring (alerte
            intégrée J-30/J-7, filtre `expiring_within_days`).
          readOnly: true
        status:
          $ref: "#/components/schemas/CertificateStatus"
        last_error:
          type: string
          nullable: true
          description: >-
            Dernière erreur d'émission/renouvellement (challenge en échec,
            rate limit, CAA…) — jamais de secret.
          readOnly: true
        dns_provider:
          type: string
          nullable: true
          description: Identifiant du provider DNS (Lego, ex. cloudflare) pour `acme_dns01`.
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            UUID du credential DNS-01 référencé (`acme_dns01`). La valeur du
            secret n'est jamais exposée ici (INV-003).
        cert_path:
          type: string
          nullable: true
          description: >-
            Chemin distant du certificat sur le serveur (certificats
            `custom`) ; `null` pour ACME (matériel dans `acme.json`).
          readOnly: true
        observed_at:
          type: string
          nullable: true
          format: date-time
          description: >-
            Fraîcheur du reflet — au-delà d'un seuil, l'état est à
            considérer comme « stale », jamais comme un `issued` garanti.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          description: Dernière synchronisation du reflet.
          readOnly: true

    # --- Applications --------------------------------------------------------
    ObservedStatus:
      type: string
      enum: [unknown, starting, healthy, unhealthy, exited, missing]
      description: État observé d'une ressource (§21.2) — `unknown` si l'observation est trop ancienne (stale).

    DesiredStatus:
      type: string
      enum: [running, stopped]
      description: État désiré d'une ressource (§21.2).

    HealthCheckConfig:
      type: object
      description: Health check applicatif (§5.3) — conditionne le routage et le zero-downtime.
      properties:
        enabled:
          type: boolean
          default: false
        path:
          type: string
          default: /
        port:
          type: integer
          nullable: true
          description: Port testé — défaut = premier port exposé.
        method:
          type: string
          default: GET
        interval_seconds:
          type: integer
          minimum: 1
          default: 30
        timeout_seconds:
          type: integer
          minimum: 1
          default: 5
        retries:
          type: integer
          minimum: 1
          default: 3
        start_period_seconds:
          type: integer
          minimum: 0
          default: 10

    ResourceLimits:
      type: object
      description: Limites de ressources du container (§5.3).
      properties:
        memory_limit:
          type: string
          nullable: true
          description: Limite mémoire (ex. 512m, 2g). `null` = illimité.
        memory_reservation:
          type: string
          nullable: true
        memory_swap:
          type: string
          nullable: true
        cpu_limit:
          type: string
          nullable: true
          description: Limite CPU (ex. 0.5, 2).
        cpu_shares:
          type: integer
          nullable: true
        cpu_set:
          type: string
          nullable: true
          description: CPUs autorisés (ex. 0-2).

    ApplicationCreateBase:
      type: object
      description: Champs communs à toute création d'application.
      required: [name, project_uuid, environment_uuid, server_uuid, source_type]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
        environment_uuid:
          type: string
        server_uuid:
          type: string
          description: Serveur cible (doit être `ready` et ne pas être un build server).
        destination_uuid:
          type: string
          nullable: true
          description: Réseau Docker cible — défaut = destination par défaut du serveur (gestion dédiée hors v1).
        source_type:
          type: string
          enum: [docker_image, dockerfile, git]
          description: Discriminant du type de source (§5.1).
        domains:
          type: array
          items:
            type: string
          description: >-
            FQDN de l'application (§4.2) — formats supportés par élément :
            fqdn simple, fqdn:port (port interne ciblé), fqdn/path
            (path-based routing). Vide = domaine généré depuis le wildcard
            du serveur si configuré.
          default: []
        ports_exposes:
          type: string
          nullable: true
          description: Port(s) interne(s) exposé(s) au proxy, séparés par des virgules (ex. "3000"). Optionnel pour une app sans trafic entrant.
        health_check:
          $ref: "#/components/schemas/HealthCheckConfig"
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        pre_deployment_command:
          type: string
          nullable: true
          description: >-
            Commande exécutée dans le container **existant** avant tout
            clone/build (§10). Un échec fait échouer le déploiement **avant
            toute mutation** — l'existant n'est pas touché. Sautée s'il n'y a
            pas de container en cours d'exécution. DOIT être idempotente : elle
            peut être rejouée lors d'une reprise après crash.
        post_deployment_command:
          type: string
          nullable: true
          description: >-
            Commande exécutée dans le **candidat** une fois sain, avant la
            bascule (§10). Un échec fait échouer le déploiement : le candidat
            est supprimé et l'ancien container **reste routé** (INV-005), sans
            rollback automatique. DOIT être idempotente.

        tags:
          type: array
          items:
            type: string
          description: Tags libres — utilisables par le deploy webhook (`?tag=`).
          default: []
        instant_deploy:
          type: boolean
          default: false
          description: Déclenche immédiatement un premier déploiement après création.
        use_build_server:
          type: boolean
          default: false
          description: >-
            Construire sur un **build server** dédié (§3.4) plutôt que sur le
            serveur de production. Exige `push_registry_credential_uuid` : sans
            registry, l'image reste sur la machine de build et le serveur de
            déploiement ne peut pas la tirer — la construire ailleurs n'aurait
            servi à rien (amendement n°19). Sans objet pour la source
            `docker_image`, qui ne construit rien.
        push_registry_credential_uuid:
          type: string
          nullable: true
          description: Registry où l'image construite est poussée, et d'où le serveur de déploiement la tire.

    ApplicationCreateDockerImage:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreateBase"
        - type: object
          required: [docker_image]
          properties:
            source_type:
              enum: [docker_image]
            docker_image:
              type: string
              description: Image pré-construite, registry inclus si non Docker Hub (ex. ghcr.io/acme/app).
            docker_image_tag:
              type: string
              default: latest
              description: Tag de l'image. Le digest est résolu au déploiement (§18.3).
            registry_credential_uuid:
              type: string
              nullable: true
              description: >-
                Credential d'un registry privé (amendement n°17). Le mot de
                passe n'atteint le serveur que par le **stdin** de
                `docker login --password-stdin` — jamais dans `argv`, où un
                `ps` le lirait (INV-003).
      description: Création depuis une image Docker d'un registry (P0). Registries privés via docker login sur le serveur (§5.1).

    ApplicationCreateDockerfile:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreateBase"
        - type: object
          required: [dockerfile]
          properties:
            source_type:
              enum: [dockerfile]
            dockerfile:
              type: string
              description: Contenu inline du Dockerfile (P0).
      description: Création depuis un Dockerfile inline (P0).

    ApplicationCreateGit:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreateBase"
        - type: object
          required: [git_repository, git_branch, build_pack]
          properties:
            source_type:
              enum: [git]
            git_repository:
              type: string
              description: >-
                URL du dépôt — HTTPS pour un dépôt public, SSH
                (git@host:org/repo.git) pour un dépôt privé par deploy key.
                Ignorée quand `github_app_uuid` est fourni : l'URL de clone
                est dérivée du dépôt découvert.
            github_app_uuid:
              type: string
              nullable: true
              description: >-
                Source GitHub App (git-webhook-protocols §2) — clone par
                token d'installation, auto-deploy par le webhook de l'app.
                Exige `repository_full_name`.
            repository_full_name:
              type: string
              nullable: true
              description: >-
                (avec github_app_uuid) Dépôt cible, au format owner/name,
                parmi les dépôts découverts de l'installation.
            git_branch:
              type: string
              description: Branche à déployer (résolue en SHA immuable à chaque déploiement, §20.2).
            private_key_uuid:
              type: string
              nullable: true
              description: Clé privée (deploy key) pour un dépôt privé — `null` pour un dépôt public (P1, §5.1).
            build_pack:
              type: string
              enum: [dockerfile, nixpacks, static, compose]
              description: >-
                Build pack (§5.2). `compose` déploie le fichier compose du
                dépôt comme stack multi-services (compose-spec.md) — un
                composant par service, domaine par composant. Railpack
                arrivera dans une version ultérieure du contrat.
            base_directory:
              type: string
              default: /
              description: Répertoire de base dans le dépôt (monorepos).
            dockerfile_location:
              type: string
              default: /Dockerfile
              description: Chemin du Dockerfile relatif à `base_directory` (build pack dockerfile).
            compose_file_location:
              type: string
              default: /docker-compose.yml
              description: >-
                (build pack compose) Chemin du fichier compose relatif à
                `base_directory`.
            raw_compose:
              type: boolean
              default: false
              description: >-
                (build pack compose) Mode raw compose (compose-spec §9) —
                sémantique `docker compose up` au plus près, zero-downtime
                désactivé, frontières de sécurité conservées.
            publish_directory:
              type: string
              nullable: true
              description: Répertoire publié (build pack static).
            watch_paths:
              type: array
              items:
                type: string
              description: Patterns limitant l'auto-deploy aux fichiers modifiés correspondants (§5.5).
              default: []
      description: Création depuis un dépôt Git public ou privé (P1).

    Preview:
      type: object
      description: Environnement éphémère d'une PR (§20.4, data dictionary §8.9).
      required: [uuid, pr_id, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        pr_id:
          type: integer
          readOnly: true
        provider:
          type: string
          readOnly: true
        source_branch:
          type: string
          nullable: true
          readOnly: true
        head_sha:
          type: string
          nullable: true
          readOnly: true
        is_fork:
          type: boolean
          readOnly: true
        fork_approved:
          type: boolean
          readOnly: true
        fqdn:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [queued, deploying, active, failed, destroying, cleanup_failed, destroyed]
          readOnly: true
        last_deployed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    GithubApp:
      type: object
      description: >-
        GitHub App de la team (git-webhook-protocols §2) — créée par manifest
        flow, credentials chiffrés jamais exposés par l'API.
      required: [uuid, name, api_url, html_url, is_installed, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        app_id:
          type: integer
          nullable: true
          description: ID chez GitHub — null tant que le manifest flow n'est pas terminé (brouillon).
          readOnly: true
        slug:
          type: string
          nullable: true
          readOnly: true
        installation_id:
          type: integer
          nullable: true
          description: Null tant que l'app n'est pas installée sur un compte/organisation.
          readOnly: true
        install_url:
          type: string
          nullable: true
          description: URL d'installation chez GitHub (une fois convertie).
          readOnly: true
        api_url:
          type: string
          readOnly: true
        html_url:
          type: string
          readOnly: true
        is_installed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true

    GithubAppCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 34
          description: >-
            Nom souhaité de l'app (unicité globale chez GitHub, ≤ 34
            caractères) — défaut généré depuis l'instance.
        organization:
          type: string
          nullable: true
          description: Organisation GitHub cible ; null = compte personnel.
        api_url:
          type: string
          nullable: true
          description: GitHub Enterprise Server — URL d'API (ex. https://ghe.example.com/api/v3).
        html_url:
          type: string
          nullable: true
          description: GitHub Enterprise Server — URL web.

    GithubAppManifest:
      type: object
      description: Le nécessaire pour soumettre le manifest à GitHub (§2.1 étape 2).
      required: [github_app, manifest, state, target_url]
      properties:
        github_app:
          $ref: "#/components/schemas/GithubApp"
        manifest:
          type: object
          description: JSON du manifest, à poster dans le champ de formulaire `manifest`.
        state:
          type: string
          description: Jeton anti-CSRF à usage unique (10 minutes) — passé en query `state`.
        target_url:
          type: string
          description: URL GitHub du formulaire de création (compte ou organisation).

    GitRepository:
      type: object
      description: Dépôt découvert via l'installation (data dictionary §7.3).
      required: [uuid, full_name]
      properties:
        uuid:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        default_branch:
          type: string
          nullable: true
          readOnly: true
        html_url:
          type: string
          nullable: true
          readOnly: true

    Service:
      type: object
      description: >-
        Stack Docker Compose inline (compose-spec.md, data dictionary §9.1) —
        le fichier est la source de vérité, éditable via PATCH.
      required:
        - uuid
        - name
        - project_uuid
        - environment_uuid
        - server_uuid
        - compose_content
        - desired_status
        - observed_status
        - created_at
        - version
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
          readOnly: true
        environment_uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          readOnly: true
        compose_content:
          type: string
          description: Le fichier compose (sous-ensemble compose-spec §1).
        connect_to_predefined_network:
          type: boolean
          description: Attache chaque composant au réseau de la destination (§2.1).
        desired_status:
          $ref: "#/components/schemas/DesiredStatus"
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        last_deployment_uuid:
          type: string
          nullable: true
          readOnly: true
        last_deployment_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    ServiceCreateRequest:
      type: object
      required: [name, project_uuid, environment_uuid, server_uuid, compose_content]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
        environment_uuid:
          type: string
        server_uuid:
          type: string
        compose_content:
          type: string
          description: >-
            Fichier compose inline, validé à la sauvegarde (422 + findings
            compose-spec §11 dans details[]). `build:` refusé — un stack
            inline n'a pas de source à construire.
        connect_to_predefined_network:
          type: boolean
          default: false
        instant_deploy:
          type: boolean
          default: false

    ServiceUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        compose_content:
          type: string
          description: Nouveau fichier — validé, appliqué au prochain déploiement.
        connect_to_predefined_network:
          type: boolean

    ServiceComponent:
      type: object
      description: >-
        Sous-container d'un stack compose (data dictionary §9.2) — un par
        service du fichier, statut observé individuel (§5.7).
      required: [uuid, name, observed_status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
          description: Nom du service dans le fichier compose.
          readOnly: true
        image:
          type: string
          nullable: true
          description: Image résolue (informatif).
          readOnly: true
        is_database:
          type: boolean
          description: Détection par image (compose-spec §10) — cible valide d'un plan de backup.
          readOnly: true
        database_engine:
          type: string
          nullable: true
          enum: [postgresql, mysql, mariadb, mongodb, redis, keydb, dragonfly, clickhouse, null]
          readOnly: true
        exclude_from_hc:
          type: boolean
          description: Job one-shot exclu du statut agrégé (compose-spec §7.3).
          readOnly: true
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    ApplicationCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/ApplicationCreateDockerImage"
        - $ref: "#/components/schemas/ApplicationCreateDockerfile"
        - $ref: "#/components/schemas/ApplicationCreateGit"
      discriminator:
        propertyName: source_type
        mapping:
          docker_image: "#/components/schemas/ApplicationCreateDockerImage"
          dockerfile: "#/components/schemas/ApplicationCreateDockerfile"
          git: "#/components/schemas/ApplicationCreateGit"
      description: Corps de création d'application — discriminé par `source_type`.

    ApplicationUpdate:
      type: object
      description: >-
        Mise à jour partielle de la configuration. Les changements sont
        versionnés (INV-014) et appliqués au prochain déploiement, sauf
        `domains` (routage régénéré immédiatement). `source_type` n'est pas
        modifiable — recréer l'application pour changer de type de source.
      properties:
        pre_deployment_command:
          type: string
          nullable: true
          description: >-
            Commande exécutée dans le container **existant** avant tout
            clone/build (§10). Un échec fait échouer le déploiement **avant
            toute mutation** — l'existant n'est pas touché. Sautée s'il n'y a
            pas de container en cours d'exécution. DOIT être idempotente : elle
            peut être rejouée lors d'une reprise après crash.
        post_deployment_command:
          type: string
          nullable: true
          description: >-
            Commande exécutée dans le **candidat** une fois sain, avant la
            bascule (§10). Un échec fait échouer le déploiement : le candidat
            est supprimé et l'ancien container **reste routé** (INV-005), sans
            rollback automatique. DOIT être idempotente.

        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        domains:
          type: array
          items:
            type: string
        ports_exposes:
          type: string
          nullable: true
        health_check:
          $ref: "#/components/schemas/HealthCheckConfig"
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        tags:
          type: array
          items:
            type: string
        docker_image:
          type: string
          description: (source docker_image) Nouvelle image.
        docker_image_tag:
          type: string
          description: (source docker_image) Nouveau tag.
        registry_credential_uuid:
          type: string
          nullable: true
          description: Credential du registry privé (null pour le retirer).
        use_build_server:
          type: boolean
        push_registry_credential_uuid:
          type: string
          nullable: true
        dockerfile:
          type: string
          description: (source dockerfile) Nouveau contenu du Dockerfile.
        git_repository:
          type: string
          description: (source git) URL du dépôt.
        git_branch:
          type: string
          description: (source git) Branche.
        private_key_uuid:
          type: string
          nullable: true
          description: (source git) Deploy key.
        build_pack:
          type: string
          enum: [dockerfile, nixpacks, static, compose]
          description: (source git) Build pack.
        base_directory:
          type: string
          description: (source git) Répertoire de base.
        dockerfile_location:
          type: string
          description: (source git) Chemin du Dockerfile.
        compose_file_location:
          type: string
          description: (build pack compose) Chemin du fichier compose relatif à `base_directory`.
        raw_compose:
          type: boolean
          description: (build pack compose) Mode raw compose (compose-spec §9).
        publish_directory:
          type: string
          nullable: true
          description: (source git) Répertoire publié (static).
        watch_paths:
          type: array
          items:
            type: string
          description: (source git) Patterns d'auto-deploy.
        auto_deploy:
          type: boolean
          description: (source git) Active/désactive l'auto-deploy sur push (§5.5).
        previews_enabled:
          type: boolean
          description: Previews par PR (§20.4) — source GitHub App requise pour le déclenchement.
        preview_url_template:
          type: string
          description: "Placeholders : {{pr_id}}, {{domain}}, {{random}} (§5.6)."
        preview_max_concurrent:
          type: integer
          nullable: true
          description: Plafond de previews simultanées ; null = illimité (§20.4.3).
        preview_ttl_minutes:
          type: integer
          nullable: true
          description: TTL d'inactivité en minutes ; null = pas de destruction automatique.
        preview_protection:
          type: string
          enum: [none, basic_auth]
          description: Protection d'accès des URLs de preview (§20.4.4) — basic_auth par défaut.
        preview_fork_approval_enabled:
          type: boolean
          description: Autorise les previews de forks après approbation d'un mainteneur (INV-010).
        preview_exclude_drafts:
          type: boolean
          description: Les draft PRs ne déclenchent pas de preview (opt-in, ADR-011).

    Application:
      type: object
      description: >-
        Application déployable (§5). Regroupe l'identité, la configuration
        désirée (source, build, routage, santé, limites) et les statuts
        désiré/observé (§21.2).
      required:
        - uuid
        - name
        - project_uuid
        - environment_uuid
        - server_uuid
        - source_type
        - desired_status
        - observed_status
        - created_at
        - version
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
          readOnly: true
        environment_uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          readOnly: true
        destination_uuid:
          type: string
          nullable: true
          readOnly: true
        source_type:
          type: string
          enum: [docker_image, dockerfile, git]
          readOnly: true
        docker_image:
          type: string
          nullable: true
          description: (source docker_image) Image configurée.
        docker_image_tag:
          type: string
          nullable: true
        registry_credential_uuid:
          type: string
          nullable: true
          description: Credential du registry privé utilisé pour le pull (amendement n°17).
        use_build_server:
          type: boolean
        push_registry_credential_uuid:
          type: string
          nullable: true
        dockerfile:
          type: string
          nullable: true
          description: (source dockerfile) Contenu du Dockerfile.
        git_repository:
          type: string
          nullable: true
        git_branch:
          type: string
          nullable: true
        pre_deployment_command:
          type: string
          nullable: true
        post_deployment_command:
          type: string
          nullable: true
        private_key_uuid:
          type: string
          nullable: true
        build_pack:
          type: string
          nullable: true
          enum: [dockerfile, nixpacks, static, compose, null]
        base_directory:
          type: string
          nullable: true
        dockerfile_location:
          type: string
          nullable: true
        compose_file_location:
          type: string
          nullable: true
          description: (build pack compose) Chemin du fichier compose relatif à `base_directory`.
        raw_compose:
          type: boolean
          description: (build pack compose) Mode raw compose (compose-spec §9).
        publish_directory:
          type: string
          nullable: true
        watch_paths:
          type: array
          items:
            type: string
        auto_deploy:
          type: boolean
          description: (source git) Auto-deploy sur push activé.
        previews_enabled:
          type: boolean
        preview_url_template:
          type: string
        preview_max_concurrent:
          type: integer
          nullable: true
        preview_ttl_minutes:
          type: integer
          nullable: true
        preview_protection:
          type: string
          enum: [none, basic_auth]
        preview_fork_approval_enabled:
          type: boolean
        preview_exclude_drafts:
          type: boolean
        domains:
          type: array
          items:
            type: string
        ports_exposes:
          type: string
          nullable: true
        health_check:
          $ref: "#/components/schemas/HealthCheckConfig"
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        tags:
          type: array
          items:
            type: string
        desired_status:
          $ref: "#/components/schemas/DesiredStatus"
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          description: Horodatage de la dernière observation (au-delà d'un seuil, statut stale, §19.2).
          readOnly: true
        last_deployment_uuid:
          type: string
          nullable: true
          description: Dernier déploiement (tous statuts confondus).
          readOnly: true
        last_deployment_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        version:
          type: integer
          description: Version optimiste de la configuration (reflétée dans l'ETag).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Environment variables ----------------------------------------------
    PersistentStorageCreate:
      type: object
      required: [kind, mount_path]
      properties:
        kind:
          type: string
          enum: [volume, bind]
          description: Volume Docker nommé (recommandé) ou bind mount d'un répertoire hôte (§8).
        name:
          type: string
          description: >-
            (kind volume) Nom logique du volume — le nom Docker réel est
            préfixé par l'UUID de la ressource (INV-011). Requis pour
            `volume`.
        host_path:
          type: string
          description: (kind bind) Chemin absolu sur le serveur. Requis pour `bind`.
        mount_path:
          type: string
          description: Chemin de montage dans le container — unique par ressource.

    PersistentStorage:
      type: object
      description: Stockage persistant d'une application (§8) — les données survivent aux déploiements.
      required: [uuid, kind, mount_path, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        kind:
          type: string
          enum: [volume, bind]
        name:
          type: string
          nullable: true
        docker_volume_name:
          type: string
          nullable: true
          description: Nom Docker réel du volume (`<resource_uuid>_<name>`), déterministe.
          readOnly: true
        host_path:
          type: string
          nullable: true
        mount_path:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true

    EnvironmentVariableCreate:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 255
          description: Nom de la variable — unique par application.
        value:
          type: string
          writeOnly: true
          description: Valeur — écrite mais restituée seulement avec `read:sensitive` (INV-003).
        is_build_time:
          type: boolean
          default: false
          description: Injectée au build (ARG ou secret BuildKit selon `is_secret`, §5.2).
        is_secret:
          type: boolean
          default: false
          description: >-
            Secret de build (§5.2). Une variable secrète n'est **jamais** un
            `--build-arg` : un ARG est inscrit dans les métadonnées de l'image
            et `docker history` l'expose à qui peut la puller. Elle est passée
            en **secret BuildKit** (`--secret`), monté sous `/run/secrets/<clé>`
            le temps d'un seul `RUN`, et absent de toutes les couches (INV-003).
        is_literal:
          type: boolean
          default: false
          description: Valeur littérale, sans interpolation (§5.4).
        is_multiline:
          type: boolean
          default: false
          description: Valeur multi-lignes (clés, certificats).
        is_locked:
          type: boolean
          default: false
          description: >-
            Verrouillée — masquée pour tous (y compris read:sensitive) et
            non rééditable ; suppression puis recréation seulement (§5.4).

    EnvironmentVariableUpdate:
      type: object
      description: Mise à jour partielle. `key` n'est pas modifiable. Refusé sur une variable `is_locked`.
      properties:
        value:
          type: string
          writeOnly: true
        is_build_time:
          type: boolean
        is_secret:
          type: boolean
        is_literal:
          type: boolean
        is_multiline:
          type: boolean
        is_locked:
          type: boolean
          description: Peut passer de faux à vrai (verrouillage), jamais l'inverse.

    EnvironmentVariable:
      type: object
      description: >-
        Variable d'environnement d'une application (§5.4). `value` est
        `null` sans `read:sensitive` ou si `is_locked` (INV-003) —
        `is_redacted` l'indique.
      required: [uuid, key, is_build_time, is_literal, is_multiline, is_locked, is_redacted, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        key:
          type: string
        value:
          type: string
          nullable: true
          description: Valeur en clair — uniquement avec `read:sensitive` et si non verrouillée.
        is_redacted:
          type: boolean
          description: Vrai si `value` a été masquée (permission insuffisante ou variable verrouillée).
          readOnly: true
        is_build_time:
          type: boolean
        is_secret:
          type: boolean
          description: >-
            Secret de build : passé en secret BuildKit, jamais en
            `--build-arg` (INV-003, §5.2).
        is_literal:
          type: boolean
        is_multiline:
          type: boolean
        is_locked:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Deployments ---------------------------------------------------------
    DeploymentStatus:
      type: string
      enum:
        - queued
        - preparing
        - cloning
        - building
        - pushing
        - starting
        - healthchecking
        - switching
        - finishing
        - succeeded
        - failed
        - cancelled
        - retrying
        - superseded
      description: Machine à états d'un déploiement (§21.1). `succeeded`, `failed`, `cancelled` et `superseded` sont terminaux ; `superseded` = remplacé en file par un déploiement plus récent (coalescing).

    Deployment:
      type: object
      description: Déploiement d'une application — une tentative (§21.1). Un retry crée une tentative liée, l'historique n'est jamais réécrit.
      required: [uuid, application_uuid, status, trigger, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        application_uuid:
          type: string
          readOnly: true
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        trigger:
          type: string
          enum: [manual, api, webhook, preview, schedule, config_apply, cli_local]
          description: Origine du déclenchement (vocabulaire aligné sur l'enum `deployment_trigger` du data dictionary). Un rollback est signalé par `is_rollback`, pas par le trigger.
          readOnly: true
        is_rollback:
          type: boolean
          default: false
          readOnly: true
        force_rebuild:
          type: boolean
          default: false
          readOnly: true
        commit_sha:
          type: string
          nullable: true
          description: SHA Git immuable résolu au déclenchement (source git uniquement, §18.3).
          readOnly: true
        commit_message:
          type: string
          nullable: true
          readOnly: true
        image_digest:
          type: string
          nullable: true
          description: Digest OCI de l'image produite/déployée (résolu avant bascule, §18.3).
          readOnly: true
        config_version:
          type: integer
          nullable: true
          description: Version de configuration applicative embarquée dans ce déploiement (INV-014).
          readOnly: true
        attempt:
          type: integer
          default: 1
          description: Numéro de tentative (§21.1).
          readOnly: true
        error_message:
          type: string
          nullable: true
          description: Résumé d'échec, sans secret ni commande sensible.
          readOnly: true
        logs_url:
          type: string
          description: URL des logs de build (relative à /api/v1).
          readOnly: true
        queued_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        started_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        finished_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    LogLine:
      type: object
      description: Ligne de log de build — neutralisée (ANSI/HTML, §23.3), jamais de secret (INV-003).
      required: [sequence, timestamp, channel, message]
      properties:
        sequence:
          type: integer
          description: Numéro de séquence monotone — sert de curseur et de Last-Event-ID.
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
          enum: [stdout, stderr, system]
          description: Origine de la ligne (`system` = étapes du moteur de déploiement).
        message:
          type: string

    # --- Scheduled tasks (amendement n°15) -----------------------------------
    TaskOverlapPolicy:
      type: string
      enum: [skip, queue]
      default: skip
      description: >-
        Que faire quand une occurrence tombe alors que l'exécution précédente
        tourne encore. `skip` (défaut) abandonne l'occurrence — un cron qui
        déclenche plus vite qu'il ne finit ne doit pas empiler les exécutions
        sur le serveur ; `queue` la met en file derrière la précédente.
    TaskMissedRunPolicy:
      type: string
      enum: [run, skip]
      default: run
      description: >-
        Que faire d'une occurrence que le scheduler n'a pas vue à temps
        (instance arrêtée). `run` (défaut) la déclenche une fois au
        redémarrage — un nettoyage nocturne raté reste utile ; `skip`
        l'abandonne — un « résumé de 9h » envoyé à 15h est du bruit. Dans les
        deux cas, l'occurrence manquée est **tracée** (`skipped` + raison),
        jamais oubliée en silence.
    TaskExecutionStatus:
      type: string
      enum: [running, succeeded, failed, skipped]
    ScheduledTask:
      type: object
      description: Cron exécutant une commande dans le container d'une ressource (§192).
      required: [uuid, name, command, cron_expression]
      properties:
        uuid:
          type: string
          readOnly: true
        application_uuid:
          type: string
          readOnly: true
        name:
          type: string
        command:
          type: string
          description: Commande passée au shell du container — jamais assainie (c'est du shell voulu), toujours quotée (INV-012).
        container:
          type: string
          nullable: true
          description: Container cible dans un stack ; `null` = le container de la ressource.
        cron_expression:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        overlap_policy:
          $ref: "#/components/schemas/TaskOverlapPolicy"
        missed_run_policy:
          $ref: "#/components/schemas/TaskMissedRunPolicy"
        timeout_seconds:
          type: integer
        next_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ScheduledTaskCreate:
      type: object
      required: [name, command, cron_expression]
      properties:
        name:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        container:
          type: string
          nullable: true
        cron_expression:
          type: string
          minLength: 1
        timezone:
          type: string
          default: UTC
        enabled:
          type: boolean
          default: true
        overlap_policy:
          $ref: "#/components/schemas/TaskOverlapPolicy"
        missed_run_policy:
          $ref: "#/components/schemas/TaskMissedRunPolicy"
        timeout_seconds:
          type: integer
          minimum: 1
          default: 300
    ScheduledTaskUpdate:
      type: object
      properties:
        name:
          type: string
        command:
          type: string
        container:
          type: string
          nullable: true
        cron_expression:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        overlap_policy:
          $ref: "#/components/schemas/TaskOverlapPolicy"
        missed_run_policy:
          $ref: "#/components/schemas/TaskMissedRunPolicy"
        timeout_seconds:
          type: integer
          minimum: 1
    TaskExecution:
      type: object
      description: Une exécution — ou une occurrence explicitement non exécutée.
      required: [uuid, status, started_at]
      properties:
        uuid:
          type: string
          readOnly: true
        status:
          $ref: "#/components/schemas/TaskExecutionStatus"
        skip_reason:
          type: string
          nullable: true
          description: Renseigné si et seulement si le statut est `skipped`.
        exit_code:
          type: integer
          nullable: true
        output:
          type: string
          nullable: true
          description: stdout et stderr combinés, **tronqués** (voir `output_truncated`). Jamais de valeur de secret (INV-003).
        output_truncated:
          type: boolean
          description: Vrai si la sortie a été coupée — ce qui est affiché n'est alors pas tout.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true

    DnsCredential:
      type: object
      description: >-
        Credential DNS-01 (proxy-contract §7.2). Le contenu **n'est jamais
        renvoyé** : il n'existe que chiffré en base et dans un fichier 0600 sur
        le serveur.
      required: [uuid, name, provider]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        provider:
          type: string
          description: Identifiant provider Lego (cloudflare, route53, ovh…).
        in_use:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    DnsCredentialCreate:
      type: object
      required: [name, provider, config]
      properties:
        name:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        config:
          type: object
          additionalProperties:
            type: string
          description: Variables d'environnement attendues par Lego pour ce provider.

    RegistryCredential:
      type: object
      description: >-
        Credential d'un registry privé (§6.5). Le mot de passe **n'est jamais
        renvoyé**, quelle que soit la permission : il n'existe qu'au bout d'un
        `docker login --password-stdin` sur le serveur (INV-003).
      required: [uuid, name, registry_url, username]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        registry_url:
          type: string
          description: Ex. ghcr.io, registry.gitlab.com — validé par la policy SSRF (§23.3).
        username:
          type: string
        in_use:
          type: boolean
          readOnly: true
          description: Vrai si une application ou un artifact de rollback en dépend — la suppression est alors refusée en 409 (§19.2).
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RegistryCredentialCreate:
      type: object
      required: [name, registry_url, username, password]
      properties:
        name:
          type: string
          minLength: 1
        registry_url:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          description: Mot de passe ou token. Chiffré au repos (ADR-003), jamais relu par l'API.
    RegistryCredentialUpdate:
      type: object
      properties:
        name:
          type: string
        registry_url:
          type: string
        username:
          type: string
        password:
          type: string

    # --- Databases -----------------------------------------------------------
    DatabaseCreatePostgresql:
      type: object
      description: Création d'une base PostgreSQL managée (§6). Les credentials omis sont auto-générés.
      required: [name, project_uuid, environment_uuid, server_uuid]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
        environment_uuid:
          type: string
        server_uuid:
          type: string
        destination_uuid:
          type: string
          nullable: true
        image:
          type: string
          default: postgres:16-alpine
          description: Image PostgreSQL (tag libre, §6.2).
        postgres_user:
          type: string
          default: postgres
        postgres_password:
          type: string
          writeOnly: true
          description: Omis = mot de passe auto-généré de 64 caractères (§6.2).
        postgres_db:
          type: string
          description: Nom de la base initiale — défaut = valeur de `postgres_user`.
        postgres_conf:
          type: string
          nullable: true
          description: Configuration postgresql.conf custom (§6.2).
        postgres_initdb_args:
          type: string
          nullable: true
        is_public:
          type: boolean
          default: false
          description: Exposition publique (§6.2).
        public_access_mode:
          type: string
          enum: [port_mapping, tcp_proxy]
          default: port_mapping
          description: >-
            `port_mapping` publie le port sur le container de la base : le
            changer la **redémarre**. `tcp_proxy` la route par le proxy : le
            port public devient modifiable sans jamais toucher à la base
            (amendement n°22).
        public_port:
          type: integer
          nullable: true
          minimum: 1024
          maximum: 65535
          description: Port public si `is_public` — omis = attribué automatiquement.
        ssl_enabled:
          type: boolean
          description: >-
            TLS côté base, avec un certificat signé par la **CA du serveur**
            (§6.3, amendement n°23). La CA est générée à la demande et exposée
            en lecture (`GET /servers/{uuid}/ca`) pour que les clients puissent
            *vérifier* — un TLS que le client ne vérifie pas ne protège de rien.
        ssl_mode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
          default: disable
          description: Mode SSL PostgreSQL (§6.3).
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        instant_start:
          type: boolean
          default: false
          description: Démarre la base immédiatement après création.

    DatabaseUpdate:
      type: object
      description: >-
        Mise à jour partielle. Les changements d'image, de configuration ou
        de credentials nécessitent un redémarrage (`restart_required=true`
        dans la réponse).
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        image:
          type: string
        postgres_password:
          type: string
          writeOnly: true
          description: Rotation du mot de passe.
        postgres_conf:
          type: string
          nullable: true
        is_public:
          type: boolean
        public_access_mode:
          type: string
          enum: [port_mapping, tcp_proxy]
          description: >-
            Comment la base est exposée (§6.2, amendement n°22).
            `port_mapping` publie le port sur le container de la base : le
            changer la **redémarre**. `tcp_proxy` la route par le proxy : changer
            le port public recrée le **proxy** (quelques secondes, aucune donnée
            touchée) et la base ne bouge pas.
        public_port:
          type: integer
          nullable: true
          minimum: 1024
          maximum: 65535
        ssl_enabled:
          type: boolean
          description: >-
            TLS côté base, avec un certificat signé par la **CA du serveur**
            (§6.3, amendement n°23). La CA est générée à la demande et exposée
            en lecture (`GET /servers/{uuid}/ca`) pour que les clients puissent
            *vérifier* — un TLS que le client ne vérifie pas ne protège de rien.
        ssl_mode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
        limits:
          $ref: "#/components/schemas/ResourceLimits"

    Database:
      type: object
      description: >-
        Base de données managée (§6, v1 — PostgreSQL). Les champs
        `postgres_password`, `internal_url` et `external_url` contiennent
        des credentials — `null` sans `read:sensitive` (INV-003),
        `is_redacted` l'indique.
      required:
        - uuid
        - name
        - engine
        - project_uuid
        - environment_uuid
        - server_uuid
        - desired_status
        - observed_status
        - is_redacted
        - created_at
        - version
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        engine:
          type: string
          enum: [postgresql]
          description: Moteur — v1 limitée à PostgreSQL ; enum étendue avec les moteurs P1 suivants.
          readOnly: true
        project_uuid:
          type: string
          readOnly: true
        environment_uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          readOnly: true
        destination_uuid:
          type: string
          nullable: true
          readOnly: true
        image:
          type: string
        postgres_user:
          type: string
        postgres_password:
          type: string
          nullable: true
          description: Mot de passe — uniquement avec `read:sensitive`.
        postgres_db:
          type: string
        postgres_conf:
          type: string
          nullable: true
        internal_url:
          type: string
          nullable: true
          description: >-
            URL de connexion interne (hostname = UUID sur le réseau Docker,
            §6.2). Contient le mot de passe — uniquement avec
            `read:sensitive`.
        external_url:
          type: string
          nullable: true
          description: URL publique si `is_public` — uniquement avec `read:sensitive`.
        is_redacted:
          type: boolean
          description: Vrai si les champs sensibles ont été masqués faute de `read:sensitive`.
          readOnly: true
        is_public:
          type: boolean
        public_access_mode:
          type: string
          enum: [port_mapping, tcp_proxy]
        public_port:
          type: integer
          nullable: true
        ssl_enabled:
          type: boolean
          description: >-
            TLS côté base, avec un certificat signé par la **CA du serveur**
            (§6.3, amendement n°23). La CA est générée à la demande et exposée
            en lecture (`GET /servers/{uuid}/ca`) pour que les clients puissent
            *vérifier* — un TLS que le client ne vérifie pas ne protège de rien.
        ssl_mode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        desired_status:
          $ref: "#/components/schemas/DesiredStatus"
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        restart_required:
          type: boolean
          default: false
          description: Vrai si une modification de configuration attend un redémarrage pour prendre effet.
          readOnly: true
        last_online_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Backups -------------------------------------------------------------
    RetentionPolicy:
      type: object
      description: Règles de rétention cumulatives (§7.2) — 0 = illimité.
      properties:
        max_count:
          type: integer
          minimum: 0
          default: 0
          description: Nombre maximal de backups conservés.
        max_age_days:
          type: integer
          minimum: 0
          default: 0
          description: Ancienneté maximale en jours.
        max_size_gb:
          type: number
          minimum: 0
          default: 0
          description: Taille totale maximale en Go.

    BackupPlanCreate:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          description: >-
            Expression cron (5 champs) ou alias — every_minute, hourly,
            daily, weekly, monthly, yearly (§7.1).
          example: daily
        timezone:
          type: string
          default: UTC
          description: Timezone d'interprétation du cron (§24.3).
        enabled:
          type: boolean
          default: true
        dump_all:
          type: boolean
          default: false
          description: Sauvegarde toutes les bases de l'instance moteur (pg_dumpall).
        databases_to_include:
          type: array
          items:
            type: string
          description: Bases à inclure — vide = base principale seulement (ignoré si `dump_all`).
          default: []
        save_local:
          type: boolean
          default: true
          description: Conserver le fichier local (§7.2).
        save_s3:
          type: boolean
          default: false
          description: Uploader vers un S3 configuré.
        s3_storage_uuid:
          type: string
          nullable: true
          description: S3 Storage cible — requis si `save_s3` (provisionné via l'UI dans cette v1).
        s3_only:
          type: boolean
          default: false
          description: Supprimer le fichier local après upload S3 réussi.
        local_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        s3_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        timeout_seconds:
          type: integer
          minimum: 60
          default: 3600
        drill_enabled:
          type: boolean
          default: false
          description: >-
            Restore drill périodique (ADR-014, amendement n°16) : le dernier
            dump est restauré dans une base **jetable** sur le même serveur,
            son contenu est recompté puis la base est détruite.
        drill_interval_days:
          type: integer
          minimum: 1
          default: 7

    BackupPlanUpdate:
      type: object
      description: Mise à jour partielle du plan.
      properties:
        frequency:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        dump_all:
          type: boolean
        databases_to_include:
          type: array
          items:
            type: string
        save_local:
          type: boolean
        save_s3:
          type: boolean
        s3_storage_uuid:
          type: string
          nullable: true
        s3_only:
          type: boolean
        local_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        s3_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        timeout_seconds:
          type: integer
          minimum: 60
        drill_enabled:
          type: boolean
        drill_interval_days:
          type: integer
          minimum: 1

    BackupPlan:
      type: object
      description: Plan de backup planifié d'une base (§7).
      required: [uuid, database_uuid, frequency, enabled, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        database_uuid:
          type: string
          readOnly: true
        frequency:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        dump_all:
          type: boolean
        databases_to_include:
          type: array
          items:
            type: string
        save_local:
          type: boolean
        save_s3:
          type: boolean
        s3_storage_uuid:
          type: string
          nullable: true
        s3_only:
          type: boolean
        local_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        s3_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        timeout_seconds:
          type: integer
        next_run_at:
          type: string
          nullable: true
          format: date-time
          description: Prochaine exécution prévisualisée (§24.3).
          readOnly: true
        last_execution_uuid:
          type: string
          nullable: true
          readOnly: true
        last_execution_status:
          type: string
          nullable: true
          enum: [queued, running, succeeded, partial, failed, null]
          readOnly: true
        drill_enabled:
          type: boolean
          description: >-
            Restore drill périodique (ADR-014) : le dernier dump est restauré
            dans une base **jetable** sur le même serveur, le contenu est
            recompté, puis la base est détruite. Un backup jamais restauré
            n'est pas un backup, c'est un fichier.
        drill_interval_days:
          type: integer
          minimum: 1
        last_drill_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_drill_status:
          type: string
          nullable: true
          enum: [running, succeeded, failed, null]
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    RestoreDrill:
      type: object
      description: >-
        Une répétition de restauration (ADR-014). `tables_expected` est le
        nombre de tables comptées **dans la base source au moment du dump** :
        un dump peut se décompresser proprement, se restaurer sans erreur et ne
        rien contenir — un `psql` qui restaure du vide sort en 0. Le drill
        compare, il ne se contente pas de ne pas échouer.
      required: [uuid, status, started_at]
      properties:
        uuid:
          type: string
          readOnly: true
        execution_uuid:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [running, succeeded, failed]
        tables_expected:
          type: integer
          nullable: true
        tables_restored:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
          description: Raison de l'échec — jamais un credential.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true

    BackupExecution:
      type: object
      description: >-
        Exécution d'un plan de backup (§7.3, §20.5). `partial` = succès
        local mais échec S3 — jamais présenté comme un succès global.
      required: [uuid, backup_plan_uuid, database_uuid, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        backup_plan_uuid:
          type: string
          readOnly: true
        database_uuid:
          type: string
          readOnly: true
        status:
          type: string
          enum: [queued, running, succeeded, partial, failed]
          readOnly: true
        trigger:
          type: string
          enum: [scheduled, manual]
          readOnly: true
        filename:
          type: string
          nullable: true
          description: Nom du fichier de backup produit.
          readOnly: true
        size_bytes:
          type: integer
          nullable: true
          readOnly: true
        checksum:
          type: string
          nullable: true
          description: Checksum du fichier (vérifié à l'upload et au restore, §20.5).
          readOnly: true
        local_available:
          type: boolean
          description: Fichier encore présent localement (selon rétention et `s3_only`).
          readOnly: true
        s3_uploaded:
          type: boolean
          readOnly: true
        message:
          type: string
          nullable: true
          description: Détail d'erreur ou d'avertissement, sans secret.
          readOnly: true
        started_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        finished_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    RestoreRequest:
      type: object
      description: Demande de restore — opération destructive à confirmation explicite (§20.5).
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: DOIT valoir `true` — toute autre valeur → `422`.
        allow_non_empty:
          type: boolean
          default: false
          description: Confirmation renforcée requise pour restaurer vers une base non vide (§20.5).
        source:
          type: string
          enum: [local, s3]
          default: local
          description: Emplacement du fichier à utiliser — `s3` télécharge d'abord l'objet distant.
        custom_command:
          type: string
          nullable: true
          description: >-
            Commande de restore personnalisée (défaut pg_restore, §7.3).
            Validée et échappée côté serveur (INV-012).

    # --- Jobs ----------------------------------------------------------------
    JobStatus:
      type: string
      enum:
        - scheduled
        - queued
        - leased
        - running
        - retry_wait
        - succeeded
        - cancelled
        - dead_letter
      description: >-
        Machine à états d'un job (§21.3). `succeeded`, `cancelled` et
        `dead_letter` sont terminaux — `dead_letter` signifie échec définitif
        après épuisement des retries.

    JobForgetRequest:
      type: object
      description: Corps du forget d'un job en dead-letter.
      properties:
        acknowledge_remnants:
          type: boolean
          default: false
          description: >-
            Confirmation explicite que les restes distants du job (ex.
            `remnants` d'un `resource.delete`, §20.6.4) sont assumés ou ont
            été nettoyés manuellement. Requis (`true`) si le job laisse des
            restes distants, sinon `409` (`remnants_present`).

    JobStep:
      type: object
      description: Étape d'un job (visible, rejouable, avec remédiation — §20.1, §22.5).
      required: [name, status]
      properties:
        name:
          type: string
          description: Identifiant de l'étape (ex. ssh_connect, install_docker).
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped]
        message:
          type: string
          nullable: true
          description: Détail ou instruction de remédiation en cas d'échec.
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time

    Job:
      type: object
      description: Opération asynchrone créée par une réponse `202` (§21.3, §24.1).
      required: [uuid, type, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        type:
          type: string
          description: >-
            Type de job — ex. server.validate, application.start,
            application.delete, database.start, backup.execute,
            backup.restore, certificate.renew, encryption.rotate.
          readOnly: true
        queue:
          type: string
          description: File logique du job (ex. deploy, backup, cleanup, maintenance — §24.3).
          readOnly: true
        status:
          $ref: "#/components/schemas/JobStatus"
        resource_uuid:
          type: string
          nullable: true
          description: Ressource principale concernée.
          readOnly: true
        resource_type:
          type: string
          nullable: true
          enum: [server, application, database, backup_plan, certificate, null]
          readOnly: true
        retry_of_uuid:
          type: string
          nullable: true
          description: >-
            UUID du job d'origine si ce job est une **nouvelle tentative
            liée** créée par un retry depuis la dead-letter (spec
            deployment-engine §2.4).
          readOnly: true
        dead_lettered_at:
          type: string
          nullable: true
          format: date-time
          description: Passage en dead-letter, le cas échéant (§21.3).
          readOnly: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
          readOnly: true
        attempt:
          type: integer
          default: 1
          description: Numéro de tentative (retries §21.3).
          readOnly: true
        result:
          type: object
          nullable: true
          description: Résultat structuré en cas de succès (contenu selon le type de job, jamais de secret).
          additionalProperties: true
          readOnly: true
        error:
          allOf:
            - $ref: "#/components/schemas/Error"
          nullable: true
          description: Erreur finale en cas d'échec (même schéma que les erreurs HTTP, sans request_id pertinent).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        finished_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
