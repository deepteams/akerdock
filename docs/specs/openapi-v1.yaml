  /applications/{application_uuid}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: listApplicationPullRequests
      summary: Open pull requests of the application's repository
      description: >-
        Read live from the provider via the source's GitHub App (§2.2)
        — never stored. Used to trigger a preview from the
        platform (§20.4). `409` if the source is not an installed
        GitHub App.
      x-required-permission: applications:read
      responses:
        "200":
          description: Open PRs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [number, title, branch, head_sha, is_fork]
                      properties:
                        number:
                          type: integer
                        title:
                          type: string
                        branch:
                          type: string
                        head_sha:
                          type: string
                        is_fork:
                          type: boolean
                        draft:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: listApplicationPreviews
      summary: PR previews of an application
      x-required-permission: previews:read
      responses:
        "200":
          description: Non-destroyed previews.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: deployPreviewForPr
      summary: Deploy a PR's preview from the platform
      description: >-
        The equivalent of the `/deploy` comment (§20.4.7), without going
        through the provider: the PR is re-read from it (branch, head SHA,
        fork), the preview created or restarted, and promoted under the same
        rules — a fork PR stays pending approval (INV-010). `409` if
        previews are disabled, if the source is not an installed GitHub
        App, or if the PR is not open.
      x-required-permission: previews:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pr_id]
              properties:
                pr_id:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Preview created or restarted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

