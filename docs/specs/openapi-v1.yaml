    post:
      tags: [Applications]
      operationId: deployApplication
      summary: Déclencher un déploiement
      description: >-
        Met en file un déploiement complet (§20.2, §21.1) — clone/pull selon
        la source, build, health checks puis bascule. Répond `202` avec le
        `deployment_uuid` à suivre sur `GET /deployments/{uuid}`. Soumis à la
        file par serveur (`concurrent_builds`, `deployment_queue_limit`,
        §5.5) ; file pleine → `429`.
      x-required-permission: deploy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force_rebuild:
                  type: boolean
                  default: false
                  description: Build sans cache.
      responses:
        "202":
          description: Déploiement mis en file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/rollback:
