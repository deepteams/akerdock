    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Applications]
      operationId: destroyPreview
      summary: Destroy a PR's preview
      description: >-
        Destroys the instance (§20.4.6): the preview's containers, volumes,
        networks and routing — production is never touched (INV-011). The PR
        stays open: a `/deploy` or a push recreates a fresh instance.
        `409` if the preview is already destroyed or being destroyed.
      x-required-permission: previews:manage
      responses:
        "202":
          description: Destruction queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/logs:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Applications]
      operationId: getPreviewLogs
      summary: Logs of a preview's containers
      description: >-
        The last lines of a container of the preview instance —
        read directly on the server (`docker logs`), never stored.
        For a compose stack, `component` designates the service (required
        as soon as the stack has components). `409` if the container does
        not exist (preview destroyed or never started); `404` if the
        component is unknown.
      x-required-permission: previews:read
      parameters:
        - name: lines
          in: query
          required: false
          description: Number of tail lines (default 200, max 2000).
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
        - name: component
          in: query
          required: false
          description: Name of the compose service whose logs to read.
          schema:
            type: string
            maxLength: 63
      responses:
        "200":
          description: Container logs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/envs:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Applications]
      operationId: listPreviewEnvs
      summary: Effective variables of a preview
      description: >-
        The shared preview set (INV-010) merged with the overrides
        dedicated to THIS PR — per key, the override wins. Each line says
        where it comes from (`is_preview_override`).
      x-required-permission: secrets:read
      responses:
        "200":
          description: Effective variables.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvironmentVariable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createPreviewEnv
      summary: Create a variable dedicated to this preview
      description: >-
        An override local to the PR: same key as the shared set → this
        value wins for this preview only; new key → additional
        variable of this preview. Applied at the preview's next
        deployment.
      x-required-permission: secrets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableCreate"
      responses:
        "201":
          description: Override created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Applications]
      operationId: createPreviewTerminalSession
      summary: Open a terminal session in a container of the preview
      description: >-
        Same contract as the application terminal (§5.7, §24.4) — short-lived
        single-use token, audited and bounded session — but the target is
        a container of the preview INSTANCE (INV-011). `component` designates
        the service for a compose stack; `404` if the component is
        unknown; `409` if the preview is destroyed.
      x-required-permission: terminal:open
      parameters:
        - name: component
          in: query
          required: false
          description: (compose build pack) Name of the service whose shell to open.
          schema:
            type: string
            maxLength: 63
      responses:
        "201":
          description: Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/metrics:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Applications]
      operationId: getPreviewMetrics
      summary: Live metrics per component of a preview
      description: >-
        Like `getApplicationMetrics` but for the containers of the preview
        INSTANCE (INV-011), read on demand via `docker stats` (ADR-034). `409`
        if the preview is destroyed.
      x-required-permission: previews:read
      responses:
        "200":
          description: Instant metrics.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComponentMetric"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/port-forwards:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Applications]
      operationId: createPreviewPortForward
      summary: Open a TCP tunnel to a container of the preview
      description: >-
        Same contract as the application port-forward (ADR-032), but the target
        is a container of the preview INSTANCE (INV-011). `409` if the preview
        is destroyed; `404` if the component is unknown.
      x-required-permission: port-forwards:open
      parameters:
        - name: component
          in: query
          required: false
          description: (compose build pack) Service whose container is targeted.
          schema:
            type: string
            maxLength: 63
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortForwardCreate"
      responses:
        "201":
          description: Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortForwardSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/keep:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Applications]
      operationId: keepPreview
      summary: Re-arm a preview's TTL
      description: >-
        Resets the inactivity clock (§20.4.3) and clears the expiration
        warning — UI equivalent of the `/keep` command. The preview stays
        alive until the next TTL. `409` if it is already destroyed.
      x-required-permission: previews:manage
      responses:
        "204":
          description: TTL re-armed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/redeploy:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Applications]
      operationId: redeployPreview
      summary: Redeploy an existing PR instance
      description: >-
        Redeploys THIS instance at the head SHA it is already pinned to
        (§20.4) — the pull request is not re-read, and a fork preview stays
        subject to its approval. `skip_build` reruns the pipeline over the
        artifact already running (ADR-048), which is how a change to the
        preview's own variables (INV-010) is applied without a rebuild.
        `409` if the preview is destroyed, awaiting approval, or — for
        `skip_build` — has no successful deployment to reuse.
      x-required-permission: previews:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                `force_rebuild` and `skip_build` are mutually exclusive.
              properties:
                force_rebuild:
                  type: boolean
                  default: false
                  description: Build without cache.
                skip_build:
                  type: boolean
                  default: false
                  description: >-
                    Redeploy the current artifact with the preview's current
                    configuration; no clone, no build.
      responses:
        "202":
          description: Deployment queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/previews/{preview_uuid}/approve:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - name: preview_uuid
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Applications]
      operationId: approvePreviewFork
      summary: Approve the preview of a fork PR
      description: >-
        Explicit approval by a maintainer (§20.4.8, INV-010): the fork's
        preview is then promoted if capacity allows. Not applicable (409)
        for an internal or already approved PR.
      x-required-permission: previews:manage
      responses:
        "202":
          description: Approved — deployment promoted or queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/scheduled-tasks:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [ScheduledTasks]
      operationId: listScheduledTasks
      summary: List an application's scheduled tasks
      x-required-permission: applications:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of scheduled tasks.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledTask"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [ScheduledTasks]
      operationId: createScheduledTask
      summary: Create a scheduled task
      description: >-
        The command is executed inside the resource's container
        (`docker exec`). The cron expression accepts the same aliases as the
        backup plans (`@daily`, `@hourly`, …) and is validated here: an
        invalid expression is refused with `422`, never accepted then
        silently never triggered.
      x-required-permission: applications:exec
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledTaskCreate"
      responses:
        "201":
          description: Task created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scheduled-tasks/{task_uuid}:
    parameters:
      - $ref: "#/components/parameters/TaskUuid"
    get:
      tags: [ScheduledTasks]
      operationId: getScheduledTask
      summary: Scheduled task details
      x-required-permission: applications:read
      responses:
        "200":
          description: The task.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTask"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [ScheduledTasks]
      operationId: updateScheduledTask
      summary: Update a scheduled task
      description: >-
        Sensitive PATCH — `If-Match` required (§24.1). Changing the cron
        reschedules the next occurrence; the history is never rewritten.
      x-required-permission: applications:exec
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledTaskUpdate"
      responses:
        "200":
          description: Task updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [ScheduledTasks]
      operationId: deleteScheduledTask
      summary: Delete a scheduled task
      description: The execution history is deleted with it (CASCADE).
      x-required-permission: applications:exec
      responses:
        "204":
          description: Task deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scheduled-tasks/{task_uuid}/run:
    parameters:
      - $ref: "#/components/parameters/TaskUuid"
    post:
      tags: [ScheduledTasks]
      operationId: runScheduledTask
      summary: Trigger a scheduled task immediately
      description: >-
        Manual trigger — same execution path as the cron trigger,
        including the overlap policy (`overlap_policy`).
      x-required-permission: applications:exec
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Execution accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /scheduled-tasks/{task_uuid}/executions:
    parameters:
      - $ref: "#/components/parameters/TaskUuid"
    get:
      tags: [ScheduledTasks]
      operationId: listTaskExecutions
      summary: A task's execution history
      description: >-
        From newest to oldest. A **non-executed** occurrence (previous run
        still in progress, or instance stopped at the time of the
        occurrence) appears with the `skipped` status and its reason: an
        empty history would mean "nothing was ever scheduled".
      x-required-permission: applications:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of executions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskExecution"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

