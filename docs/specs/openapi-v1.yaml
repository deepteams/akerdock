  # ---------------------------------------------------------------------------
  # Shared variables (§5.4, §3.1) — {{team.VAR}} / {{project.VAR}} /
  # {{environment.VAR}} interpolated into resource values (except
  # `literal`), plus `server`-scoped variables injected into every
  # resource deployed on that server (the resource's own variable
  # wins). An unknown reference stays verbatim — visible, hence diagnosable.
  # ---------------------------------------------------------------------------
  /shared-variables:
    get:
      tags: [SharedVariables]
      operationId: listSharedVariables
      summary: List the team's shared variables
      x-required-permission: secrets:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [team, project, environment, server]
      responses:
        "200":
          description: Page of variables (values only with `read:sensitive`, INV-003).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SharedVariable"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [SharedVariables]
      operationId: createSharedVariable
      summary: Create a shared variable
      description: >-
        The scope names the inheritance level: `team` (no parent),
        `project`/`environment`/`server` (parent required). A key is
        unique per parent. The value is encrypted at rest and takes effect at
        the next deployment of the affected resources.
      x-required-permission: secrets:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedVariableCreate"
      responses:
        "201":
          description: Variable created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /shared-variables/{shared_variable_uuid}:
    parameters:
      - $ref: "#/components/parameters/SharedVariableUuid"
    patch:
      tags: [SharedVariables]
      operationId: updateSharedVariable
      summary: Update a shared variable (value, masking)
      description: The key and scope are immutable — recreate to change identity.
      x-required-permission: secrets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedVariableUpdate"
      responses:
        "200":
          description: Variable updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [SharedVariables]
      operationId: deleteSharedVariable
      summary: Delete a shared variable
      description: >-
        Values already interpolated into running containers
        only change at the next deployment.
      x-required-permission: secrets:write
      responses:
        "204":
          description: Variable deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Jobs
  # ---------------------------------------------------------------------------
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      description: >-
        Paginated list of the team's jobs (INV-002), from newest to
        oldest. Main use: inventory of the **dead-letter**
        (`?status=dead_letter`) — dead-letter jobs are never
        replayed automatically and are kept until intervention
        (retry/forget, §21.3).
      x-required-permission: deployments:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: Filter by status (e.g. `dead_letter`).
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: queue
          in: query
          required: false
          description: Filter by logical queue (e.g. `deploy`, `backup`, `cleanup`, `maintenance` — §24.3).
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Filter by job type (e.g. `resource.delete`, `backup.execute`).
          schema:
            type: string
      responses:
        "200":
          description: Page of jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /jobs/{job_uuid}:
    parameters:
      - $ref: "#/components/parameters/JobUuid"
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Track an asynchronous operation
      description: >-
        Returns the state of a job created by a `202` response (state machine
        §21.3), with its steps, its progress and its result or its
        error. Jobs are scoped per team like any resource
        (INV-002).
      x-required-permission: deployments:read
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /jobs/{job_uuid}/retry:
    parameters:
      - $ref: "#/components/parameters/JobUuid"
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Retry a dead-letter job
      description: >-
        Replay from the dead-letter (deployment-engine spec §2.4): a manual
        **audited** action (§23.4) that creates a **linked new
        attempt** — a new job is queued with `retry_of_uuid`
        pointing to the original job; the original job is never
        re-queued (the attempt history is preserved). Fix
        the root cause before retrying, otherwise the new attempt
        will fail identically. `409` (`invalid_state`) if the job is not
        in `dead_letter`.
      x-required-permission: jobs:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Linked new attempt created — track the new job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /jobs/{job_uuid}/forget:
    parameters:
      - $ref: "#/components/parameters/JobUuid"
    post:
      tags: [Jobs]
      operationId: forgetJob
      summary: Forget a dead-letter job
      description: >-
        Definitive **audited** closure (§23.4) of a dead-letter job whose
        operation no longer makes sense (the job moves to `cancelled`). If the
        job leaves **remote remnants** (e.g. `resource.delete` with
        `remnants`, §20.6.4), the body MUST carry
        `acknowledge_remnants=true`, otherwise `409` (`remnants_present`) with
        the list of remnants in `details` — forget performs no
        remote cleanup, the orphaned objects remain to be handled
        manually. `409` (`invalid_state`) if the job is not in
        `dead_letter`.
      x-required-permission: jobs:manage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobForgetRequest"
      responses:
        "200":
          description: Job closed (`cancelled` status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # External endpoints (bastion, ADR-045)
  # ---------------------------------------------------------------------------
  /external-endpoints:
    get:
      tags: [ExternalEndpoints]
      operationId: listExternalEndpoints
      summary: List the team's declared external endpoints
      description: >-
        Bastion targets declared ahead of time (ADR-045): an exact `host`/`port`
        pair reached from a given egress server. The address is a property of
        this resource, never of a tunnel request — which is what keeps the
        tunnel protocol addressless and stops a `write` holder from scanning the
        server's private network.
      x-required-permission: external-endpoints:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of external endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalEndpoint"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ExternalEndpoints]
      operationId: createExternalEndpoint
      summary: Declare an external endpoint
      description: >-
        Declaring an endpoint draws a network boundary, so it is an admin-level
        act, deliberately separate from opening a tunnel to one. Defaults to
        `criticality: sensitive` — reaching a real database is the usual reason
        to declare one, and downgrading should be a conscious choice.
      x-required-permission: external-endpoints:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalEndpointCreate"
      responses:
        "201":
          description: Endpoint declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /external-endpoints/{external_endpoint_uuid}:
    parameters:
      - $ref: "#/components/parameters/ExternalEndpointUuid"
    get:
      tags: [ExternalEndpoints]
      operationId: getExternalEndpoint
      summary: Read an external endpoint
      x-required-permission: external-endpoints:read
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [ExternalEndpoints]
      operationId: updateExternalEndpoint
      summary: Update an external endpoint
      x-required-permission: external-endpoints:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalEndpointCreate"
      responses:
        "200":
          description: Endpoint updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [ExternalEndpoints]
      operationId: deleteExternalEndpoint
      summary: Delete an external endpoint
      description: >-
        Live sessions targeting it are torn down at their next dial, like a
        destroyed preview.
      x-required-permission: external-endpoints:manage
      responses:
        "204":
          description: Endpoint deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /external-endpoints/{external_endpoint_uuid}/port-forwards:
    parameters:
      - $ref: "#/components/parameters/ExternalEndpointUuid"
    post:
      tags: [ExternalEndpoints]
      operationId: createExternalEndpointPortForward
      summary: Open a TCP tunnel to a declared external endpoint
      description: >-
        Mints a tunnel session (ADR-032 contract, ADR-045 target) with an
        **empty body**: neither host nor port is accepted from the client, both
        were frozen at declaration. On a `sensitive` endpoint the caller must
        hold a live access grant, otherwise `403` with code
        `access_request_required` and the URL of the request page in
        `request_url` — the CLI opens it, polls, and replays this call. A token
        that records no creator names no human for a grant to be issued to: it
        is refused with code `token_without_creator`, which the CLI does NOT
        poll on, since only re-issuing the token can lift it.
      x-required-permission: port-forwards:open
      responses:
        "201":
          description: Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortForwardSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Forbidden, or no live grant — code `access_request_required`, with
            `request_url` pointing at the dashboard page to obtain one. Or code
            `token_without_creator`, the refusal no grant can lift.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRequestRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /external-endpoints/{external_endpoint_uuid}/grants:
    parameters:
      - $ref: "#/components/parameters/ExternalEndpointUuid"
    get:
      tags: [ExternalEndpoints]
      operationId: listExternalEndpointGrants
      summary: List the access grants of an endpoint
      description: >-
        The audit surface of the feature: who asked for access, for what
        reason, for how long, with which factor, and whether it was renewed or
        revoked.
      x-required-permission: external-endpoints:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of grants.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalEndpointGrant"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [ExternalEndpoints]
      operationId: requestExternalEndpointGrant
      summary: Request (or renew) access to an external endpoint
      description: >-
        Opens a bounded window during which the caller may mint tunnels to this
        endpoint. Always requires a **fresh second factor** (rbac-matrix §5):
        the passkey ceremony when the user has one enrolled, a dedicated TOTP
        challenge otherwise — the server picks, the client never chooses. Without
        one, `403` with code `stepup_required`.


        Called while a grant is still live, it **renews** it: the window is
        pushed back and the sessions it opened keep running, so a transfer in
        flight survives. Renewal costs a fresh reason and a fresh factor, and is
        not capped by a total — the bound is the window itself, repeated.


        Browser sessions only: an API token cannot re-authenticate.
      x-required-permission: port-forwards:open
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalEndpointGrantCreate"
      responses:
        "201":
          description: Grant created or renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalEndpointGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Forbidden, or no fresh second factor — code `stepup_required`. The
            dashboard runs the ceremony the server names and replays the call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /external-endpoint-grants/{grant_uuid}:
    parameters:
      - $ref: "#/components/parameters/GrantUuid"
    delete:
      tags: [ExternalEndpoints]
      operationId: revokeExternalEndpointGrant
      summary: Revoke an access grant
      description: >-
        Closes the window and **tears down the sessions the grant opened** —
        otherwise revoking would mean nothing to someone already connected.
      x-required-permission: external-endpoints:manage
      responses:
        "204":
          description: Grant revoked and its sessions closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /port-forward-sessions:
    get:
      tags: [ExternalEndpoints]
      operationId: listPortForwardSessions
      summary: List the team's tunnel sessions
      description: >-
        The tunnels open right now, and the ones that closed recently — every
        target kind (application, database, preview, external endpoint), because
        the operational question is "what is currently forwarded out of this
        team", not "out of this endpoint". Read-only: the attach token is never
        readable back, here or anywhere else (§23.2).


        Defaults to the live sessions only; pass `active=false` to walk the
        history, and `external_endpoint_uuid` to narrow to one declared
        endpoint (ADR-045).
      x-required-permission: port-forwards:open
      parameters:
        - name: external_endpoint_uuid
          in: query
          required: false
          description: Restrict to the sessions targeting this external endpoint.
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: >-
            `true` (default) lists only the sessions still open — claimed or
            still redeemable, and not ended. `false` walks the history too.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of tunnel sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PortForwardSessionInfo"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /port-forward-sessions/{session_uuid}:
    parameters:
      - $ref: "#/components/parameters/PortForwardSessionUuid"
    delete:
      tags: [ExternalEndpoints]
      operationId: closePortForwardSession
      summary: Close a tunnel session
      description: >-
        Cuts a live tunnel. Closing **your own** session needs nothing more than
        the permission that opened it; closing **someone else's** is an
        administrative act and requires `external-endpoints:manage` — the same
        power that revokes a grant, for the same reason.


        The client is told why it was cut rather than left with a socket that
        died in silence (ADR-045 §5): `user_close` when the holder closed it,
        `revoked` when an administrator did. Ending an already-closed session is
        a no-op, not an error.
      x-required-permission: port-forwards:open
      responses:
        "204":
          description: Session closed (or already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ingress-endpoints:
    get:
      tags: [Ingress]
      operationId: listIngressEndpoints
      summary: List the team's declared ingress endpoints
      description: >-
        Public URLs relayed to a developer's machine (ADR-060): a stable FQDN
        terminated by one ingress server's proxy, relayed by its agent to
        whoever holds the attach socket. The hostname is a property of this
        resource, never of a session — no random per-session hostnames.
      x-required-permission: ingress-endpoints:read
      responses:
        "200":
          description: The team's ingress endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngressEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Ingress]
      operationId: createIngressEndpoint
      summary: Declare an ingress endpoint
      description: >-
        Declaring an endpoint publishes a hostname onto arbitrary laptop
        software, so it is an admin-level act, deliberately separate from
        attaching to one. Declaration pre-provisions the router and the
        certificate; until a laptop attaches, the URL serves an offline page.
        Defaults to `access: sso` — reachable by the team's authenticated
        users and nobody else; `none` is the conscious opt-out for the
        third-party-webhook case. noindex and forced HTTPS are unconditional.
      x-required-permission: ingress-endpoints:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressEndpointCreate"
      responses:
        "201":
          description: Endpoint declared; router deposit is under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ingress-endpoints/{ingress_endpoint_uuid}:
    parameters:
      - $ref: "#/components/parameters/IngressEndpointUuid"
    get:
      tags: [Ingress]
      operationId: getIngressEndpoint
      summary: Read an ingress endpoint
      x-required-permission: ingress-endpoints:read
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Ingress]
      operationId: updateIngressEndpoint
      summary: Update an ingress endpoint
      description: >-
        The FQDN and the server are immutable: both are baked into the issued
        certificate and the deposited router, so changing the URL is a delete
        and a fresh declaration. The access mode IS mutable here — switching
        to `none` is the audited admin act ADR-060 §5 describes.
      x-required-permission: ingress-endpoints:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressEndpointUpdate"
      responses:
        "200":
          description: Endpoint updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Ingress]
      operationId: deleteIngressEndpoint
      summary: Delete an ingress endpoint
      description: >-
        Removes the router and the hostname registration, and cuts the live
        attach session if one exists (reported to the CLI as `revoked`).
      x-required-permission: ingress-endpoints:manage
      responses:
        "204":
          description: Endpoint deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ingress-endpoints/{ingress_endpoint_uuid}/tunnels:
    parameters:
      - $ref: "#/components/parameters/IngressEndpointUuid"
    post:
      tags: [Ingress]
      operationId: createIngressTunnel
      summary: Attach to an ingress endpoint (mint)
      description: >-
        Mints an attach session with an **empty body** — the hostname, the
        server and the access regime were frozen at declaration; the local
        port is the laptop's business and never crosses the API. The token is
        redeemed **agent-side**, at `attach_url` on the endpoint's own FQDN
        (subprotocol `akerdock-ingress-v1`, outside OpenAPI — ADR-060 §3).


        `409` with code `occupied` names the current occupant (one laptop per
        endpoint); `409` with code `server_agent_unavailable` means the
        ingress server's agent channel is down and no attach can be expected.
      x-required-permission: ingress-tunnels:open
      responses:
        "201":
          description: Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressTunnelSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ingress-tunnel-sessions:
    get:
      tags: [Ingress]
      operationId: listIngressTunnelSessions
      summary: List the team's ingress attach sessions
      description: >-
        Who is publishing their machine right now, on which URL, since when —
        and the recent history. Read-only: the attach token is never readable
        back (§23.2). Defaults to live sessions; `active=false` walks the
        history, `ingress_endpoint_uuid` narrows to one endpoint.
      x-required-permission: ingress-endpoints:read
      parameters:
        - name: ingress_endpoint_uuid
          in: query
          required: false
          description: Restrict to the sessions of this ingress endpoint.
          schema:
            type: string
        - name: active
          in: query
          required: false
          description: >-
            `true` (default) lists only the sessions still open. `false` walks
            the history too.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of attach sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngressTunnelSessionInfo"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ingress-tunnel-sessions/{session_uuid}:
    parameters:
      - $ref: "#/components/parameters/IngressTunnelSessionUuid"
    delete:
      tags: [Ingress]
      operationId: closeIngressTunnelSession
      summary: Close an ingress attach session
      description: >-
        Cuts a live attach through the ingress server's agent. Closing **your
        own** session needs nothing more than the permission that opened it;
        closing **someone else's** requires `ingress-endpoints:manage`. The
        laptop is told why (`user_close` by the holder, `revoked` by an
        administrator) and, this being a policy close, does not re-dial
        (ADR-060 §6). Ending an already-closed session is a no-op.
      x-required-permission: ingress-tunnels:open
      responses:
        "204":
          description: Session closed (or already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Team-scoped API token (§10.3). Format `Authorization: Bearer
        <token>`. Tokens carry granular permissions (read,
        read:sensitive, write, deploy, root), an optional expiration and
        an optional CIDR IP allowlist.

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor, from `next_cursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page (1 to 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OauthProviderName:
      name: oauth_provider
      in: path
      required: true
      description: Identity provider for dashboard login (§10.2).
      schema:
        type: string
        enum: [github, gitlab, google, azure, bitbucket, oidc]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Idempotency key (§24.1). Replaying the same key with an identical
        body returns the original response; same key with a different
        body → `409` (`idempotency_conflict`). Kept for at least 24 h.
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Expected optimistic version of the resource (value of the `ETag`
        header of the last `GET`). Mismatch → `409` (`version_conflict`) with
        the current version in `details`.
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        Resume an SSE stream — sequence of the last event received
        (only with `Accept: text/event-stream`).
      schema:
        type: string
    WebhookUuid:
      name: uuid
      in: query
      required: false
      description: >-
        UUID(s) of the resources to deploy, comma-separated.
        Required if `tag` is absent.
      schema:
        type: string
      examples:
        single:
          value: rg8ks8c
          summary: A single resource
        multiple:
          value: rg8ks8c,fj3dk2a
          summary: Several resources
    WebhookTag:
      name: tag
      in: query
      required: false
      description: >-
        Comma-separated tag(s) — deploys all the team's resources
        carrying one of these tags. Required if `uuid` is absent.
      schema:
        type: string
    WebhookForce:
      name: force
      in: query
      required: false
      description: Forces a rebuild without cache.
      schema:
        type: boolean
        default: false
    TeamUuid:
      name: team_uuid
      in: path
      required: true
      description: UUID of the team.
      schema:
        type: string
    InvitationUuid:
      name: invitation_uuid
      in: path
      required: true
      description: UUID of the invitation.
      schema:
        type: string
    RoleUuid:
      name: role_uuid
      in: path
      required: true
      description: UUID of a custom role.
      schema:
        type: string
    UserUuid:
      name: user_uuid
      in: path
      required: true
      description: Public UUID of a user (member of a team).
      schema:
        type: string
    TokenUuid:
      name: token_uuid
      in: path
      required: true
      description: UUID of the API token (never its value).
      schema:
        type: string
    ProjectUuid:
      name: project_uuid
      in: path
      required: true
      description: UUID of the project.
      schema:
        type: string
    EnvironmentUuid:
      name: environment_uuid
      in: path
      required: true
      description: UUID of the environment.
      schema:
        type: string
    PrivateKeyUuid:
      name: private_key_uuid
      in: path
      required: true
      description: UUID of the private key.
      schema:
        type: string
    ChannelUuid:
      name: channel_uuid
      in: path
      required: true
      description: UUID of the notification channel.
      schema:
        type: string
    S3StorageUuid:
      name: s3_storage_uuid
      in: path
      required: true
      description: UUID of the S3 storage.
      schema:
        type: string
    ExternalEndpointUuid:
      name: external_endpoint_uuid
      in: path
      required: true
      description: UUID of the external endpoint.
      schema:
        type: string
    IngressEndpointUuid:
      name: ingress_endpoint_uuid
      in: path
      required: true
      description: UUID of the ingress endpoint.
      schema:
        type: string
    IngressTunnelSessionUuid:
      name: session_uuid
      in: path
      required: true
      description: UUID of the ingress attach session.
      schema:
        type: string
    GrantUuid:
      name: grant_uuid
      in: path
      required: true
      description: UUID of the access grant.
      schema:
        type: string
    PortForwardSessionUuid:
      name: session_uuid
      in: path
      required: true
      description: UUID of the tunnel session.
      schema:
        type: string
    ServerUuid:
      name: server_uuid
      in: path
      required: true
      description: UUID of the server.
      schema:
        type: string
    AdoptionScanUuid:
      name: adoption_scan_uuid
      in: path
      required: true
      description: UUID of the adoption scan (§20.7).
      schema:
        type: string
    ServiceComponentUuid:
      name: service_component_uuid
      in: path
      required: true
      description: UUID of a compose stack component.
      schema:
        type: string
    UptimeCheckUuid:
      name: uptime_check_uuid
      in: path
      required: true
      description: UUID of an uptime check (ADR-017).
      schema:
        type: string
    SharedVariableUuid:
      name: shared_variable_uuid
      in: path
      required: true
      description: UUID of a shared variable (§5.4).
      schema:
        type: string
    RegistryCredentialUuid:
      name: registry_credential_uuid
      in: path
      required: true
      description: UUID of the registry credential.
      schema:
        type: string
    TaskUuid:
      name: task_uuid
      in: path
      required: true
      description: UUID of the scheduled task.
      schema:
        type: string
    ApplicationUuid:
      name: application_uuid
      in: path
      required: true
      description: UUID of the application.
      schema:
        type: string
    ServiceUuid:
      name: service_uuid
      in: path
      required: true
      description: UUID of the compose stack.
      schema:
        type: string
    GithubAppUuid:
      name: github_app_uuid
      in: path
      required: true
      description: UUID of the GitHub App.
      schema:
        type: string
    StorageUuid:
      name: storage_uuid
      in: path
      required: true
      description: UUID of the persistent storage.
      schema:
        type: string
    EnvUuid:
      name: env_uuid
      in: path
      required: true
      description: UUID of the environment variable.
      schema:
        type: string
    DeploymentUuid:
      name: deployment_uuid
      in: path
      required: true
      description: UUID of the deployment.
      schema:
        type: string
    DatabaseUuid:
      name: database_uuid
      in: path
      required: true
      description: UUID of the database.
      schema:
        type: string
    BackupPlanUuid:
      name: backup_plan_uuid
      in: path
      required: true
      description: UUID of the backup plan.
      schema:
        type: string
    ExecutionUuid:
      name: execution_uuid
      in: path
      required: true
      description: UUID of the backup execution.
      schema:
        type: string
    CertificateUuid:
      name: certificate_uuid
      in: path
      required: true
      description: UUID of the certificate (observed reflection).
      schema:
        type: string
    JobUuid:
      name: job_uuid
      in: path
      required: true
      description: UUID of the job.
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Headers
  # ---------------------------------------------------------------------------
  headers:
    ETag:
      description: >-
        Optimistic version of the resource, to send back in `If-Match` on
        a sensitive `PATCH`.
      schema:
        type: string
    RetryAfter:
      description: Number of seconds to wait before retrying.
      schema:
        type: integer

  # ---------------------------------------------------------------------------
  # Responses (reusable errors — single Error schema, §24.1)
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Malformed request (syntax, invalid parameter).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: bad_request
            message: Invalid query parameter.
            details:
              - field: limit
                code: out_of_range
                message: limit must be between 1 and 100.
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    Unauthorized:
      description: Token absent, invalid, expired, revoked, outside the IP allowlist, or API disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthorized
            message: Authentication required.
            details: []
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    Forbidden:
      description: >-
        Insufficient permission for this action (see
        `x-required-permission`), or resource belonging to another team
        (INV-002 — may also respond 404 to avoid revealing existence).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: Insufficient permission for this action.
            details:
              - code: missing_permission
                message: "Required permission: write."
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    NotFound:
      description: Resource nonexistent or outside the scope of the token's team.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: Resource not found.
            details: []
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    Conflict:
      description: >-
        State conflict — existing dependencies (`dependency_exists`),
        concurrent operation in progress (`operation_in_progress`), uniqueness
        violated (`already_exists`), idempotency key replayed with a different
        body (`idempotency_conflict`), or invalid state transition
        (`invalid_state`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: dependency_exists
            message: The project still contains resources.
            details:
              - code: environment_not_empty
                message: The production environment contains 3 resources.
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    VersionConflict:
      description: >-
        Optimistic version conflict — the provided `If-Match` does not match
        the current version. `details` contains the current version
        (`current_version`) to fetch via a new `GET` before
        retrying.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: version_conflict
            message: The resource was modified elsewhere.
            details:
              - field: If-Match
                code: current_version
                message: "7"
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    UnprocessableEntity:
      description: Body syntactically valid but semantically invalid (business validation).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: The request contains invalid fields.
            details:
              - field: git_repository
                code: invalid_url
                message: Invalid Git repository URL.
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c
    TooManyRequests:
      description: >-
        Rate limit exceeded (200 req/min per token) or deployment queue
        full (`deployment_queue_limit`). Honor `Retry-After`.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Too many requests, retry later.
            details: []
            request_id: 018f4d2a-7c3b-7e1a-b0c4-9f2e8d1a6b3c

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Cross-cutting -------------------------------------------------------
    Error:
      type: object
      description: Single error schema of the API (§24.1). Never contains a secret or a stack trace.
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code. Notable values —
            bad_request, unauthorized, forbidden, not_found, already_exists,
            dependency_exists, operation_in_progress, invalid_state,
            version_conflict, idempotency_conflict, validation_failed,
            rate_limited, internal.
          example: validation_failed
        message:
          type: string
          description: Generic human-readable message (without sensitive data).
        details:
          type: array
          description: Structured and validated details (field errors, context).
          items:
            $ref: "#/components/schemas/ErrorDetail"
          default: []
        request_id:
          type: string
          description: Correlation identifier of the request (repeated in logs and audit, §23.4).

    ErrorDetail:
      type: object
      description: Error detail — optional target and specific code.
      required: [message]
      properties:
        field:
          type: string
          nullable: true
          description: Affected field or parameter (dotted notation), if applicable.
        code:
          type: string
          nullable: true
          description: Detail code (e.g. required, invalid_url, out_of_range, current_version).
        message:
          type: string
          description: Human-readable explanation.

    NextCursor:
      type: string
      nullable: true
      description: Opaque cursor of the next page — `null` on the last page.

    JobAccepted:
      type: object
      description: Standard response of long-running mutations (§24.1) — `202` with a tracking job.
      required: [job_uuid, status_url]
      properties:
        job_uuid:
          type: string
          description: UUID of the created job.
        status_url:
          type: string
          description: Tracking URL of the job (relative to /api/v1).
          example: /jobs/jb9x2mc

    DeploymentAccepted:
      type: object
      description: Response of a deployment trigger — the deployment is the main tracking object.
      required: [deployment_uuid, status_url]
      properties:
        deployment_uuid:
          type: string
          description: UUID of the queued deployment.
        status_url:
          type: string
          description: Tracking URL of the deployment (relative to /api/v1).
          example: /deployments/dp4k1zq
        job_uuid:
          type: string
          nullable: true
          description: Associated internal job, if exposed.

    BackupExecutionAccepted:
      allOf:
        - $ref: "#/components/schemas/JobAccepted"
        - type: object
          required: [execution_uuid]
          properties:
            execution_uuid:
              type: string
              description: UUID of the created backup execution (traced in the plan's history).
      description: Response of a Backup Now — tracking job + created execution.

    WebhookDeployAccepted:
      type: object
      description: Result of the deploy webhook — one deployment per targeted resource.
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeployResult"

    WebhookDeployResult:
      type: object
      required: [resource_uuid, deployment_uuid]
      properties:
        resource_uuid:
          type: string
          description: UUID of the targeted resource.
        deployment_uuid:
          type: string
          description: UUID of the deployment queued for this resource.
        message:
          type: string
          nullable: true
          description: Optional clarification (e.g. deployment coalesced with a pending deployment).

    # --- System --------------------------------------------------------------
    Event:
      type: object
      description: >-
        Domain event published by the transactional outbox (§24.2) —
        references objects by public UUID, never contains a secret
        value (INV-003).
      required: [sequence, event_type, occurred_at]
      properties:
        sequence:
          type: integer
          description: Monotonic sequence — serves as `Last-Event-ID` for resume.
        event_type:
          type: string
          description: Versioned type of the event (e.g. deployment.succeeded.v1).
        occurred_at:
          type: string
          format: date-time
        resource_uuid:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
          description: Event metadata (UUIDs, statuses) — never a secret.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok` if the control plane responds.

    VersionInfo:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: Semantic version of the AkerDock instance.
          example: 1.0.0
        commit:
          type: string
          nullable: true
          description: SHA of the build commit.
        built_at:
          type: string
          nullable: true
          format: date-time
          description: Build date (UTC).

    ApiState:
      type: object
      required: [api_enabled]
      properties:
        api_enabled:
          type: boolean
          description: Enablement state of the public API.

    EncryptionStatus:
      type: object
      description: >-
        State of envelope encryption at rest (ADR-003, §23.2): active
        key version and distribution of encrypted rows per key version
        and per column. Never contains key material.
      required: [active_key_version, key_versions]
      properties:
        active_key_version:
          type: integer
          description: Key version used for any new encryption.
          example: 2
        key_versions:
          type: array
          description: >-
            One entry per key version still referenced in the database. A
            rotation has converged when only the active version remains
            referenced.
          items:
            $ref: "#/components/schemas/EncryptionKeyVersion"
          readOnly: true
        rotation_job_uuid:
          type: string
          nullable: true
          description: UUID of the re-encryption job in progress, if any (`null` otherwise).
          readOnly: true

    EncryptionKeyVersion:
      type: object
      description: Usage of a master key version in the encrypted columns.
      required: [key_version, total_rows]
      properties:
        key_version:
          type: integer
          description: Key version (4-byte prefix of the `*_enc` columns).
        total_rows:
          type: integer
          description: Total number of rows encrypted with this version, all columns combined.
        columns:
          type: array
          description: Breakdown per encrypted column (inventory §12 of the data dictionary).
          items:
            $ref: "#/components/schemas/EncryptionColumnCount"
          readOnly: true

    EncryptionColumnCount:
      type: object
      description: Row count of an encrypted column for a key version.
      required: [table, column, rows]
      properties:
        table:
          type: string
          example: private_keys
        column:
          type: string
          example: private_key_enc
        rows:
          type: integer

    # --- Teams ---------------------------------------------------------------
    Team:
      type: object
      description: Team — isolation boundary of servers, resources, keys and tokens (§2, §23.1).
      required: [uuid, name, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        personal:
          type: boolean
          description: Personal team created automatically with the user.
          default: false
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    TeamCreate:
      type: object
      description: Creation of a team (instance root only).
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    TeamUpdate:
      type: object
      description: Partial update of a team.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    TeamMember:
      type: object
      description: A user's membership in a team.
      required: [user_uuid, email, role, joined_at]
      properties:
        user_uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, member, reviewer, custom]
          description: >-
            Role in the team (ADR-038, §10.1): `admin` (full control of the
            team, ex-`owner` merged), `member` (manages resources), `reviewer`
            (only sees PR previews), or `custom` (composed role, see
            `custom_role_uuid`).
        custom_role_uuid:
          type: string
          nullable: true
          description: UUID of the custom role when `role` is `custom`, otherwise absent.
        custom_role_name:
          type: string
          nullable: true
          description: Name of the custom role when `role` is `custom`, otherwise absent.
        joined_at:
          type: string
          format: date-time

    InvitationCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email of the invited person.
        role:
          type: string
          enum: [admin, member, reviewer, custom]
          default: member
          description: >-
            Role granted at acceptance (ADR-038). `custom` requires
            `custom_role_uuid`.
        custom_role_uuid:
          type: string
          nullable: true
          description: UUID of one of the team's custom roles, required when `role` is `custom`.
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
          description: Validity duration of the invitation in hours (default 7 days).

    Invitation:
      type: object
      description: Invitation of a member into a team.
      required: [uuid, email, role, status, created_at, expires_at]
      properties:
        uuid:
          type: string
          readOnly: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member, reviewer, custom]
        custom_role_uuid:
          type: string
          nullable: true
          description: UUID of the custom role when `role` is `custom`.
          readOnly: true
        custom_role_name:
          type: string
          nullable: true
          description: Name of the custom role when `role` is `custom`.
          readOnly: true
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
          readOnly: true
        invite_url:
          type: string
          nullable: true
          description: >-
            Acceptance link — returned only at creation and
            only if the instance's transactional email is not
            configured (manual delivery).
          readOnly: true
        invited_by:
          type: string
          nullable: true
          description: UUID of the user or token that originated the invitation.
          readOnly: true
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true

    ScimToken:
      type: object
      required: [uuid, name, created_at]
      properties:
        uuid:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    ScimTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Readable name of the token (e.g. okta-prod).

    ScimTokenCreated:
      type: object
      required: [uuid, name, token, scim_base_url, created_at]
      properties:
        uuid:
          type: string
        name:
          type: string
        token:
          type: string
          description: Clear value — shown only once (§23.2).
        scim_base_url:
          type: string
          description: SCIM base URL to configure in the IdP (…/scim/v2).
        created_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      description: >-
        An entry of the append-only audit log (§23.4). Sensitive values
        are never present: a modified field appears in `diff` as
        `{changed:true, redacted:true}` (INV-003).
      required: [uuid, action, result, occurred_at]
      properties:
        uuid:
          type: string
        occurred_at:
          type: string
          format: date-time
        actor_kind:
          type: string
          enum: [user, token, system]
        actor_uuid:
          type: string
          nullable: true
          description: UUID of the acting user or token (absent for a system action or a failed login).
        actor_display:
          type: string
          nullable: true
          description: Readable identifier of the actor (e.g. the email attempted at a failed login).
        action:
          type: string
          description: Action verb (e.g. `auth.login`, `secret.reveal`, `role.update`).
        target_kind:
          type: string
          nullable: true
        target_uuid:
          type: string
          nullable: true
        target_name:
          type: string
          nullable: true
          description: >-
            Display name of the target AT THE TIME OF THE ACTION, captured when
            the entry was written and never refreshed — a renamed resource keeps
            the name it had, and a deleted one keeps a name at all. Absent for
            entries written before this field existed, and for targets that have
            no name.
        result:
          type: string
          enum: [success, failure, denied]
        ip:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        diff:
          type: object
          nullable: true
          additionalProperties: true
          description: What changed, already redacted for sensitive fields.

    CustomRole:
      type: object
      description: >-
        A team's custom role (ADR-038): a named set of granular
        permissions, composed in the UI. Can never contain an instance
        permission (`instance:*`).
      required: [uuid, name, permissions, created_at, updated_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
          description: >-
            Granular `domain:action` permissions, closed under their
            prerequisites (missing dependencies are added automatically).
        member_count:
          type: integer
          readOnly: true
          description: Number of members carrying this role.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    CustomRoleCreate:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 255
          description: Name of the role (unique within the team).
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            Granular permissions granted. Rejected if unknown, if
            instance-level (`instance:*`), or outside the composer's
            permissions (anti-escalation). Missing prerequisites are added.

    CustomRoleUpdate:
      type: object
      description: Partial update of a custom role.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        permissions:
          type: array
          items:
            type: string
          minItems: 1

    MemberRoleUpdate:
      type: object
      description: >-
        Changes a member's role (ADR-038). Either a system role (`role`), or
        a custom role (`role: custom` + `custom_role_uuid`).
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, reviewer, custom]
        custom_role_uuid:
          type: string
          nullable: true
          description: Required (and only read) when `role` is `custom`.

    PermissionCatalogEntry:
      type: object
      description: >-
        A granular permission from the catalog (ADR-038), with its prerequisites —
        everything needed to build the custom role composer on the UI side.
      required: [permission, socle, prerequisites]
      properties:
        permission:
          type: string
          description: '`domain:action` identifier.'
        socle:
          type: string
          enum: [read, "read:sensitive", write, deploy, root]
          description: Coarse base permission (§10.3).
        instance_scoped:
          type: boolean
          description: True if the permission is instance-only (never assignable to a custom role).
        prerequisites:
          type: array
          items:
            type: string
          description: Permissions implied automatically (dependency closure).

    ApiTokenPermission:
      type: string
      enum: [read, "read:sensitive", write, deploy, root]
      description: Granular permission of an API token (§10.3).

    ApiTokenCreate:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          maxLength: 255
          description: Readable name of the token (e.g. ci-github-actions).
        permissions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiTokenPermission"
          description: >-
            Permissions granted. A token cannot grant a
            permission it does not hold itself.
        expires_at:
          type: string
          nullable: true
          format: date-time
          description: Optional expiration (UTC). `null` = no expiration.
        ip_allowlist:
          type: array
          items:
            type: string
          description: List of allowed CIDRs (e.g. 203.0.113.0/24). Empty = all IPs.
          default: []

    ApiToken:
      type: object
      description: >-
        Metadata of an API token. The token value is hashed (SHA-256)
        server-side and never appears here — only `token_prefix` allows
        identification.
      required: [uuid, name, permissions, token_prefix, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/ApiTokenPermission"
        token_prefix:
          type: string
          description: Identification prefix of the token (first characters).
          readOnly: true
        ip_allowlist:
          type: array
          items:
            type: string
          default: []
        expires_at:
          type: string
          nullable: true
          format: date-time
        last_used_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        owner_email:
          type: string
          nullable: true
          readOnly: true
          description: >-
            The human who minted the token (`api_tokens.created_by`), returned
            on the `team` scope so an administrator can see whose a token is.
            Absent on the `mine` scope, where the answer is "yours".

    ApiTokenCreated:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: >-
                Clear token value — present ONLY in this creation
                response, never retrievable afterwards (§10.3).
      description: API token at creation — includes the clear value, once only.

    # --- Projects / Environments --------------------------------------------
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    ProjectUpdate:
      type: object
      description: Partial update — only the provided fields are modified.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    Project:
      type: object
      description: Project — logical grouping of environments (§2).
      required: [uuid, name, team_uuid, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        team_uuid:
          type: string
          readOnly: true
        environments:
          type: array
          description: The project's environments (summary, not paginated — bounded in practice).
          items:
            $ref: "#/components/schemas/Environment"
          readOnly: true
        version:
          type: integer
          description: Optimistic version (reflected in the ETag).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    EnvironmentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          description: Unique name within the project (e.g. production, staging).
        description:
          type: string
          nullable: true

    EnvironmentUpdate:
      type: object
      description: Partial update.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true

    Environment:
      type: object
      description: A project's environment — contains the resources (§2).
      required: [uuid, name, project_uuid, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
          readOnly: true
        resource_count:
          type: integer
          description: Number of contained resources (0 required for deletion).
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Private keys --------------------------------------------------------
    WebhookEndpoint:
      type: object
      required: [uuid, provider, url, enabled]
      properties:
        uuid:
          type: string
        provider:
          type: string
          enum: [github, gitlab, gitea]
        url:
          type: string
          description: Receiving URL to declare at the provider.
        secret:
          type: string
          nullable: true
          description: >-
            HMAC secret — returned **only** at creation, never read back
            afterwards (INV-003).
        enabled:
          type: boolean

    WebhookEndpointCreate:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [github, gitlab, gitea]

    TerminalSession:
      type: object
      required:
        [
          uuid,
          target_kind,
          target_name,
          websocket_path,
          token,
          token_expires_at,
          idle_timeout_seconds,
          max_duration_seconds,
        ]
      properties:
        uuid:
          type: string
        target_kind:
          type: string
          enum: [server, container]
          description: Server (SSH shell) or container (`docker exec`) — §5.7.
        target_name:
          type: string
          description: >-
            Label of the target, snapshotted at open time (survives
            deletion of the target).
        websocket_path:
          type: string
          description: >-
            Path of the WebSocket to open on the **same origin** as the API
            (`ws://` or `wss://` depending on the page's scheme), with the token
            in the query string (`?token=…`). The stream protocol is outside
            OpenAPI (§27.24).
        token:
          type: string
          description: >-
            **Single-use** attach token, returned only at
            creation, never read back (§23.2, §24.4) — only its hash is stored.
        token_expires_at:
          type: string
          format: date-time
          description: >-
            Expiration of the (short-lived) attach token — not of the session:
            once the WebSocket is open, the idle timeout and the maximum
            duration bound the session.
        idle_timeout_seconds:
          type: integer
          description: Inactivity (no keystrokes) beyond which the session is closed.
        max_duration_seconds:
          type: integer
          description: Maximum duration of a session, regardless of activity.

    PortForwardCreate:
      type: object
      required: [port]
      description: >-
        Request to open a TCP tunnel to a container of the resource
        (ADR-032). The target (container, port) is **frozen and authorized at
        creation**; the tunnel itself goes through the WebSocket `websocket_path`
        (outside OpenAPI). `component` designates the service for a compose stack.
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Internal port of the target container.

    PortForwardSession:
      type: object
      required:
        [uuid, port, websocket_path, token, token_expires_at]
      description: >-
        TCP tunnel session (ADR-032). Same token contract as the terminal
        (§24.4): **single-use** attach token, returned once,
        only its hash is stored (§23.2). Scoped to the team, audited on
        open and close, idle timeout / maximum duration / heartbeat
        / guaranteed teardown. `409` if the team reaches its cap
        (`port_forward_limit`).
      properties:
        uuid:
          type: string
        port:
          type: integer
          description: Internal port of the target container, frozen at creation.
        websocket_path:
          type: string
          description: >-
            Path of the WebSocket to open on the **same origin** as the API,
            token in the query string (`?token=…`). Subprotocol
            `akerdock-tunnel-v1`, outside OpenAPI (§27.24, ADR-032).
        token:
          type: string
          description: >-
            Single-use attach token, returned only here, never read
            back — only its hash is stored (§23.2, §24.4).
        token_expires_at:
          type: string
          format: date-time
          description: (Short-lived) expiration of the attach token, not of the session.
        authorized_until:
          type: string
          format: date-time
          description: >-
            Instant the session is actually cut (ADR-045 §5): the grant's expiry
            on a `sensitive` external endpoint, the ADR-032 maximum duration
            otherwise. The CLI announces it when the listener comes up and warns
            before it lands, so a deadline never arrives unannounced.

    PortForwardSessionInfo:
      type: object
      required: [uuid, target_kind, target_name, target_port, active, created_at]
      description: >-
        A tunnel session as an operator sees it — who opened it, onto what, from
        where, and until when. Deliberately NOT the mint response: no token is
        readable back, so this schema carries none.
      properties:
        uuid:
          type: string
        target_kind:
          type: string
          enum: [application, database, service, preview, external_endpoint, unknown]
          description: >-
            What the tunnel points at. `unknown` is a session whose target was
            deleted after it opened — the row outlives the resource so the audit
            trail stays complete.
        target_name:
          type: string
          description: Human label frozen at mint time (resource name, or endpoint name).
        target_component:
          type: string
          description: Compose service, when the target is one component of a stack.
        target_port:
          type: integer
        external_endpoint_uuid:
          type: string
          description: Set when the target is a declared external endpoint (ADR-045).
        user_email:
          type: string
          description: >-
            The human who opened it. Absent for a session opened with an API
            token, which has no user — which is also why it can hold no grant.
        client_ip:
          type: string
          description: Address the mint was requested from.
        active:
          type: boolean
          description: >-
            Still open: not ended, and either attached or with an attach token
            that has not expired yet.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          description: When the WebSocket was attached — absent while the token is unredeemed.
        ended_at:
          type: string
          format: date-time
        end_reason:
          type: string
          enum: [user_close, idle_timeout, max_duration, disconnect, revoked, grant_expired]
          description: >-
            Why it closed. `grant_expired` is an ADR-045 session that reached
            its authorization's deadline, distinct from the ADR-032 ceiling.
        authorized_until:
          type: string
          format: date-time
          description: >-
            Instant the session is cut (ADR-045 §5) — the grant's expiry on a
            `sensitive` endpoint.

    ExternalEndpoint:
      type: object
      required:
        [uuid, name, host, port, server_uuid, criticality, max_grant_minutes, created_at]
      description: >-
        A declared bastion target (ADR-045): one exact destination, reached from
        one egress server. There is no CIDR, port range or wildcard host — a
        network is deliberately not addressable as a unit, which is what keeps
        this from becoming a scanner.
      properties:
        uuid:
          type: string
        name:
          type: string
          maxLength: 63
        description:
          type: string
          nullable: true
        host:
          type: string
          description: Hostname or IP, exact — no scheme, path, space or comma.
        port:
          type: integer
          minimum: 1
          maximum: 65535
        server_uuid:
          type: string
          description: >-
            Egress server the tunnel is dialed from. An endpoint only means
            something relative to the vantage point that reaches it.
        project_uuid:
          type: string
          nullable: true
          description: Optional RBAC scope (ADR-038).
        environment_uuid:
          type: string
          nullable: true
          description: Optional RBAC scope (ADR-038).
        criticality:
          type: string
          enum: [standard, sensitive]
          description: >-
            `standard` behaves exactly like an ADR-032 tunnel. `sensitive` (the
            default) requires an access grant obtained in the dashboard behind a
            fresh second factor. A single dimension rather than a set of
            independent switches: a control that can be turned off individually
            is one an operator finds was off on the day it mattered.
        max_grant_minutes:
          type: integer
          minimum: 1
          maximum: 480
          description: >-
            Longest window a single request may buy on this endpoint (default
            240). Renewal is unbounded in total but always costs a fresh factor.
        active_grant:
          $ref: "#/components/schemas/ExternalEndpointGrant"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExternalEndpointCreate:
      type: object
      required: [name, host, port, server_uuid]
      properties:
        name:
          type: string
          maxLength: 63
        description:
          type: string
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        server_uuid:
          type: string
        project_uuid:
          type: string
        environment_uuid:
          type: string
        criticality:
          type: string
          enum: [standard, sensitive]
          default: sensitive
        max_grant_minutes:
          type: integer
          minimum: 1
          maximum: 480
          default: 240

    ExternalEndpointGrant:
      type: object
      required: [uuid, reason, factor, requested_at, expires_at]
      description: >-
        A bounded, reasoned, re-authenticated window during which its holder may
        mint tunnels to the endpoint. The grant IS the session deadline: a
        tunnel never outlives the authorization that opened it.
      properties:
        uuid:
          type: string
        user_email:
          type: string
        reason:
          type: string
          description: >-
            Why access was needed. Mandatory, and the point of the whole record:
            "who was present" is worth less to an auditor than "who asked, for
            what, for how long".
        factor:
          type: string
          enum: [passkey, totp]
          description: Which second factor was actually consumed. Chosen by the server.
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        renewed:
          type: boolean
          description: True when this window was extended rather than opened fresh.

    ExternalEndpointGrantCreate:
      type: object
      required: [reason, duration_minutes]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 480
          description: Clamped to the endpoint's `max_grant_minutes`.

    AccessRequestRequired:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            request_url:
              type: string
              description: Dashboard page where the grant is requested.
      description: >-
        `403` with code `access_request_required`: the endpoint is `sensitive`
        and the caller holds no live grant. The house error shape plus the one
        thing the client needs to act — the CLI opens `request_url`, polls until
        the grant exists, then replays the mint (same choreography as `akerdock
        login`, ADR-031). Telling someone "no" without telling them where to go
        is how a control becomes something people route around.

    IngressEndpoint:
      type: object
      required: [uuid, name, fqdn, url, server_uuid, access, occupied, created_at]
      description: >-
        A declared public URL relayed to a developer's machine (ADR-060). The
        FQDN is stable and registered in the routing namespace at declaration;
        the router and certificate are pre-provisioned, so attaching later is
        instant. noindex and forced HTTPS are unconditional and therefore not
        fields.
      properties:
        uuid:
          type: string
        name:
          type: string
          maxLength: 63
        description:
          type: string
          nullable: true
        fqdn:
          type: string
          description: Exact hostname, frozen at declaration — never random.
        url:
          type: string
          description: "`https://<fqdn>` — what a visitor opens."
        server_uuid:
          type: string
          description: >-
            Ingress server: the vantage point whose proxy terminates the
            hostname and whose agent relays to the laptop.
        access:
          type: string
          enum: [sso, basic_auth, none]
          description: >-
            The ADR-042 wall vocabulary. `sso` (the default) admits the team's
            authenticated users and nobody else; `none` is the conscious
            opt-out for third-party webhooks — an admin-level, audited act.
        occupied:
          type: boolean
          description: A live attach session exists (one laptop per endpoint).
        occupant_email:
          type: string
          description: Who holds the live attach, when `occupied`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IngressEndpointCreate:
      type: object
      required: [name, fqdn, server_uuid]
      properties:
        name:
          type: string
          maxLength: 63
        description:
          type: string
        fqdn:
          type: string
          description: >-
            Exact hostname — typically under the server's wildcard domain, but
            any FQDN the operator routes to the server is acceptable. Immutable
            after declaration.
        server_uuid:
          type: string
          description: Immutable after declaration.
        access:
          type: string
          enum: [sso, basic_auth, none]
          default: sso
        basic_auth_password:
          type: string
          description: >-
            Required when `access` is `basic_auth`; hashed at rest, never
            readable back.

    IngressEndpointUpdate:
      type: object
      required: [name]
      description: >-
        What may change after declaration: the label, the description and the
        access regime. The FQDN and the server may not — both are baked into
        the certificate and the deposited router.
      properties:
        name:
          type: string
          maxLength: 63
        description:
          type: string
        access:
          type: string
          enum: [sso, basic_auth, none]
        basic_auth_password:
          type: string

    IngressTunnelSession:
      type: object
      required: [uuid, fqdn, url, attach_url, token, token_expires_at]
      description: >-
        An ingress attach session (ADR-060 §3). Same token contract as every
        tunnel: **single-use**, returned once, hash stored — but redeemed
        **agent-side**, at `attach_url` on the endpoint's own FQDN, never at
        the control plane. Idle timeout 30 min (visitor silence), ceiling
        12 h, both enforced by the agent and reported with a reason.
      properties:
        uuid:
          type: string
        fqdn:
          type: string
        url:
          type: string
          description: "`https://<fqdn>` — the public URL, to print at attach."
        attach_url:
          type: string
          description: >-
            Full `wss://` URL to dial, on the endpoint's own FQDN (reserved
            path, ADR-060 §2), token in the query string. Subprotocol
            `akerdock-ingress-v1`, outside OpenAPI. This is the one sanctioned
            non-manager dial of the CLI transport invariant (ADR-060 §4): the
            hostname was named by the manager inside this authenticated
            response.
        token:
          type: string
          description: Single-use attach token (`akdi_…`), returned only here.
        token_expires_at:
          type: string
          format: date-time
          description: Expiration of the attach token, not of the session.

    IngressTunnelSessionInfo:
      type: object
      required: [uuid, active, created_at]
      description: >-
        An attach session as an operator sees it. Liveness is agent-reported
        (the socket lives on the ingress server), so `active` reflects the
        last report, not a control-plane connection.
      properties:
        uuid:
          type: string
        endpoint_uuid:
          type: string
          description: Absent when the endpoint was deleted after the session.
        endpoint_name:
          type: string
        fqdn:
          type: string
        user_email:
          type: string
        client_ip:
          type: string
          description: Address the mint was requested from.
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          description: When the laptop attached — absent while the token is unredeemed.
        last_seen_at:
          type: string
          format: date-time
          description: Last agent report for this session.
        ended_at:
          type: string
          format: date-time
        end_reason:
          type: string
          enum: [user_close, idle_timeout, max_duration, disconnect, revoked]
          description: >-
            Why it closed. `revoked` covers the operator cut and the endpoint's
            deletion; policy reasons are terminal for the CLI (no re-dial),
            `disconnect` is the one it recovers from.

    AdoptionScanAccepted:
      allOf:
        - $ref: "#/components/schemas/JobAccepted"
        - type: object
          required: [adoption_scan_uuid]
          properties:
            adoption_scan_uuid:
              type: string
              description: UUID of the created scan, to read once the job is finished.
      description: Response of an adoption scan — tracking job + created scan.

    AdoptionScan:
      type: object
      description: >-
        An adoption scan (§20.7, ADR-013): inventory of a server's unmanaged
        Docker resources and proposed mapping to the AkerDock model.
      required: [uuid, server_uuid, status, created_at]
      properties:
        uuid:
          type: string
        server_uuid:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        error:
          type: string
          nullable: true
          description: Cause of the failure when `status = failed`.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        candidates:
          type: array
          description: >-
            Present when `status = completed`. Contains ALL candidates,
            adoptable or not — a non-adoptable candidate carries its reasons
            (`reasons`), never a silent omission.
          items:
            $ref: "#/components/schemas/AdoptionCandidate"

    AdoptionCandidate:
      type: object
      description: >-
        A standalone container or an unmanaged compose stack, with the
        proposed mapping (§20.7). `modifications` lists what adoption and then
        the first normalization will change — adoption itself never restarts
        the workload.
      required: [id, kind, proposed_name, adoptable, containers]
      properties:
        id:
          type: string
          description: >-
            Stable identifier of the candidate within this scan: short ID of
            the container, or `compose:<project>` for a stack.
        kind:
          type: string
          enum: [container, compose_stack]
        proposed_name:
          type: string
          description: Proposed resource name (editable at adoption).
        proposed_resource_type:
          type: string
          enum: [application, service]
          nullable: true
          description: application (standalone container) or service (compose stack).
        compose_project:
          type: string
          nullable: true
          description: Name of the compose project (`com.docker.compose.project`).
        adoptable:
          type: boolean
        reasons:
          type: array
          description: Reasons for non-adoptability when `adoptable = false`.
          items:
            type: string
        modifications:
          type: array
          description: >-
            What will be modified — at adoption (nothing on the workload) and
            at the first normalization (labels, name, network).
          items:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/AdoptionCandidateContainer"

    AdoptionCandidateContainer:
      type: object
      required: [container_id, container_name, image, state]
      properties:
        container_id:
          type: string
          description: Short ID of the container.
        container_name:
          type: string
        image:
          type: string
        state:
          type: string
          description: Observed Docker state (`running`, `exited`, …).
        compose_service:
          type: string
          nullable: true
          description: Name of the compose service, for a stack member.
        labels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Docker labels of the container (outside the `akerdock.*` namespace)
            — this is what allows a migration tool to recognize the workloads
            of a given platform (e.g. `coolify.*`) without knowing anything
            about its internal schema (ADR-023).
        env_keys:
          type: array
          description: >-
            NAMES of the environment variables — never the values
            (INV-003); they are captured and encrypted at adoption.
          items:
            type: string
        ports:
          type: array
          items:
            type: object
            required: [container_port, protocol]
            properties:
              container_port:
                type: integer
              host_port:
                type: integer
                nullable: true
              protocol:
                type: string
        mounts:
          type: array
          items:
            type: object
            required: [kind, source, destination]
            properties:
              kind:
                type: string
                description: '`volume` or `bind`.'
              source:
                type: string
                description: Volume name or host path.
              destination:
                type: string
        networks:
          type: array
          items:
            type: string
        domains:
          type: array
          description: FQDNs detected in the reverse proxy labels (Traefik).
          items:
            type: string

    SharedVariable:
      type: object
      description: >-
        Hierarchical shared variable (§5.4, §3.1). The value is only
        rendered with `read:sensitive` (INV-003).
      required: [uuid, scope, key, is_secret, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        scope:
          type: string
          enum: [team, project, environment, server]
        key:
          type: string
        value:
          type: string
          nullable: true
          description: NULL without `read:sensitive` (`is_redacted` is then true).
        is_redacted:
          type: boolean
        is_secret:
          type: boolean
        project_uuid:
          type: string
          nullable: true
        environment_uuid:
          type: string
          nullable: true
        server_uuid:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    SharedVariableCreate:
      type: object
      required: [scope, key, value]
      properties:
        scope:
          type: string
          enum: [team, project, environment, server]
        key:
          type: string
          description: Grammar `[A-Za-z_][A-Za-z0-9_]*` (INV-012).
        value:
          type: string
        is_secret:
          type: boolean
          default: false
        project_uuid:
          type: string
          description: Required for the `project` scope.
        environment_uuid:
          type: string
          description: Required for the `environment` scope.
        server_uuid:
          type: string
          description: Required for the `server` scope.

    SharedVariableUpdate:
      type: object
      properties:
        value:
          type: string
        is_secret:
          type: boolean

    UptimeCheck:
      type: object
      description: >-
        An uptime check (ADR-017): HTTP/TCP probe executed from the
        control plane, threshold-based verdict (structural anti-flapping).
      required: [uuid, name, kind, target, interval_seconds, timeout_seconds, failure_threshold, success_threshold, enabled, status, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        resource_uuid:
          type: string
          nullable: true
          description: Linked resource ("per resource" history, ADR-017).
        name:
          type: string
        kind:
          type: string
          enum: [http, tcp]
        target:
          type: string
          description: >-
            Public HTTP(S) URL or public `host:port`; non-public destinations
            are blocked on the resolved IP for every connection and redirect.
        interval_seconds:
          type: integer
          minimum: 10
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
        failure_threshold:
          type: integer
          minimum: 1
        success_threshold:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        status:
          type: string
          enum: [unknown, up, down]
          readOnly: true
        status_since:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        last_checked_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        last_latency_ms:
          type: integer
          nullable: true
          readOnly: true
        last_error:
          type: string
          nullable: true
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    UptimeCheckCreate:
      type: object
      required: [name, kind, target]
      properties:
        name:
          type: string
          maxLength: 255
        kind:
          type: string
          enum: [http, tcp]
        target:
          type: string
          description: >-
            Public HTTP(S) URL or public `host:port`; non-public destinations
            are blocked on the resolved IP for every connection and redirect.
        resource_uuid:
          type: string
          nullable: true
        interval_seconds:
          type: integer
          minimum: 10
          default: 60
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
        failure_threshold:
          type: integer
          minimum: 1
          default: 3
        success_threshold:
          type: integer
          minimum: 1
          default: 2
        enabled:
          type: boolean
          default: true

    UptimeCheckUpdate:
      type: object
      description: Partial update — the current verdict is never editable.
      properties:
        name:
          type: string
          maxLength: 255
        target:
          type: string
          description: >-
            Public HTTP(S) URL or public `host:port`; non-public destinations
            are blocked on the resolved IP for every connection and redirect.
        interval_seconds:
          type: integer
          minimum: 10
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
        failure_threshold:
          type: integer
          minimum: 1
        success_threshold:
          type: integer
          minimum: 1
        enabled:
          type: boolean

    UptimeResult:
      type: object
      description: A raw probe result (bounded retention).
      required: [ok, checked_at]
      properties:
        ok:
          type: boolean
        checked_at:
          type: string
          format: date-time
        latency_ms:
          type: integer
          nullable: true
        status_code:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true

    AdoptRequest:
      type: object
      description: Selection of a scan's candidates to adopt (§20.7).
      required: [environment_uuid, items]
      properties:
        environment_uuid:
          type: string
          description: Target environment of the created resources.
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [candidate_id]
            properties:
              candidate_id:
                type: string
                description: '`id` of the candidate in the scan.'
              name:
                type: string
                description: Resource name, defaulting to `proposed_name`.

    NotificationChannel:
      type: object
      required: [uuid, kind, name, enabled, created_at, version]
      properties:
        uuid:
          type: string
        kind:
          type: string
          enum: [smtp, resend, discord, telegram, slack, pushover, webhook]
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    OauthProviderConfig:
      type: object
      description: >-
        OAuth/OIDC provider for dashboard login (§10.2, amendment #30).
        The client secret never appears here (INV-003).
      required: [provider, enabled, client_id]
      properties:
        provider:
          type: string
          enum: [github, gitlab, google, azure, bitbucket, oidc]
        enabled:
          type: boolean
        display_name:
          type: string
          nullable: true
          description: Label of the login button (mostly useful for `oidc`, e.g. "Okta").
        client_id:
          type: string
        issuer_url:
          type: string
          nullable: true
          description: OpenID Connect discovery base (`oidc` and `azure` only).
        updated_at:
          type: string
          format: date-time
          readOnly: true
    OauthProviderSet:
      type: object
      description: >-
        Full replacement of the provider configuration. The secret
        is required at every write: it is encrypted at rest and never
        read back by the API, so there is nothing to silently "keep".
      required: [client_id, client_secret]
      properties:
        enabled:
          type: boolean
          default: true
        display_name:
          type: string
          maxLength: 64
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
        issuer_url:
          type: string
          description: >-
            Required for `oidc` and `azure` (e.g.
            `https://login.microsoftonline.com/{tenant}/v2.0`), rejected for
            providers with fixed endpoints.
    InstanceIdentity:
      type: object
      required: [timezone]
      properties:
        fqdn:
          type: string
          nullable: true
          description: >-
            Bare hostname, without scheme or path (e.g. `deploy.example.com`).
            `null`: instance without FQDN, non-`Secure` cookies, plain HTTP
            tolerated.
        acme_email:
          type: string
          nullable: true
          description: Let's Encrypt contact (§4.3). Without it, no certificate is issued.
        timezone:
          type: string
          readOnly: true
        api_enabled:
          type: boolean
          readOnly: true
          description: >-
            Lock state of the public API (§10.3). Dashboard sessions
            are exempt; toggle via POST /system/api/enable|disable.
        registration_enabled:
          type: boolean
          readOnly: true
          description: >-
            Self-service signup (§10.2). Closed by default: nobody
            creates an account on their own. A pending invitation nevertheless
            allows account creation at the first SSO login, regardless of this
            flag.
        mcp_dcr_enabled:
          type: boolean
          readOnly: true
          description: >-
            Whether the MCP server accepts dynamic client registration
            (ADR-044). Off by default: a client identifies itself with a
            Client ID Metadata Document (an https `client_id` serving its own
            metadata), an identity bound to a domain it controls. Enable this
            only for a client that does not implement CIMD yet.
        mcp_enabled:
          type: boolean
          readOnly: true
          description: >-
            Whether the built-in MCP server is exposed on `/mcp` (ADR-043,
            §12). Off by default: the whole surface — endpoint, OAuth
            metadata and endpoints — answers 404 until an instance root
            enables it. The tools are read-only and scoped to one team.
        mfa_required:
          type: boolean
          readOnly: true
          description: >-
            When true, two-factor authentication is mandatory: a
            user without an MFA factor is forced to enroll one before
            being able to use the instance (§10.2). An MFA factor is a
            confirmed TOTP OR a passkey (user verification required, hence
            multi-factor on its own). Delegated logins (OIDC/SSO)
            are not subject to it: the identity provider carries the second
            factor.
        password_login_disabled:
          type: boolean
          readOnly: true
          description: >-
            Mandatory SSO (§10.2): when true, password login is
            refused (except for the instance administrator) — only OIDC
            providers authenticate.
        image_retention_count:
          type: integer
          minimum: 1
          readOnly: true
          description: >-
            Number of deployment images kept locally per application
            (and per preview) for rollback (ADR-006, §29.4). Beyond that, the
            oldest ones are reclaimed after a successful deployment; the image
            in service is always protected. Default 5.
    InstanceIdentityUpdate:
      type: object
      properties:
        fqdn:
          type: string
          nullable: true
          description: >-
            Bare hostname (`[a-z0-9.-]`, at least one dot). Empty string or
            `null`: clears the FQDN.
        acme_email:
          type: string
          nullable: true
          description: Empty string or `null` — clears the contact.
        registration_enabled:
          type: boolean
          nullable: true
          description: Opens/closes self-service signup (§10.2). Absent = unchanged.
        mcp_dcr_enabled:
          type: boolean
          nullable: true
          description: Opens/closes MCP dynamic client registration (ADR-044). Absent = unchanged.
        mcp_enabled:
          type: boolean
          nullable: true
          description: Exposes/hides the built-in MCP server on `/mcp` (ADR-043). Absent = unchanged.
        mfa_required:
          type: boolean
          nullable: true
          description: Enables/disables mandatory two-factor authentication (§10.2). Absent = unchanged.
        password_login_disabled:
          type: boolean
          nullable: true
          description: >-
            Enables/disables mandatory SSO mode (§10.2). Refused if no
            OIDC provider is enabled. Absent = unchanged.
        image_retention_count:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Number of deployment images kept per application/preview
            for rollback (ADR-006). Minimum 1. Absent = unchanged.
    TransactionalEmail:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          readOnly: true
        kind:
          type: string
          nullable: true
          enum: [smtp, resend, null]
          readOnly: true
        from:
          type: string
          nullable: true
          readOnly: true
    TransactionalEmailSet:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [smtp, resend]
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        resend:
          $ref: "#/components/schemas/ResendConfig"

    TelemetryConfig:
      type: object
      description: State of the OTLP export (§14.2, ADR-008). Headers are never returned.
      required: [configured]
      properties:
        configured:
          type: boolean
          readOnly: true
        endpoint:
          type: string
          nullable: true
          description: URL of the OTLP collector (the scheme decides TLS).
          readOnly: true
        protocol:
          type: string
          enum: [http, grpc, null]
          nullable: true
          readOnly: true
        traces:
          type: boolean
          readOnly: true
        metrics:
          type: boolean
          readOnly: true
        logs:
          type: boolean
          readOnly: true
        headers_set:
          type: boolean
          description: True if auth headers are recorded (never their value).
          readOnly: true

    TelemetryConfigSet:
      type: object
      description: >-
        Configuration of the OTLP export. An empty `endpoint` disables the
        export. Takes effect at the next restart.
      required: [endpoint]
      properties:
        endpoint:
          type: string
          description: URL of the OTLP collector; empty = export disabled.
        protocol:
          type: string
          enum: [http, grpc]
          default: http
        headers:
          type: object
          additionalProperties:
            type: string
          description: >-
            Auth headers sent with each export (write-only, encrypted at
            rest, never returned). Omitted = keep the existing headers;
            empty object `{}` = clear them.
        traces:
          type: boolean
          default: true
        metrics:
          type: boolean
          default: true
        logs:
          type: boolean
          default: true

    SmtpConfig:
      type: object
      description: SMTP configuration (amendment #18). The password is encrypted at rest and never returned (INV-003).
      required: [host, from, to]
      properties:
        host:
          type: string
        port:
          type: integer
          default: 587
        username:
          type: string
        password:
          type: string
        from:
          type: string
        to:
          type: array
          minItems: 1
          items:
            type: string
        encryption:
          type: string
          enum: [starttls, tls, none]
          default: starttls
          description: >-
            `none` is only acceptable towards a local relay: the password
            and the alert content then cross the network in clear text.
    ResendConfig:
      type: object
      required: [api_key, from, to]
      properties:
        api_key:
          type: string
        from:
          type: string
        to:
          type: array
          minItems: 1
          items:
            type: string
    TelegramConfig:
      type: object
      required: [bot_token, chat_id]
      properties:
        bot_token:
          type: string
        chat_id:
          type: string
        topic_id:
          type: string
          nullable: true
    PushoverConfig:
      type: object
      required: [token, user_key]
      properties:
        token:
          type: string
        user_key:
          type: string
    NotificationChannelCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [smtp, resend, discord, telegram, slack, pushover, webhook]
        name:
          type: string
          maxLength: 255
        url:
          type: string
          description: >-
            Webhook URL (Slack, Discord, custom endpoint) — **required** for
            these three types. Sensitive: encrypted at rest, never returned
            (INV-003).
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        resend:
          $ref: "#/components/schemas/ResendConfig"
        telegram:
          $ref: "#/components/schemas/TelegramConfig"
        pushover:
          $ref: "#/components/schemas/PushoverConfig"
        enabled:
          type: boolean
          default: true

    NotificationChannelUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        smtp:
          $ref: "#/components/schemas/SmtpConfig"
        resend:
          $ref: "#/components/schemas/ResendConfig"
        telegram:
          $ref: "#/components/schemas/TelegramConfig"
        pushover:
          $ref: "#/components/schemas/PushoverConfig"
        url:
          type: string
        enabled:
          type: boolean

    NotificationRule:
      type: object
      required: [uuid, event_type, enabled, min_severity]
      properties:
        uuid:
          type: string
        event_type:
          type: string
          description: "Event type listened to (§24.2): deployment.failed.v1, server.unreachable.v1…"
        enabled:
          type: boolean
        project_uuid:
          type: string
          nullable: true
          description: Project scope — `null` = the whole team.
        environment_uuid:
          type: string
          nullable: true
        min_severity:
          type: string
          enum: [info, warning, critical]
        debounce_seconds:
          type: integer
          description: Anti-flapping aggregation window. A `critical` event always goes through it.
        quiet_hours_start:
          type: string
          nullable: true
          description: "Start of quiet hours (HH:MM). The window may cross midnight (22:00 → 07:00)."
        quiet_hours_end:
          type: string
          nullable: true
        digest_enabled:
          type: boolean
        digest_interval_minutes:
          type: integer
          description: Deferred digest window (ADR-019 §4). A `critical` event never waits for a digest.
        created_at:
          type: string
          format: date-time

    NotificationRuleCreate:
      type: object
      required: [event_type]
      properties:
        event_type:
          type: string
        enabled:
          type: boolean
          default: true
        project_uuid:
          type: string
          nullable: true
        environment_uuid:
          type: string
          nullable: true
        min_severity:
          type: string
          enum: [info, warning, critical]
          default: info
        debounce_seconds:
          type: integer
          default: 0
          minimum: 0
        quiet_hours_start:
          type: string
          nullable: true
        quiet_hours_end:
          type: string
          nullable: true
        digest_enabled:
          type: boolean
          default: false
        digest_interval_minutes:
          type: integer
          default: 60
          minimum: 1

    S3Storage:
      type: object
      required: [uuid, name, endpoint, bucket, is_usable, created_at, version]
      properties:
        uuid:
          type: string
        name:
          type: string
        endpoint:
          type: string
          description: S3 endpoint (https://s3.eu-west-3.amazonaws.com, self-hosted MinIO…).
        region:
          type: string
          nullable: true
        bucket:
          type: string
        path_prefix:
          type: string
          nullable: true
          description: Prefix of the objects stored in the bucket.
        is_usable:
          type: boolean
          description: A write/read/delete round-trip succeeded (§20.5).
        last_check_error:
          type: string
          nullable: true
          description: Reason of the last check failure — never a credential.
        server_side_encryption:
          type: string
          enum: [AES256]
          nullable: true
          description: >-
            Encryption at rest requested for uploads (SSE-S3). `null` = none
            (the store may still apply a default encryption).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    S3StorageCreate:
      type: object
      required: [name, endpoint, bucket, access_key, secret_key]
      properties:
        name:
          type: string
          maxLength: 255
        endpoint:
          type: string
        region:
          type: string
          nullable: true
        bucket:
          type: string
        path_prefix:
          type: string
          nullable: true
        access_key:
          type: string
          description: Sensitive — encrypted at rest, never returned (INV-003).
        secret_key:
          type: string
          description: Sensitive — encrypted at rest, never returned (INV-003).
        server_side_encryption:
          type: string
          enum: [AES256]
          nullable: true
          description: SSE-S3 encryption at rest of uploads (`null`/absent = none).

    S3StorageUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        endpoint:
          type: string
        region:
          type: string
          nullable: true
        bucket:
          type: string
        path_prefix:
          type: string
          nullable: true
        access_key:
          type: string
        secret_key:
          type: string
        server_side_encryption:
          type: string
          enum: [AES256]
          nullable: true
          description: SSE-S3 encryption at rest of uploads (`null`/absent = none).

    PrivateKeyCreate:
      type: object
      required: [name, private_key]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        private_key:
          type: string
          writeOnly: true
          description: >-
            Private SSH key material in PEM/OpenSSH format, without a
            passphrase (§3.1). Stored encrypted (AEAD, §23.2); never
            returned in the creation response.

    PrivateKeyUpdate:
      type: object
      description: Partial update. Providing `private_key` replaces the material (rotation).
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        private_key:
          type: string
          writeOnly: true
          description: New key material (rotation). Referencing servers move back to `pending`.

    PrivateKey:
      type: object
      description: >-
        Private SSH key. The `private_key` field is only populated on a
        single-resource `GET` with the `read:sensitive` permission AND `reveal=true`
        (INV-003); otherwise `null` and `is_redacted=true`.
      required: [uuid, name, fingerprint, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        fingerprint:
          type: string
          description: SHA256 fingerprint of the derived public key.
          readOnly: true
        public_key:
          type: string
          description: Derived public key (usable as a deploy key).
          readOnly: true
        private_key:
          type: string
          nullable: true
          description: Private material — see reveal conditions in the schema description.
        is_redacted:
          type: boolean
          description: True if `private_key` was masked for lack of permission or of `reveal=true`.
          readOnly: true
        in_use:
          type: boolean
          description: True if the key is referenced by at least one server or application.
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Servers -------------------------------------------------------------
    ServerCreate:
      type: object
      required: [name, host, private_key_uuid]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        host:
          type: string
          description: IP address or FQDN reachable over SSH.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        user:
          type: string
          default: root
          description: SSH user (experimental non-root, requires sudo NOPASSWD, §3.1).
        private_key_uuid:
          type: string
          description: Private SSH key of the same team (INV-002).
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            DNS-01 credential used for this server's wildcards
            (amendment #21). Optional even with a `wildcard_domain`
            (amendment): without a credential, the wildcard is only a naming
            template and each assigned host receives its own individual
            certificate via HTTP-01 (proxy-contract §7.2) — hosts publicly
            reachable on the required HTTP port, CA issuance limits
            per host. With a credential, a single wildcard certificate is
            issued via DNS-01.
        is_build_server:
          type: boolean
          default: false
          description: Server dedicated to builds (§3.4) — cannot host applications.
        wildcard_domain:
          type: string
          nullable: true
          description: Wildcard domain of the server (§4.2) — new apps receive uuid.domain.
        proxy_type:
          type: string
          enum: [traefik, none]
          default: traefik
          description: Managed proxy on the server. Traefik only in P0 (§27.9); `none` for a server without inbound traffic.
        proxy_http_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 80
          description: HTTP listen port of the proxy — configurable per server (§27.1).
        proxy_https_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 443
          description: HTTPS listen port of the proxy — configurable per server (§27.1).

    ServerUpdate:
      type: object
      description: >-
        Partial update. Changing `host`, `port`, `user` or
        `private_key_uuid` moves the server back to `pending` (revalidation
        required).
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        user:
          type: string
        private_key_uuid:
          type: string
        ssh_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            DNS-01 credential used for this server's wildcards
            (amendment #21). Optional even with a `wildcard_domain`
            (amendment): without a credential, the wildcard is only a naming
            template and each assigned host receives its own individual
            certificate via HTTP-01 (proxy-contract §7.2) — hosts publicly
            reachable on the required HTTP port, CA issuance limits
            per host. With a credential, a single wildcard certificate is
            issued via DNS-01.
        is_build_server:
          type: boolean
        wildcard_domain:
          type: string
          nullable: true
        proxy_type:
          type: string
          enum: [traefik, none]
        proxy_http_port:
          type: integer
          minimum: 1
          maximum: 65535
        proxy_https_port:
          type: integer
          minimum: 1
          maximum: 65535
        cleanup_enabled:
          type: boolean
          description: >-
            Automated disk cleanup (§3.7) — opt-in. Only targets
            managed and safe objects (unused build cache, managed dangling
            images, orphaned candidates, `/var/lib/akerdock/tmp`); never an
            unmanaged or persistent object (INV-015), never during a target
            or build-server deployment.
        cleanup_cron:
          type: string
          nullable: true
          description: Cron schedule of the cleanup (§3.7); NULL = no cron.
        cleanup_disk_threshold_pct:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: >-
            Disk usage threshold (%) that triggers a cleanup between two
            crons (§3.7); NULL = no threshold-based triggering.
        cleanup_prune_volumes:
          type: boolean
          description: >-
            Opt-in — purge of unused **managed anonymous** volumes only:
            foreign anonymous volumes and named volumes (data, adopted
            volumes §20.7) are NEVER purged (INV-015).
        cleanup_prune_networks:
          type: boolean
          description: >-
            Opt-in — purge of unused **managed** networks (label
            `akerdock.managed`); never an unmanaged network (INV-015).

    Server:
      type: object
      description: SSH target server (§3) — lifecycle states §21.2.
      required: [uuid, name, host, port, user, private_key_uuid, status, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        host:
          type: string
        port:
          type: integer
        user:
          type: string
        private_key_uuid:
          type: string
        ssh_timeout_seconds:
          type: integer
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            DNS-01 credential used for this server's wildcards
            (amendment #21). Optional even with a `wildcard_domain`
            (amendment): without a credential, the wildcard is only a naming
            template and each assigned host receives its own individual
            certificate via HTTP-01 (proxy-contract §7.2) — hosts publicly
            reachable on the required HTTP port, CA issuance limits
            per host. With a credential, a single wildcard certificate is
            issued via DNS-01.
        is_build_server:
          type: boolean
        is_localhost:
          type: boolean
          description: >-
            True for the `localhost` server pre-registered at bootstrap
            (instance-config §6.2) — the machine hosting the instance. Never
            settable through the API.
          readOnly: true
        agent_connected:
          type: boolean
          description: >-
            Whether the server's agent holds a live channel to the control
            plane right now (ADR-041) — presence is the connection. False for
            a silent agent, a pre-enrollment helper, or blocked egress; the
            SSH scans keep working either way (ADR-040).
          readOnly: true
        agent_seen_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Last authenticated observation push from the server's agent
            (ADR-040). NULL before the first push.
          readOnly: true
        wildcard_domain:
          type: string
          nullable: true
        proxy_type:
          type: string
          enum: [traefik, none]
        proxy_http_port:
          type: integer
        proxy_https_port:
          type: integer
        proxy_desired_state:
          type: string
          enum: [running, stopped]
          description: >-
            Operator's intent for the proxy (§3). `stopped` at
            creation: validation neither installs nor starts the proxy until
            the operator has reviewed its settings and requested the first
            start (POST /servers/{server_uuid}/proxy/start, §20.1 step
            5). An explicit `stopped` is not "repaired" by
            reconciliation.
          readOnly: true
        cleanup_enabled:
          type: boolean
          description: Automated disk cleanup (§3.7) — opt-in.
        cleanup_cron:
          type: string
          nullable: true
        cleanup_disk_threshold_pct:
          type: integer
          nullable: true
        cleanup_prune_volumes:
          type: boolean
        cleanup_prune_networks:
          type: boolean
        cleanup_last_run_at:
          type: string
          nullable: true
          format: date-time
          description: Last cleanup triggered (cron, threshold or manual).
          readOnly: true
        proxy_observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        status:
          type: string
          enum: [pending, validating, ready, unreachable, maintenance, deleting]
          description: Server lifecycle (§21.2).
          readOnly: true
        is_reachable:
          type: boolean
          description: Last observation of SSH reachability.
          readOnly: true
        observed_at:
          type: string
          nullable: true
          format: date-time
          description: >-
            Timestamp of the last observation — beyond a threshold, the
            status must be treated as stale/unknown (§19.2).
          readOnly: true
        architecture:
          type: string
          nullable: true
          enum: [amd64, arm64, null]
          description: Architecture detected at validation.
          readOnly: true
        docker_version:
          type: string
          nullable: true
          description: Docker Engine version detected (≥ 24 required, §3.1).
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    ServerResource:
      type: object
      description: Managed resource deployed on a server (logical union, §19.1).
      required: [uuid, type, name, status]
      properties:
        uuid:
          type: string
        type:
          type: string
          enum: [application, database]
          description: Resource type (one-click services will arrive in P2).
        name:
          type: string
        project_uuid:
          type: string
        environment_uuid:
          type: string
        status:
          $ref: "#/components/schemas/ObservedStatus"

    ServerDomain:
      type: object
      description: Domains routed by the server's proxy for a resource.
      required: [resource_uuid, resource_type, domains]
      properties:
        resource_uuid:
          type: string
        resource_type:
          type: string
          enum: [application, database]
        domains:
          type: array
          items:
            type: string
          description: FQDN (with optional https:// scheme, port or path depending on configuration, §4.2).

    # --- Certificates --------------------------------------------------------
    CertificateKind:
      type: string
      enum: [acme_http01, acme_dns01, custom, self_signed]
      description: >-
        Certificate acquisition mode (§4.3): ACME issuance via HTTP-01
        challenge (default) or DNS-01 (mandatory for wildcards),
        custom certificate deposited on the server, or fallback self-signed
        certificate served while awaiting a valid issuance.

    CertificateStatus:
      type: string
      enum: [pending, issued, renewing, failed, expired, revoked]
      description: >-
        Observed status of the certificate. `pending` = issuance in progress
        (the self-signed fallback is served in the meantime); `renewing` =
        renewal in progress; `failed` = issuance or renewal failure
        (see `last_error`).

    Certificate:
      type: object
      description: >-
        TLS certificate served by a server's proxy — **observed reflection**
        (`certificates` table): the actual state lives in `acme.json` and the
        server's files, synchronized after each proxy configuration
        application and by periodic reconciliation (§18.3). Private key
        material never leaves the server and never appears
        in the API.
      required: [uuid, server_uuid, kind, main_domain, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          description: Server whose proxy serves this certificate.
          readOnly: true
        kind:
          $ref: "#/components/schemas/CertificateKind"
        main_domain:
          type: string
          description: Main covered domain (CN / first SAN).
          example: app.example.com
        sans:
          type: array
          items:
            type: string
          description: Alternative covered domains, wildcards included (e.g. `*.preview.example.com`).
          default: []
        issuer:
          type: string
          nullable: true
          description: Observed issuer (e.g. Let's Encrypt R11) — `null` until something is issued.
          readOnly: true
        not_before:
          type: string
          nullable: true
          format: date-time
          description: Observed validity start.
          readOnly: true
        not_after:
          type: string
          nullable: true
          format: date-time
          description: >-
            Observed expiration — key monitoring datum (built-in
            D-30/D-7 alert, `expiring_within_days` filter).
          readOnly: true
        status:
          $ref: "#/components/schemas/CertificateStatus"
        last_error:
          type: string
          nullable: true
          description: >-
            Last issuance/renewal error (failed challenge,
            rate limit, CAA…) — never a secret.
          readOnly: true
        dns_provider:
          type: string
          nullable: true
          description: DNS provider identifier (Lego, e.g. cloudflare) for `acme_dns01`.
        dns_credential_uuid:
          type: string
          nullable: true
          description: >-
            UUID of the referenced DNS-01 credential (`acme_dns01`). The secret
            value is never exposed here (INV-003).
        cert_path:
          type: string
          nullable: true
          description: >-
            Remote path of the certificate on the server (`custom`
            certificates); `null` for ACME (material in `acme.json`).
          readOnly: true
        observed_at:
          type: string
          nullable: true
          format: date-time
          description: >-
            Freshness of the reflection — beyond a threshold, the state must
            be considered "stale", never a guaranteed `issued`.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          description: Last synchronization of the reflection.
          readOnly: true

    # --- Applications --------------------------------------------------------
    ObservedStatus:
      type: string
      enum: [unknown, starting, healthy, unhealthy, exited, missing]
      description: Observed state of a resource (§21.2) — `unknown` if the observation is too old (stale).

    DesiredStatus:
      type: string
      enum: [running, stopped]
      description: Desired state of a resource (§21.2).

    HealthCheckConfig:
      type: object
      description: Application health check (§5.3) — conditions routing and zero-downtime.
      properties:
        enabled:
          type: boolean
          default: false
        path:
          type: string
          default: /
        port:
          type: integer
          nullable: true
          description: Tested port — default = first exposed port.
        method:
          type: string
          default: GET
        interval_seconds:
          type: integer
          minimum: 1
          default: 30
        timeout_seconds:
          type: integer
          minimum: 1
          default: 5
        retries:
          type: integer
          minimum: 1
          default: 3
        start_period_seconds:
          type: integer
          minimum: 0
          default: 10

    ResourceLimits:
      type: object
      description: Resource limits of the container (§5.3).
      properties:
        memory_limit:
          type: string
          nullable: true
          description: Memory limit (e.g. 512m, 2g). `null` = unlimited.
        memory_reservation:
          type: string
          nullable: true
        memory_swap:
          type: string
          nullable: true
        cpu_limit:
          type: string
          nullable: true
          description: CPU limit (e.g. 0.5, 2).
        cpu_shares:
          type: integer
          nullable: true
        cpu_set:
          type: string
          nullable: true
          description: Allowed CPUs (e.g. 0-2).

    ApplicationCreateBase:
      type: object
      description: Fields common to every application creation.
      required: [name, project_uuid, environment_uuid, server_uuid, source_type]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
        environment_uuid:
          type: string
        server_uuid:
          type: string
          description: Target server (must be `ready` and not a build server).
        destination_uuid:
          type: string
          nullable: true
          description: Target Docker network — default = the server's default destination (dedicated management outside v1).
        source_type:
          type: string
          enum: [docker_image, dockerfile, git]
          description: Discriminator of the source type (§5.1).
        domains:
          type: array
          items:
            type: string
          description: >-
            FQDN of the application (§4.2) — supported formats per element:
            plain fqdn, fqdn:port (targeted internal port), fqdn/path
            (path-based routing). Empty = domain generated from the server's
            wildcard if configured.
          default: []
        ports_exposes:
          type: string
          nullable: true
          description: Internal port(s) exposed to the proxy, comma-separated (e.g. "3000"). Optional for an app without inbound traffic.
        noindex:
          type: boolean
          description: >-
            Answers every request on the application's domains with
            `X-Robots-Tag: noindex, nofollow` (proxy-contract §4.7), keeping
            them out of search results. Off by default: a production domain is
            often a site whose ranking is the point. Preview URLs are
            noindexed unconditionally, whatever this says.
        health_check:
          $ref: "#/components/schemas/HealthCheckConfig"
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        pre_deployment_command:
          type: string
          nullable: true
          description: >-
            Command executed in the **existing** container before any
            clone/build (§10). A failure fails the deployment **before
            any mutation** — the existing container is untouched. Skipped if
            there is no running container. MUST be idempotent: it
            may be replayed during a crash recovery.
        post_deployment_command:
          type: string
          nullable: true
          description: >-
            Command executed in the **candidate** once healthy, before the
            switchover (§10). A failure fails the deployment: the candidate
            is deleted and the old container **stays routed** (INV-005), with
            no automatic rollback. MUST be idempotent.

        tags:
          type: array
          items:
            type: string
          description: Free-form tags — usable by the deploy webhook (`?tag=`).
          default: []
        instant_deploy:
          type: boolean
          default: false
          description: Immediately triggers a first deployment after creation.
        use_build_server:
          type: boolean
          default: false
          description: >-
            Build on a dedicated **build server** (§3.4) rather than on the
            production server. Requires `push_registry_credential_uuid`: without
            a registry, the image stays on the build machine and the deployment
            server cannot pull it — building it elsewhere would have been
            pointless (amendment #19). Not applicable for the
            `docker_image` source, which builds nothing.
        push_registry_credential_uuid:
          type: string
          nullable: true
          description: Registry where the built image is pushed, and from which the deployment server pulls it.

    ApplicationCreateDockerImage:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreateBase"
        - type: object
          required: [docker_image]
          properties:
            source_type:
              enum: [docker_image]
            docker_image:
              type: string
              description: Pre-built image, registry included if not Docker Hub (e.g. ghcr.io/acme/app).
            docker_image_tag:
              type: string
              default: latest
              description: Tag of the image. The digest is resolved at deployment (§18.3).
            registry_credential_uuid:
              type: string
              nullable: true
              description: >-
                Credential of a private registry (amendment #17). The
                password reaches the server only as a per-request auth
                header on the typed agent channel (ADR-055) — no `docker
                login` ever runs, so the token never lands in any host's
                `~/.docker/config.json` (INV-003).
      description: Creation from a Docker image of a registry (P0). Private registries authenticate per request over the typed agent channel (§5.1, ADR-055).

    ApplicationCreateDockerfile:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreateBase"
        - type: object
          required: [dockerfile]
          properties:
            source_type:
              enum: [dockerfile]
            dockerfile:
              type: string
              description: Inline content of the Dockerfile (P0).
      description: Creation from an inline Dockerfile (P0).

    ApplicationCreateGit:
      allOf:
        - $ref: "#/components/schemas/ApplicationCreateBase"
        - type: object
          required: [git_repository, git_branch, build_pack]
          properties:
            source_type:
              enum: [git]
            git_repository:
              type: string
              description: >-
                URL of the repository — HTTPS for a public repository, SSH
                (git@host:org/repo.git) for a private repository via deploy key.
                Ignored when `github_app_uuid` is provided: the clone URL
                is derived from the discovered repository.
            github_app_uuid:
              type: string
              nullable: true
              description: >-
                GitHub App source (git-webhook-protocols §2) — clone via
                installation token, auto-deploy via the app's webhook.
                Requires `repository_full_name`.
            repository_full_name:
              type: string
              nullable: true
              description: >-
                (with github_app_uuid) Target repository, in owner/name format,
                among the installation's discovered repositories.
            git_branch:
              type: string
              description: Branch to deploy (resolved to an immutable SHA at each deployment, §20.2).
            private_key_uuid:
              type: string
              nullable: true
              description: Private key (deploy key) for a private repository — `null` for a public repository (P1, §5.1).
            build_pack:
              type: string
              enum: [dockerfile, nixpacks, static, compose]
              description: >-
                Build pack (§5.2). `compose` deploys the repository's compose
                file as a multi-service stack (compose-spec.md) — one
                component per service, domain per component. Railpack
                will arrive in a later version of the contract.
            base_directory:
              type: string
              default: /
              description: Base directory in the repository (monorepos).
            dockerfile_location:
              type: string
              default: /Dockerfile
              description: Path of the Dockerfile relative to `base_directory` (dockerfile build pack).
            compose_file_location:
              type: string
              default: /docker-compose.yml
              description: >-
                (compose build pack) Path of the compose file relative to
                `base_directory`.
            raw_compose:
              type: boolean
              default: false
              description: >-
                (compose build pack) Raw compose mode (compose-spec §9) —
                `docker compose up` semantics as close as possible, zero-downtime
                disabled, security boundaries kept.
            publish_directory:
              type: string
              nullable: true
              description: Published directory (static build pack).
            watch_paths:
              type: array
              items:
                type: string
              description: Patterns restricting auto-deploy to matching modified files (§5.5).
              default: []
      description: Creation from a public or private Git repository (P1).

    Preview:
      type: object
      description: Ephemeral environment of a PR (§20.4, data dictionary §8.9).
      required: [uuid, pr_id, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        pr_id:
          type: integer
          readOnly: true
        provider:
          type: string
          readOnly: true
        source_branch:
          type: string
          nullable: true
          readOnly: true
        head_sha:
          type: string
          nullable: true
          readOnly: true
        is_fork:
          type: boolean
          readOnly: true
        fork_approved:
          type: boolean
          readOnly: true
        fqdn:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [queued, deploying, active, failed, destroying, cleanup_failed, destroyed, sleeping, waking]
          readOnly: true
          description: >-
            State of the preview (§20.4). `sleeping`/`waking` = scale-to-zero
            (ADR-036): put to sleep on inactivity (a voluntary stop, not a
            "down"), and woken on the fly by the waker on the first
            request.
        deploy_requested_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
          description: >-
            First explicit human deploy order (/deploy, /rebuild, the
            Previews tab, a fork approval). Under the manual-first policy
            (`preview_deploy_on_open=false`), a `queued` preview with neither
            this nor `last_deployed_at` is a RESERVATION awaiting a human —
            nothing will deploy it automatically (§20.4).
        last_deployed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    GithubApp:
      type: object
      description: >-
        The team's GitHub App (git-webhook-protocols §2) — created via manifest
        flow, encrypted credentials never exposed by the API.
      required: [uuid, name, api_url, html_url, is_installed, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        app_id:
          type: integer
          nullable: true
          description: ID at GitHub — null until the manifest flow is finished (draft).
          readOnly: true
        slug:
          type: string
          nullable: true
          readOnly: true
        installation_id:
          type: integer
          nullable: true
          description: Null until the app is installed on an account/organization.
          readOnly: true
        install_url:
          type: string
          nullable: true
          description: Installation URL at GitHub (once converted).
          readOnly: true
        api_url:
          type: string
          readOnly: true
        html_url:
          type: string
          readOnly: true
        is_installed:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true

    GithubAppCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 34
          description: >-
            Desired name of the app (globally unique at GitHub, ≤ 34
            characters) — default generated from the instance.
        organization:
          type: string
          nullable: true
          description: Target GitHub organization; null = personal account.
        api_url:
          type: string
          nullable: true
          description: GitHub Enterprise Server — API URL (e.g. https://ghe.example.com/api/v3).
        html_url:
          type: string
          nullable: true
          description: GitHub Enterprise Server — web URL.

    GithubAppManifest:
      type: object
      description: What is needed to submit the manifest to GitHub (§2.1 step 2).
      required: [github_app, manifest, state, target_url]
      properties:
        github_app:
          $ref: "#/components/schemas/GithubApp"
        manifest:
          type: object
          description: JSON of the manifest, to post in the `manifest` form field.
        state:
          type: string
          description: Single-use anti-CSRF token (10 minutes) — passed as the `state` query parameter.
        target_url:
          type: string
          description: GitHub URL of the creation form (account or organization).

    GitRepository:
      type: object
      description: Repository discovered via the installation (data dictionary §7.3).
      required: [uuid, full_name]
      properties:
        uuid:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        default_branch:
          type: string
          nullable: true
          readOnly: true
        html_url:
          type: string
          nullable: true
          readOnly: true

    AccessPublicRoute:
      type: object
      description: >-
        A narrow unauthenticated exception through a resource access wall
        (ADR-049/050), inherited by protected previews. `template` accepts only
        whole `:name` path segments; it never accepts a user-supplied regular
        expression.
      required: [path, methods]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^/
          description: >-
            Absolute external request path. Query strings and fragments are
            not part of matching.
        match:
          type: string
          enum: [exact, template, prefix]
          default: exact
          description: >-
            `exact` matches one path; `template` lets `:name` match exactly
            one segment made of unreserved URL characters; `prefix` matches
            the path segment and descendants.
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Explicit HTTP methods allowed without authentication.
        parameters:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
          description: >-
            Optional allow-list per `:name` segment in template mode.

    Service:
      type: object
      description: >-
        Inline Docker Compose stack (compose-spec.md, data dictionary §9.1) —
        the file is the source of truth, editable via PATCH.
      required:
        - uuid
        - name
        - project_uuid
        - environment_uuid
        - server_uuid
        - compose_content
        - desired_status
        - observed_status
        - created_at
        - version
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
          readOnly: true
        environment_uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          readOnly: true
        compose_content:
          type: string
          description: The compose file (compose-spec subset §1).
        connect_to_predefined_network:
          type: boolean
          description: Attaches each component to the destination's network (§2.1).
        access_protection:
          type: string
          enum: [none, basic_auth, sso]
          description: >-
            Access wall shared by every routed component of this inline
            Compose stack (ADR-049).
        noindex:
          type: boolean
          description: >-
            Whether every routed component answers with
            `X-Robots-Tag: noindex, nofollow` (proxy-contract §4.7).
        access_basic_auth_set:
          type: boolean
          readOnly: true
          description: Whether shared basic-auth credentials are configured.
        desired_status:
          $ref: "#/components/schemas/DesiredStatus"
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        last_deployment_uuid:
          type: string
          nullable: true
          readOnly: true
        last_deployment_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    ServiceCreateRequest:
      type: object
      required: [name, project_uuid, environment_uuid, server_uuid, compose_content]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
        environment_uuid:
          type: string
        server_uuid:
          type: string
        compose_content:
          type: string
          description: >-
            Inline compose file, validated on save (422 + compose-spec §11
            findings in details[]). `build:` rejected — an inline stack
            has no source to build.
        connect_to_predefined_network:
          type: boolean
          default: false
        access_protection:
          type: string
          enum: [none, basic_auth, sso]
          default: none
        access_basic_auth:
          type: string
          nullable: true
          writeOnly: true
          description: >-
            Shared `user:password`; null with basic_auth generates one.
        noindex:
          type: boolean
          description: >-
            Keeps every routed component out of search results
            (proxy-contract §4.7). Absent = false.
        instant_deploy:
          type: boolean
          default: false

    ServiceUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        compose_content:
          type: string
          description: New file — validated, applied at the next deployment.
        connect_to_predefined_network:
          type: boolean
        access_protection:
          type: string
          enum: [none, basic_auth, sso]
        access_basic_auth:
          type: string
          nullable: true
          writeOnly: true
          description: >-
            Shared `user:password`; null while enabling basic_auth generates
            one.
        noindex:
          type: boolean
          description: >-
            Keeps every routed component out of search results
            (proxy-contract §4.7). Applied with the routing, no deployment
            needed.

    ServiceComponent:
      type: object
      description: >-
        Sub-container of a compose stack (data dictionary §9.2) — one per
        service of the file, individual observed status (§5.7).
      required: [uuid, name, observed_status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
          description: Name of the service in the compose file.
          readOnly: true
        image:
          type: string
          nullable: true
          description: Resolved image (informative).
          readOnly: true
        is_database:
          type: boolean
          description: Image-based detection (compose-spec §10) — valid target of a backup plan.
          readOnly: true
        database_engine:
          type: string
          nullable: true
          enum: [postgresql, mysql, mariadb, mongodb, redis, keydb, dragonfly, clickhouse, null]
          readOnly: true
        exclude_from_hc:
          type: boolean
          description: One-shot job excluded from the aggregated status (compose-spec §7.3).
          readOnly: true
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    PreviewRouteTemplate:
      type: object
      description: >-
        A preview route (ADR-035). `host` accepts {{pr_id}}, {{service}},
        {{domain}}, {{random}}. A `host` with {{service}} is applied to each
        served service; without {{service}}, the target service is resolved by `port`.
      required: [host]
      properties:
        host:
          type: string
          description: Host pattern (without scheme), e.g. `varuna-pr{{pr_id}}.ad.kedric.fr`.
        port:
          type: integer
          nullable: true
          description: Target internal port; null = default exposed port / service port.

    ComponentMetric:
      type: object
      description: >-
        Consumption snapshot of a service of the stack (ADR-034) — read on
        demand, never stored. `null` on a field = the measurement could not be
        read (container stopped or without a limit).
      required: [component]
      properties:
        component:
          type: string
          description: Name of the compose service.
          readOnly: true
        running:
          type: boolean
          description: False if no live container for this service.
          readOnly: true
        cpu_percent:
          type: number
          format: double
          nullable: true
          description: Instant CPU percentage (may exceed 100 on several cores).
          readOnly: true
        memory_bytes:
          type: integer
          format: int64
          nullable: true
          description: Memory used in bytes.
          readOnly: true
        memory_limit_bytes:
          type: integer
          format: int64
          nullable: true
          description: Memory limit in bytes; null if unlimited.
          readOnly: true
        memory_percent:
          type: number
          format: double
          nullable: true
          description: Memory used as a percentage of the limit.
          readOnly: true

    ApplicationCreateRequest:
      oneOf:
        - $ref: "#/components/schemas/ApplicationCreateDockerImage"
        - $ref: "#/components/schemas/ApplicationCreateDockerfile"
        - $ref: "#/components/schemas/ApplicationCreateGit"
      discriminator:
        propertyName: source_type
        mapping:
          docker_image: "#/components/schemas/ApplicationCreateDockerImage"
          dockerfile: "#/components/schemas/ApplicationCreateDockerfile"
          git: "#/components/schemas/ApplicationCreateGit"
      description: Application creation body — discriminated by `source_type`.

    ApplicationUpdate:
      type: object
      description: >-
        Partial update of the configuration. Changes are
        versioned (INV-014) and applied at the next deployment, except
        `domains` (routing regenerated immediately). `source_type` is not
        modifiable — recreate the application to change the source type.
      properties:
        noindex:
          type: boolean
          description: >-
            Keeps the application's domains out of search results
            (proxy-contract §4.7). Applied with the routing, like `domains`:
            no deployment needed.
        pre_deployment_command:
          type: string
          nullable: true
          description: >-
            Command executed in the **existing** container before any
            clone/build (§10). A failure fails the deployment **before
            any mutation** — the existing container is untouched. Skipped if
            there is no running container. MUST be idempotent: it
            may be replayed during a crash recovery.
        post_deployment_command:
          type: string
          nullable: true
          description: >-
            Command executed in the **candidate** once healthy, before the
            switchover (§10). A failure fails the deployment: the candidate
            is deleted and the old container **stays routed** (INV-005), with
            no automatic rollback. MUST be idempotent.

        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        domains:
          type: array
          items:
            type: string
        ports_exposes:
          type: string
          nullable: true
        health_check:
          $ref: "#/components/schemas/HealthCheckConfig"
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        tags:
          type: array
          items:
            type: string
        docker_image:
          type: string
          description: (docker_image source) New image.
        docker_image_tag:
          type: string
          description: (docker_image source) New tag.
        registry_credential_uuid:
          type: string
          nullable: true
          description: Credential of the private registry (null to remove it).
        use_build_server:
          type: boolean
        push_registry_credential_uuid:
          type: string
          nullable: true
        dockerfile:
          type: string
          description: (dockerfile source) New content of the Dockerfile.
        git_repository:
          type: string
          description: (git source) URL of the repository.
        git_branch:
          type: string
          description: (git source) Branch.
        private_key_uuid:
          type: string
          nullable: true
          description: (git source) Deploy key.
        build_pack:
          type: string
          enum: [dockerfile, nixpacks, static, compose]
          description: (git source) Build pack.
        base_directory:
          type: string
          description: (git source) Base directory.
        dockerfile_location:
          type: string
          description: (git source) Path of the Dockerfile.
        compose_file_location:
          type: string
          description: (compose build pack) Path of the compose file relative to `base_directory`.
        raw_compose:
          type: boolean
          description: (compose build pack) Raw compose mode (compose-spec §9).
        publish_directory:
          type: string
          nullable: true
          description: (git source) Published directory (static).
        watch_paths:
          type: array
          items:
            type: string
          description: (git source) Auto-deploy patterns.
        auto_deploy:
          type: boolean
          description: (git source) Enables/disables auto-deploy on push (§5.5).
        previews_enabled:
          type: boolean
          description: >-
            Per-PR previews (§20.4) — triggered by the GitHub App's
            webhook or by a manual GitLab/Gitea/GitHub webhook of the
            application (protocols §1.2).
        preview_url_template:
          type: string
          description: "Legacy — single pattern; use preview_url_templates (§5.6, ADR-035)."
        preview_url_templates:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PreviewRouteTemplate"
          description: >-
            Preview route table (ADR-035) — replaces preview_url_template
            when non-empty. Empty/absent = legacy behavior.
        preview_max_concurrent:
          type: integer
          nullable: true
          description: Cap on concurrent previews; null = unlimited (§20.4.3).
        preview_ttl_minutes:
          type: integer
          nullable: true
          description: Inactivity TTL in minutes; null = no automatic destruction.
        access_protection:
          type: string
          enum: [none, basic_auth, sso]
          description: >-
            Access wall of the application's own URLs (ADR-042): `sso`
            requires an AkerDock session with access to the team,
            `basic_auth` shared credentials, `none` (default) is public.
            Applies to EVERY domain of the application and every routed
            service of a compose stack.
        access_basic_auth:
          type: string
          nullable: true
          writeOnly: true
          description: >-
            Shared credentials `user:password` for `basic_auth` protection
            (ADR-042). Write-only; stored encrypted, never returned. Sending
            null with `access_protection: basic_auth` generates one.
        access_public_routes:
          type: array
          items:
            $ref: "#/components/schemas/AccessPublicRoute"
          description: >-
            Paths allowed through production and preview walls without
            authentication (ADR-049/050). For a Compose build pack, declare
            them per service with `x-akerdock.access_public_routes` instead.
        preview_protection:
          type: string
          enum: [none, basic_auth, sso]
          description: Access protection of preview URLs (§20.4.4) — basic_auth by default.
        preview_fork_approval_enabled:
          type: boolean
          description: Allows fork previews after a maintainer's approval (INV-010).
        preview_exclude_drafts:
          type: boolean
          description: Draft PRs do not trigger a preview (opt-in, ADR-011).
        preview_deploy_on_open:
          type: boolean
          description: >-
            Auto-deployment at PR opening (§20.4.7, default true). If
            false, opening only reserves the preview (URL, credential):
            the FIRST deployment must be triggered manually (AkerDock UI
            or `/deploy` command). Once deployed, subsequent pushes
            update it normally.
        preview_require_label:
          type: string
          nullable: true
          description: >-
            Opt-in by label (§20.4.7, ADR-011): the PR must carry this label
            to get a preview; null = disabled (parity
            behavior).
        preview_comment_commands_enabled:
          type: boolean
          description: >-
            PR comment commands `/deploy` and `/destroy` (§20.4.7,
            opt-in). The author's rights are verified server-side via
            the provider's API — an API token is required for manual
            webhooks (protocols §2.7d, §3-§6).
        preview_cancel_obsolete_builds:
          type: boolean
          description: >-
            Cancels the preview build made obsolete by a new commit of
            the same PR (§20.4.7, opt-in) — the queued deployment is
            superseded, the running build cooperatively cancelled.
        preview_scale_to_zero:
          type: boolean
          description: >-
            Scale-to-zero for PREVIEWS (ADR-036, opt-in, default false): an
            inactive preview is put to sleep (`docker stop`) and woken at the
            first request by the waker container.
        preview_scale_to_zero_after_minutes:
          type: integer
          description: >-
            Preview inactivity window in minutes before going to sleep
            (default 30).
        scale_to_zero:
          type: boolean
          description: >-
            Scale-to-zero of the APPLICATION itself (ADR-037, explicit opt-in,
            default false): the inactive app is put to sleep and woken at the
            first request. Reserve it for request-driven workloads — a
            `docker stop` also stops workers/crons, and the first visitor
            after inactivity pays the cold start (up to 60 s). Separate from
            `preview_scale_to_zero`.
        scale_to_zero_after_minutes:
          type: integer
          description: >-
            Application inactivity window in minutes before going to sleep
            (default 30).
        git_api_token:
          type: string
          nullable: true
          description: >-
            (git source) Provider API token, stored encrypted on the
            application's git source (protocols §3-§6): carries the preview
            feedback (commit statuses, upserted comment) and the rights
            verification of the commands for GitLab, Gitea and manual GitHub
            webhooks. Write-only — never read back by the API (INV-003). Null
            to remove it. Unnecessary with a GitHub App (it has its own
            credentials).
        git_api_url:
          type: string
          nullable: true
          description: >-
            (git source) Provider API endpoint on the git source
            (self-hosted, protocols §4.1/§6.1) — for example
            https://gitlab.example.com/api/v4. Null to fall back to
            derivation from the repository host.

    Application:
      type: object
      description: >-
        Deployable application (§5). Groups the identity, the desired
        configuration (source, build, routing, health, limits) and the
        desired/observed statuses (§21.2).
      required:
        - uuid
        - name
        - project_uuid
        - environment_uuid
        - server_uuid
        - source_type
        - desired_status
        - observed_status
        - created_at
        - version
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
          readOnly: true
        environment_uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          readOnly: true
        destination_uuid:
          type: string
          nullable: true
          readOnly: true
        source_type:
          type: string
          enum: [docker_image, dockerfile, git]
          readOnly: true
        docker_image:
          type: string
          nullable: true
          description: (docker_image source) Configured image.
        docker_image_tag:
          type: string
          nullable: true
        registry_credential_uuid:
          type: string
          nullable: true
          description: Credential of the private registry used for the pull (amendment #17).
        use_build_server:
          type: boolean
        push_registry_credential_uuid:
          type: string
          nullable: true
        dockerfile:
          type: string
          nullable: true
          description: (dockerfile source) Content of the Dockerfile.
        git_repository:
          type: string
          nullable: true
        git_branch:
          type: string
          nullable: true
        github_app_uuid:
          type: string
          nullable: true
          readOnly: true
          description: >-
            (git source) GitHub App that provides the repository and the clone
            authentication (§5.1) — null for a manual git source. Read-only:
            the link is established at creation.
        pre_deployment_command:
          type: string
          nullable: true
        post_deployment_command:
          type: string
          nullable: true
        private_key_uuid:
          type: string
          nullable: true
        build_pack:
          type: string
          nullable: true
          enum: [dockerfile, nixpacks, static, compose, null]
        base_directory:
          type: string
          nullable: true
        dockerfile_location:
          type: string
          nullable: true
        compose_file_location:
          type: string
          nullable: true
          description: (compose build pack) Path of the compose file relative to `base_directory`.
        raw_compose:
          type: boolean
          description: (compose build pack) Raw compose mode (compose-spec §9).
        publish_directory:
          type: string
          nullable: true
        watch_paths:
          type: array
          items:
            type: string
        auto_deploy:
          type: boolean
          description: (git source) Auto-deploy on push enabled.
        previews_enabled:
          type: boolean
        preview_url_template:
          type: string
        preview_url_templates:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/PreviewRouteTemplate"
          description: >-
            Preview route table (ADR-035). Absent = unchanged; empty
            array = falls back to the legacy single template.
        preview_max_concurrent:
          type: integer
          nullable: true
        preview_ttl_minutes:
          type: integer
          nullable: true
        access_protection:
          type: string
          enum: [none, basic_auth, sso]
          description: >-
            Access wall of the application's own URLs (ADR-042) — `none` by
            default (public), `sso` = AkerDock session + team membership,
            `basic_auth` = shared credentials.
        access_basic_auth_set:
          type: boolean
          readOnly: true
          description: Whether shared basic-auth credentials are configured (ADR-042).
        access_public_routes:
          type: array
          items:
            $ref: "#/components/schemas/AccessPublicRoute"
          description: >-
            Paths allowed through production and preview walls without
            authentication (ADR-049/050). Empty by default.
        preview_protection:
          type: string
          enum: [none, basic_auth, sso]
        preview_fork_approval_enabled:
          type: boolean
        preview_exclude_drafts:
          type: boolean
        preview_deploy_on_open:
          type: boolean
          description: >-
            Auto-deployment at PR opening (default true); false =
            first deployment manual (UI or `/deploy`), §20.4.7.
        preview_require_label:
          type: string
          nullable: true
          description: Opt-in by PR label (§20.4.7); null = disabled.
        preview_comment_commands_enabled:
          type: boolean
          description: '`/deploy` `/destroy` comment commands (§20.4.7).'
        preview_cancel_obsolete_builds:
          type: boolean
          description: Cancellation of the obsolete preview build (§20.4.7).
        preview_scale_to_zero:
          type: boolean
          description: Scale-to-zero for previews (ADR-036, opt-in) — sleeps/wakes via the waker.
        preview_scale_to_zero_after_minutes:
          type: integer
          description: Preview inactivity window before going to sleep, in minutes (default 30).
        scale_to_zero:
          type: boolean
          description: Scale-to-zero of the application itself (ADR-037, opt-in) — sleeps/wakes via the waker.
        scale_to_zero_after_minutes:
          type: integer
          description: Application inactivity window before going to sleep, in minutes (default 30).
        scale_asleep:
          type: boolean
          readOnly: true
          description: >-
            The application is currently asleep (scale-to-zero, ADR-037) —
            voluntarily stopped, not to be confused with a "down" state.
        git_api_token_set:
          type: boolean
          readOnly: true
          description: >-
            A provider API token is configured on the git source (never
            the value — INV-003).
        git_api_url:
          type: string
          nullable: true
          description: Provider API endpoint on the git source (self-hosted).
        domains:
          type: array
          items:
            type: string
        ports_exposes:
          type: string
          nullable: true
        noindex:
          type: boolean
          description: >-
            Whether the application's domains answer with
            `X-Robots-Tag: noindex, nofollow` (proxy-contract §4.7).
        health_check:
          $ref: "#/components/schemas/HealthCheckConfig"
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        tags:
          type: array
          items:
            type: string
        desired_status:
          $ref: "#/components/schemas/DesiredStatus"
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          description: Timestamp of the last observation (beyond a threshold, stale status, §19.2).
          readOnly: true
        last_deployment_uuid:
          type: string
          nullable: true
          description: Latest deployment (all statuses combined).
          readOnly: true
        last_deployment_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        version:
          type: integer
          description: Optimistic version of the configuration (reflected in the ETag).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Environment variables ----------------------------------------------
    PersistentStorageCreate:
      type: object
      required: [kind, mount_path]
      properties:
        kind:
          type: string
          enum: [volume, bind]
          description: Named Docker volume (recommended) or bind mount of a host directory (§8).
        name:
          type: string
          description: >-
            (volume kind) Logical name of the volume — the actual Docker name
            is prefixed with the resource's UUID (INV-011). Required for
            `volume`.
        host_path:
          type: string
          description: (bind kind) Absolute path on the server. Required for `bind`.
        mount_path:
          type: string
          description: Mount path inside the container — unique per resource.

    PersistentStorage:
      type: object
      description: Persistent storage of an application (§8) — the data survives deployments.
      required: [uuid, kind, mount_path, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        kind:
          type: string
          enum: [volume, bind]
        name:
          type: string
          nullable: true
        docker_volume_name:
          type: string
          nullable: true
          description: Actual Docker name of the volume (`<resource_uuid>_<name>`), deterministic.
          readOnly: true
        host_path:
          type: string
          nullable: true
        mount_path:
          type: string
        is_generated:
          type: boolean
          readOnly: true
          description: >-
            Mirror of a volume declared in the compose file (§2.4) —
            rewritten at each deployment, not editable: the file is authoritative.
        created_at:
          type: string
          format: date-time
          readOnly: true

    EnvironmentVariableCreate:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
          maxLength: 255
          description: Name of the variable — unique per application.
        value:
          type: string
          writeOnly: true
          description: Value — written but only returned with `read:sensitive` (INV-003).
        is_build_time:
          type: boolean
          default: false
          description: Injected at build (ARG or BuildKit secret depending on `is_secret`, §5.2).
        is_secret:
          type: boolean
          default: false
          description: >-
            Build secret (§5.2). A secret variable is **never** a
            `--build-arg`: an ARG is written into the image metadata
            and `docker history` exposes it to anyone who can pull it. It is
            passed as a **BuildKit secret** (`--secret`), mounted under
            `/run/secrets/<key>` for the duration of a single `RUN`, and
            absent from all layers (INV-003).
        is_literal:
          type: boolean
          default: false
          description: Literal value, without interpolation (§5.4).
        is_multiline:
          type: boolean
          default: false
          description: Multi-line value (keys, certificates).
        is_locked:
          type: boolean
          default: false
          description: >-
            Locked — masked for everyone (including read:sensitive) and
            not re-editable; deletion then recreation only (§5.4).

    EnvironmentVariableUpdate:
      type: object
      description: Partial update. `key` is not modifiable. Refused on an `is_locked` variable.
      properties:
        value:
          type: string
          writeOnly: true
        is_build_time:
          type: boolean
        is_secret:
          type: boolean
        is_literal:
          type: boolean
        is_multiline:
          type: boolean
        is_locked:
          type: boolean
          description: Can go from false to true (locking), never the reverse.

    EnvironmentVariable:
      type: object
      description: >-
        Environment variable of an application (§5.4). `value` is
        `null` without `read:sensitive` or if `is_locked` (INV-003) —
        `is_redacted` indicates it.
      required: [uuid, key, is_build_time, is_literal, is_multiline, is_locked, is_redacted, created_at]
      properties:
        is_preview_override:
          type: boolean
          readOnly: true
          description: >-
            Override dedicated to ONE preview (§20.4) — absent or false for
            the variables of the production and shared preview sets.
        uuid:
          type: string
          readOnly: true
        key:
          type: string
        value:
          type: string
          nullable: true
          description: Clear value — only with `read:sensitive` and if not locked.
        is_redacted:
          type: boolean
          description: True if `value` was masked (insufficient permission or locked variable).
          readOnly: true
        is_build_time:
          type: boolean
        is_secret:
          type: boolean
          description: >-
            Build secret: passed as a BuildKit secret, never as a
            `--build-arg` (INV-003, §5.2).
        is_literal:
          type: boolean
        is_multiline:
          type: boolean
        is_locked:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Deployments ---------------------------------------------------------
    DeploymentStatus:
      type: string
      enum:
        - queued
        - preparing
        - cloning
        - building
        - pushing
        - starting
        - healthchecking
        - switching
        - finishing
        - succeeded
        - failed
        - cancelled
        - retrying
        - superseded
      description: State machine of a deployment (§21.1). `succeeded`, `failed`, `cancelled` and `superseded` are terminal; `superseded` = replaced in the queue by a more recent deployment (coalescing).

    Deployment:
      type: object
      description: Deployment of an application — one attempt (§21.1). A retry creates a linked attempt, the history is never rewritten.
      required: [uuid, application_uuid, status, trigger, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        application_uuid:
          type: string
          readOnly: true
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        trigger:
          type: string
          enum: [manual, api, webhook, preview, schedule, config_apply, cli_local]
          description: Origin of the trigger (vocabulary aligned with the data dictionary's `deployment_trigger` enum). A rollback is signaled by `is_rollback`, not by the trigger.
          readOnly: true
        pr_id:
          type: integer
          nullable: true
          readOnly: true
          description: PR/MR number when this deployment is a preview's (`trigger = preview`); `null` otherwise. Allows displaying "preview #N" instead of a plain "preview".
        branch:
          type: string
          nullable: true
          readOnly: true
          description: Deployed git branch (git source only); `null` otherwise.
        repository_url:
          type: string
          nullable: true
          readOnly: true
          description: >-
            Browsable URL of the repository (normalized to https, without `.git`)
            for a git source; `null` otherwise. Combined with `provider`, it
            allows building the links to the branch, commit and PR.
        provider:
          type: string
          nullable: true
          readOnly: true
          enum: [github, gitlab, bitbucket, gitea, other]
          description: Git forge of the source, when known — determines the shape of the links (branch/commit/PR).
        is_rollback:
          type: boolean
          default: false
          readOnly: true
        force_rebuild:
          type: boolean
          default: false
          readOnly: true
        skip_build:
          type: boolean
          default: false
          readOnly: true
          description: >-
            This deployment rebuilt nothing: it reapplied the current
            configuration over the artifact already running (ADR-048).
        commit_sha:
          type: string
          nullable: true
          description: Immutable Git SHA resolved at trigger time (git source only, §18.3).
          readOnly: true
        commit_message:
          type: string
          nullable: true
          readOnly: true
        commit_author:
          type: string
          nullable: true
          readOnly: true
          description: Author of the last deployed commit (git source), read after checkout — shows who pushed the deployment. `null` outside a git source.
        image_digest:
          type: string
          nullable: true
          description: OCI digest of the produced/deployed image (resolved before switchover, §18.3).
          readOnly: true
        config_version:
          type: integer
          nullable: true
          description: Application configuration version embedded in this deployment (INV-014).
          readOnly: true
        attempt:
          type: integer
          default: 1
          description: Attempt number (§21.1).
          readOnly: true
        error_message:
          type: string
          nullable: true
          description: Failure summary, without secrets or sensitive commands.
          readOnly: true
        logs_url:
          type: string
          description: URL of the build logs (relative to /api/v1).
          readOnly: true
        queued_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        started_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        finished_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    LogLine:
      type: object
      description: Build log line — sanitized (ANSI/HTML, §23.3), never a secret (INV-003).
      required: [sequence, timestamp, channel, message]
      properties:
        sequence:
          type: integer
          description: Monotonic sequence number — serves as cursor and Last-Event-ID.
        timestamp:
          type: string
          format: date-time
        channel:
          type: string
          enum: [stdout, stderr, system]
          description: Origin of the line (`system` = deployment engine steps).
        message:
          type: string

    # --- Scheduled tasks (amendment #15) -------------------------------------
    TaskOverlapPolicy:
      type: string
      enum: [skip, queue]
      default: skip
      description: >-
        What to do when an occurrence fires while the previous execution
        is still running. `skip` (default) drops the occurrence — a cron that
        fires faster than it finishes must not pile up executions
        on the server; `queue` queues it behind the previous one.
    TaskMissedRunPolicy:
      type: string
      enum: [run, skip]
      default: run
      description: >-
        What to do with an occurrence the scheduler did not see in time
        (instance stopped). `run` (default) triggers it once at
        restart — a missed nightly cleanup is still useful; `skip`
        drops it — a "9 a.m. digest" sent at 3 p.m. is noise. In both
        cases, the missed occurrence is **traced** (`skipped` + reason),
        never silently forgotten.
    TaskExecutionStatus:
      type: string
      enum: [running, succeeded, failed, skipped]
    ScheduledTask:
      type: object
      description: Cron running a command inside a resource's container (§192).
      required: [uuid, name, command, cron_expression]
      properties:
        uuid:
          type: string
          readOnly: true
        application_uuid:
          type: string
          readOnly: true
        name:
          type: string
        command:
          type: string
          description: Command passed to the container's shell — never sanitized (it is intended shell), always quoted (INV-012).
        container:
          type: string
          nullable: true
          description: Target container within a stack; `null` = the resource's container.
        cron_expression:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        overlap_policy:
          $ref: "#/components/schemas/TaskOverlapPolicy"
        missed_run_policy:
          $ref: "#/components/schemas/TaskMissedRunPolicy"
        timeout_seconds:
          type: integer
        next_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_run_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    ScheduledTaskCreate:
      type: object
      required: [name, command, cron_expression]
      properties:
        name:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        container:
          type: string
          nullable: true
        cron_expression:
          type: string
          minLength: 1
        timezone:
          type: string
          default: UTC
        enabled:
          type: boolean
          default: true
        overlap_policy:
          $ref: "#/components/schemas/TaskOverlapPolicy"
        missed_run_policy:
          $ref: "#/components/schemas/TaskMissedRunPolicy"
        timeout_seconds:
          type: integer
          minimum: 1
          default: 300
    ScheduledTaskUpdate:
      type: object
      properties:
        name:
          type: string
        command:
          type: string
        container:
          type: string
          nullable: true
        cron_expression:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        overlap_policy:
          $ref: "#/components/schemas/TaskOverlapPolicy"
        missed_run_policy:
          $ref: "#/components/schemas/TaskMissedRunPolicy"
        timeout_seconds:
          type: integer
          minimum: 1
    TaskExecution:
      type: object
      description: An execution — or an explicitly non-executed occurrence.
      required: [uuid, status, started_at]
      properties:
        uuid:
          type: string
          readOnly: true
        status:
          $ref: "#/components/schemas/TaskExecutionStatus"
        skip_reason:
          type: string
          nullable: true
          description: Populated if and only if the status is `skipped`.
        exit_code:
          type: integer
          nullable: true
        output:
          type: string
          nullable: true
          description: Combined stdout and stderr, **truncated** (see `output_truncated`). Never a secret value (INV-003).
        output_truncated:
          type: boolean
          description: True if the output was cut — what is displayed is then not everything.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true

    DnsCredential:
      type: object
      description: >-
        DNS-01 credential (proxy-contract §7.2). The content **is never
        returned**: it only exists encrypted in the database and in a 0600 file
        on the server.
      required: [uuid, name, provider]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        provider:
          type: string
          description: Lego provider identifier (cloudflare, route53, ovh…).
        in_use:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    DnsCredentialCreate:
      type: object
      required: [name, provider, config]
      properties:
        name:
          type: string
          minLength: 1
        provider:
          type: string
          minLength: 1
        config:
          type: object
          additionalProperties:
            type: string
          description: Environment variables expected by Lego for this provider.

    RegistryCredential:
      type: object
      description: >-
        Credential of a private registry (§6.5). The password **is never
        returned**, whatever the permission: it is only encoded per request
        into the pull/push auth sent over the typed agent channel — no
        `docker login` ever runs and no token lands in any host's
        `~/.docker/config.json` (INV-003, ADR-055).
      required: [uuid, name, registry_url, username]
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        registry_url:
          type: string
          description: E.g. ghcr.io, registry.gitlab.com — validated by the SSRF policy (§23.3).
        username:
          type: string
        in_use:
          type: boolean
          readOnly: true
          description: True if an application or a rollback artifact depends on it — deletion is then refused with 409 (§19.2).
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RegistryCredentialCreate:
      type: object
      required: [name, registry_url, username, password]
      properties:
        name:
          type: string
          minLength: 1
        registry_url:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          description: Password or token. Encrypted at rest (ADR-003), never read back by the API.
    RegistryCredentialUpdate:
      type: object
      properties:
        name:
          type: string
        registry_url:
          type: string
        username:
          type: string
        password:
          type: string

    # --- Databases -----------------------------------------------------------
    DatabaseCreatePostgresql:
      type: object
      description: Creation of a managed PostgreSQL database (§6). Omitted credentials are auto-generated.
      required: [name, project_uuid, environment_uuid, server_uuid]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        project_uuid:
          type: string
        environment_uuid:
          type: string
        server_uuid:
          type: string
        destination_uuid:
          type: string
          nullable: true
        image:
          type: string
          default: postgres:16-alpine
          description: PostgreSQL image (free-form tag, §6.2).
        postgres_user:
          type: string
          default: postgres
        postgres_password:
          type: string
          writeOnly: true
          description: Omitted = auto-generated 64-character password (§6.2).
        postgres_db:
          type: string
          description: Name of the initial database — default = value of `postgres_user`.
        postgres_conf:
          type: string
          nullable: true
          description: Custom postgresql.conf configuration (§6.2).
        postgres_initdb_args:
          type: string
          nullable: true
        is_public:
          type: boolean
          default: false
          description: Public exposure (§6.2).
        public_access_mode:
          type: string
          enum: [port_mapping, tcp_proxy]
          default: port_mapping
          description: >-
            `port_mapping` publishes the port on the database's container:
            changing it **restarts** it. `tcp_proxy` routes it through the proxy:
            the public port becomes modifiable without ever touching the database
            (amendment #22).
        public_port:
          type: integer
          nullable: true
          minimum: 1024
          maximum: 65535
          description: Public port if `is_public` — omitted = assigned automatically.
        ssl_enabled:
          type: boolean
          description: >-
            Database-side TLS, with a certificate signed by the **server's CA**
            (§6.3, amendment #23). The CA is generated on demand and exposed
            for reading (`GET /servers/{uuid}/ca`) so that clients can
            *verify* — a TLS the client does not verify protects nothing.
        ssl_mode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
          default: disable
          description: PostgreSQL SSL mode (§6.3).
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        instant_start:
          type: boolean
          default: false
          description: Starts the database immediately after creation.

    DatabaseUpdate:
      type: object
      description: >-
        Partial update. Changes to the image, configuration or
        credentials require a restart (`restart_required=true`
        in the response).
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        image:
          type: string
        postgres_password:
          type: string
          writeOnly: true
          description: Password rotation.
        postgres_conf:
          type: string
          nullable: true
        is_public:
          type: boolean
        public_access_mode:
          type: string
          enum: [port_mapping, tcp_proxy]
          description: >-
            How the database is exposed (§6.2, amendment #22).
            `port_mapping` publishes the port on the database's container:
            changing it **restarts** it. `tcp_proxy` routes it through the proxy:
            changing the public port recreates the **proxy** (a few seconds, no
            data touched) and the database does not move.
        public_port:
          type: integer
          nullable: true
          minimum: 1024
          maximum: 65535
        ssl_enabled:
          type: boolean
          description: >-
            Database-side TLS, with a certificate signed by the **server's CA**
            (§6.3, amendment #23). The CA is generated on demand and exposed
            for reading (`GET /servers/{uuid}/ca`) so that clients can
            *verify* — a TLS the client does not verify protects nothing.
        ssl_mode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
        limits:
          $ref: "#/components/schemas/ResourceLimits"

    Database:
      type: object
      description: >-
        Managed database (§6, v1 — PostgreSQL). The fields
        `postgres_password`, `internal_url` and `external_url` contain
        credentials — `null` without `read:sensitive` (INV-003),
        `is_redacted` indicates it.
      required:
        - uuid
        - name
        - engine
        - project_uuid
        - environment_uuid
        - server_uuid
        - desired_status
        - observed_status
        - is_redacted
        - created_at
        - version
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        engine:
          type: string
          enum: [postgresql]
          description: Engine — v1 limited to PostgreSQL; enum extended with the upcoming P1 engines.
          readOnly: true
        project_uuid:
          type: string
          readOnly: true
        environment_uuid:
          type: string
          readOnly: true
        server_uuid:
          type: string
          readOnly: true
        destination_uuid:
          type: string
          nullable: true
          readOnly: true
        image:
          type: string
        postgres_user:
          type: string
        postgres_password:
          type: string
          nullable: true
          description: Password — only with `read:sensitive`.
        postgres_db:
          type: string
        postgres_conf:
          type: string
          nullable: true
        internal_url:
          type: string
          nullable: true
          description: >-
            Internal connection URL (hostname = UUID on the Docker network,
            §6.2). Contains the password — only with
            `read:sensitive`.
        external_url:
          type: string
          nullable: true
          description: Public URL if `is_public` — only with `read:sensitive`.
        is_redacted:
          type: boolean
          description: True if the sensitive fields were masked for lack of `read:sensitive`.
          readOnly: true
        is_public:
          type: boolean
        public_access_mode:
          type: string
          enum: [port_mapping, tcp_proxy]
        public_port:
          type: integer
          nullable: true
        ssl_enabled:
          type: boolean
          description: >-
            Database-side TLS, with a certificate signed by the **server's CA**
            (§6.3, amendment #23). The CA is generated on demand and exposed
            for reading (`GET /servers/{uuid}/ca`) so that clients can
            *verify* — a TLS the client does not verify protects nothing.
        ssl_mode:
          type: string
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
        limits:
          $ref: "#/components/schemas/ResourceLimits"
        desired_status:
          $ref: "#/components/schemas/DesiredStatus"
        observed_status:
          $ref: "#/components/schemas/ObservedStatus"
        observed_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        restart_required:
          type: boolean
          default: false
          description: True if a configuration change awaits a restart to take effect.
          readOnly: true
        last_online_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    # --- Backups -------------------------------------------------------------
    RetentionPolicy:
      type: object
      description: Cumulative retention rules (§7.2) — 0 = unlimited.
      properties:
        max_count:
          type: integer
          minimum: 0
          default: 0
          description: Maximum number of backups kept.
        max_age_days:
          type: integer
          minimum: 0
          default: 0
          description: Maximum age in days.
        max_size_gb:
          type: number
          minimum: 0
          default: 0
          description: Maximum total size in GB.

    BackupPlanCreate:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          description: >-
            Cron expression (5 fields) or alias — every_minute, hourly,
            daily, weekly, monthly, yearly (§7.1).
          example: daily
        timezone:
          type: string
          default: UTC
          description: Timezone for interpreting the cron (§24.3).
        enabled:
          type: boolean
          default: true
        dump_all:
          type: boolean
          default: false
          description: Backs up all databases of the engine instance (pg_dumpall).
        databases_to_include:
          type: array
          items:
            type: string
          description: Databases to include — empty = main database only (ignored if `dump_all`).
          default: []
        save_local:
          type: boolean
          default: true
          description: Keep the local file (§7.2).
        save_s3:
          type: boolean
          default: false
          description: Upload to a configured S3.
        s3_storage_uuid:
          type: string
          nullable: true
          description: Target S3 Storage — required if `save_s3` (provisioned via the UI in this v1).
        s3_only:
          type: boolean
          default: false
          description: Delete the local file after a successful S3 upload.
        local_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        s3_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        timeout_seconds:
          type: integer
          minimum: 60
          default: 3600
        drill_enabled:
          type: boolean
          default: false
          description: >-
            Periodic restore drill (ADR-014, amendment #16): the latest
            dump is restored into a **throwaway** database on the same server,
            its content is recounted, then the database is destroyed.
        drill_interval_days:
          type: integer
          minimum: 1
          default: 7

    BackupPlanUpdate:
      type: object
      description: Partial update of the plan.
      properties:
        frequency:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        dump_all:
          type: boolean
        databases_to_include:
          type: array
          items:
            type: string
        save_local:
          type: boolean
        save_s3:
          type: boolean
        s3_storage_uuid:
          type: string
          nullable: true
        s3_only:
          type: boolean
        local_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        s3_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        timeout_seconds:
          type: integer
          minimum: 60
        drill_enabled:
          type: boolean
        drill_interval_days:
          type: integer
          minimum: 1

    BackupPlan:
      type: object
      description: >-
        Scheduled backup plan (§7) — targets a managed database
        (`database_uuid`) OR an internal database of a compose stack
        (`service_component_uuid`, compose-spec §10): exactly one of the
        two is set.
      required: [uuid, frequency, enabled, created_at, version]
      properties:
        uuid:
          type: string
          readOnly: true
        database_uuid:
          type: string
          nullable: true
          readOnly: true
        service_component_uuid:
          type: string
          nullable: true
          readOnly: true
          description: Targeted stack component (compose-spec §10).
        frequency:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        dump_all:
          type: boolean
        databases_to_include:
          type: array
          items:
            type: string
        save_local:
          type: boolean
        save_s3:
          type: boolean
        s3_storage_uuid:
          type: string
          nullable: true
        s3_only:
          type: boolean
        local_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        s3_retention:
          $ref: "#/components/schemas/RetentionPolicy"
        timeout_seconds:
          type: integer
        next_run_at:
          type: string
          nullable: true
          format: date-time
          description: Previewed next execution (§24.3).
          readOnly: true
        last_execution_uuid:
          type: string
          nullable: true
          readOnly: true
        last_execution_status:
          type: string
          nullable: true
          enum: [queued, running, succeeded, partial, failed, null]
          readOnly: true
        drill_enabled:
          type: boolean
          description: >-
            Periodic restore drill (ADR-014): the latest dump is restored
            into a **throwaway** database on the same server, the content is
            recounted, then the database is destroyed. A backup never restored
            is not a backup, it is a file.
        drill_interval_days:
          type: integer
          minimum: 1
        last_drill_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_drill_status:
          type: string
          nullable: true
          enum: [running, succeeded, failed, null]
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true

    RestoreDrill:
      type: object
      description: >-
        A restore rehearsal (ADR-014). `tables_expected` is the
        number of tables counted **in the source database at dump time**:
        a dump can decompress cleanly, restore without error and contain
        nothing — a `psql` restoring emptiness exits with 0. The drill
        compares, it does not settle for not failing.
      required: [uuid, status, started_at]
      properties:
        uuid:
          type: string
          readOnly: true
        execution_uuid:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
          enum: [running, succeeded, failed]
        tables_expected:
          type: integer
          nullable: true
        tables_restored:
          type: integer
          nullable: true
        error_message:
          type: string
          nullable: true
          description: Failure reason — never a credential.
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true

    BackupExecution:
      type: object
      description: >-
        Execution of a backup plan (§7.3, §20.5). `partial` = local
        success but S3 failure — never presented as a global success.
      required: [uuid, backup_plan_uuid, database_uuid, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        backup_plan_uuid:
          type: string
          readOnly: true
        database_uuid:
          type: string
          readOnly: true
        status:
          type: string
          enum: [queued, running, succeeded, partial, failed]
          readOnly: true
        trigger:
          type: string
          enum: [scheduled, manual]
          readOnly: true
        filename:
          type: string
          nullable: true
          description: Name of the produced backup file.
          readOnly: true
        size_bytes:
          type: integer
          nullable: true
          readOnly: true
        checksum:
          type: string
          nullable: true
          description: Checksum of the file (verified at upload and restore, §20.5).
          readOnly: true
        local_available:
          type: boolean
          description: File still present locally (depending on retention and `s3_only`).
          readOnly: true
        s3_uploaded:
          type: boolean
          readOnly: true
        message:
          type: string
          nullable: true
          description: Error or warning detail, without secrets.
          readOnly: true
        started_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        finished_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true

    RestoreRequest:
      type: object
      description: Restore request — destructive operation with explicit confirmation (§20.5).
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: MUST be `true` — any other value → `422`.
        allow_non_empty:
          type: boolean
          default: false
          description: Reinforced confirmation required to restore into a non-empty database (§20.5).
        source:
          type: string
          enum: [local, s3]
          default: local
          description: Location of the file to use — `s3` downloads the remote object first.
        custom_command:
          type: string
          nullable: true
          description: >-
            Custom restore command (default pg_restore, §7.3).
            Validated and escaped server-side (INV-012).

    # --- Jobs ----------------------------------------------------------------
    JobStatus:
      type: string
      enum:
        - scheduled
        - queued
        - leased
        - running
        - retry_wait
        - succeeded
        - cancelled
        - dead_letter
      description: >-
        State machine of a job (§21.3). `succeeded`, `cancelled` and
        `dead_letter` are terminal — `dead_letter` means definitive failure
        after retries are exhausted.

    JobForgetRequest:
      type: object
      description: Body of the forget of a dead-letter job.
      properties:
        acknowledge_remnants:
          type: boolean
          default: false
          description: >-
            Explicit confirmation that the job's remote remnants (e.g.
            `remnants` of a `resource.delete`, §20.6.4) are accepted or have
            been cleaned up manually. Required (`true`) if the job leaves
            remote remnants, otherwise `409` (`remnants_present`).

    JobStep:
      type: object
      description: Step of a job (visible, replayable, with remediation — §20.1, §22.5).
      required: [name, status]
      properties:
        name:
          type: string
          description: Identifier of the step (e.g. ssh_connect, install_docker).
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped]
        message:
          type: string
          nullable: true
          description: Detail or remediation instruction in case of failure.
        started_at:
          type: string
          nullable: true
          format: date-time
        finished_at:
          type: string
          nullable: true
          format: date-time

    Job:
      type: object
      description: Asynchronous operation created by a `202` response (§21.3, §24.1).
      required: [uuid, type, status, created_at]
      properties:
        uuid:
          type: string
          readOnly: true
        type:
          type: string
          description: >-
            Job type — e.g. server.validate, application.start,
            application.delete, database.start, backup.execute,
            backup.restore, certificate.renew, encryption.rotate.
          readOnly: true
        queue:
          type: string
          description: Logical queue of the job (e.g. deploy, backup, cleanup, maintenance — §24.3).
          readOnly: true
        status:
          $ref: "#/components/schemas/JobStatus"
        resource_uuid:
          type: string
          nullable: true
          description: Main affected resource.
          readOnly: true
        resource_type:
          type: string
          nullable: true
          enum: [server, application, database, backup_plan, certificate, null]
          readOnly: true
        retry_of_uuid:
          type: string
          nullable: true
          description: >-
            UUID of the original job if this job is a **linked new
            attempt** created by a retry from the dead-letter (deployment-engine
            spec §2.4).
          readOnly: true
        dead_lettered_at:
          type: string
          nullable: true
          format: date-time
          description: Transition to dead-letter, if any (§21.3).
          readOnly: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"
          readOnly: true
        attempt:
          type: integer
          default: 1
          description: Attempt number (retries §21.3).
          readOnly: true
        result:
          type: object
          nullable: true
          description: Structured result on success (content depends on the job type, never a secret).
          additionalProperties: true
          readOnly: true
        error:
          allOf:
            - $ref: "#/components/schemas/Error"
          nullable: true
          description: Final error on failure (same schema as HTTP errors, without a relevant request_id).
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
        finished_at:
          type: string
          nullable: true
          format: date-time
          readOnly: true
