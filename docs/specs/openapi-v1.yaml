                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UptimeResult"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
