  # ---------------------------------------------------------------------------
  # Private keys
  # ---------------------------------------------------------------------------
  /private-keys:
    get:
      tags: [PrivateKeys]
      operationId: listPrivateKeys
      summary: List private keys
      description: >-
        Lists key metadata (name, fingerprint, public key). The
        `private_key` field is always `null` in lists, whatever
        the permission.
      x-required-permission: keys:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of keys (without private material).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrivateKey"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [PrivateKeys]
      operationId: createPrivateKey
      summary: Register a private key
      description: >-
        Registers a private SSH key (stored encrypted, §23.2). The response
        never contains the private material, even with `read:sensitive`
        immediately after creation.
      x-required-permission: keys:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateKeyCreate"
      responses:
        "201":
          description: Key registered (metadata only).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /private-keys/{private_key_uuid}:
    parameters:
      - $ref: "#/components/parameters/PrivateKeyUuid"
    get:
      tags: [PrivateKeys]
      operationId: getPrivateKey
      summary: Private key details
      description: >-
        Returns the key's metadata. The `private_key` field is only
        populated if the token holds `read:sensitive` AND the
        `reveal=true` parameter is passed explicitly; otherwise it is
        `null` and `is_redacted` is `true`. Each reveal is audited
        (§23.4).
      x-required-permission: keys:read
      parameters:
        - name: reveal
          in: query
          required: false
          description: >-
            Explicit request to reveal the private material. Requires
            `read:sensitive` (otherwise `403`).
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The key (private material depending on permission and `reveal`).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [PrivateKeys]
      operationId: updatePrivateKey
      summary: Update a private key
      description: >-
        Updates the name, the description or replaces the key material
        (rotation). Sensitive PATCH — `If-Match` required (§24.1).
      x-required-permission: keys:manage
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivateKeyUpdate"
      responses:
        "200":
          description: Key updated (metadata only).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [PrivateKeys]
      operationId: deletePrivateKey
      summary: Delete a private key
      description: >-
        Refused with `409` (`dependency_exists`) as long as the key is
        referenced by a server or an application (§19.2).
      x-required-permission: keys:manage
      responses:
        "204":
          description: Key deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"




  /applications/{application_uuid}/webhook-endpoint:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: createWebhookEndpoint
      summary: Create the application's Git webhook endpoint
      description: >-
        Generates the receiving URL and the HMAC secret to paste into the
        provider's interface (§5.1). The secret is returned **once only**: it
        is encrypted at rest and never read back (§23.2). A push on the
        deployed branch then triggers a deployment, subject to the policies
        (`auto_deploy`, `[skip ci]`, `watch_paths`).
      x-required-permission: sources:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreate"
      responses:
        "201":
          description: Endpoint created — the secret is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Applications]
      operationId: deleteWebhookEndpoint
      summary: Delete the Git webhook endpoint
      x-required-permission: sources:manage
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [github, gitlab, gitea]
      responses:
        "204":
          description: Endpoint deleted — subsequent deliveries will respond 404.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
