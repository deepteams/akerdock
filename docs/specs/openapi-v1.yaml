        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Webhooks]
      operationId: webhookDeployPost
      summary: Trigger deployments by UUID or tag (CI webhook, POST)
      description: >-
        Identical to the GET variant — same query parameters, body
        ignored. Supports `Idempotency-Key` to deduplicate CI retries.
      x-required-permission: deploy
      parameters:
