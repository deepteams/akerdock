                properties:
                  delivered:
                    type: boolean
                  error:
                    type: string
                    nullable: true
                    description: Failure reason — never a credential.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
