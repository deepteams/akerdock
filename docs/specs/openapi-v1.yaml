      description: >-
        Lists the team's channels. The configuration (webhook URL, bot
        token) is never returned (INV-003).
      x-required-permission: notifications:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of channels.
          content:
            application/json:
              schema:
                type: object
                required: [data]
