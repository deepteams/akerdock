  /deployments/{deployment_uuid}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentUuid"
    get:
      tags: [Deployments]
      operationId: getDeploymentLogs
      summary: Logs de build d'un déploiement (JSON ou SSE)
      description: |
        Deux représentations, négociées par l'en-tête `Accept` (§27.24) :

        - `application/json` (défaut) — page de lignes de log, reprise par
          `?cursor=` (curseur = `sequence` de la dernière ligne reçue).
        - `text/event-stream` — flux SSE temps réel. Chaque événement a
          `event: log`, `id: <sequence>` et `data: <LogLine en JSON>`.
          Un événement final `event: end` est émis quand le déploiement
          atteint un statut terminal. Reprise native par l'en-tête
          `Last-Event-ID`. En cas de backpressure, un événement
          `event: gap` signale explicitement les lignes abandonnées (§22.2).

        Les lignes sont neutralisées (ANSI/HTML, §23.3) et ne contiennent
        jamais de valeurs de secrets (INV-003).
      x-required-permission: read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Logs du déploiement.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogLine"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
            text/event-stream:
              schema:
                type: string
                description: >-
                  Flux SSE — événements `log` (data = LogLine JSON), `gap`
                  et `end`, id = sequence pour reprise Last-Event-ID.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /deployments/{deployment_uuid}/cancel:
    parameters:
      - $ref: "#/components/parameters/DeploymentUuid"
    post:
      tags: [Deployments]
      operationId: cancelDeployment
      summary: Annuler un déploiement
      description: >-
        Annule un déploiement `queued` ou en cours avant la bascule de
        trafic (§21.1). Un déploiement déjà terminal ou en cours de bascule
        (`switching`) → `409`. L'annulation ne supprime que le candidat,
        jamais le container sain existant (INV-006).
      x-required-permission: deploy
      responses:
        "202":
          description: Annulation demandée — suivre le déploiement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

