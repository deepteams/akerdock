  /databases/{database_uuid}/restart:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    post:
      tags: [Databases]
      operationId: restartDatabase
      summary: Restart a database
      x-required-permission: databases:lifecycle
      responses:
        "202":
          description: Restart accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    post:
      tags: [Databases]
      operationId: createDatabaseTerminalSession
      summary: Open a terminal session in the database's container
      description: >-
        Creates a terminal session (§5.7, §24.4) to the managed database's
        container (container shell — `psql` is available there) and returns a
        **short-lived single-use token** to present on the WebSocket
        `websocket_path` (outside OpenAPI, §27.24). Same guarantees as the
        application terminal: token shown once, session scoped to the
        team, audited, idle timeout, maximum duration, guaranteed kill (§24.4).
        `409` if the team has reached its cap of concurrent sessions
        (`terminal_session_limit`).
      x-required-permission: terminal:open
      responses:
        "201":
          description: >-
            Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

