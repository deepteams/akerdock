    get:
      tags: [Databases]
      operationId: getDatabase
      summary: Détail d'une base
      description: >-
        `postgres_password`, `internal_url` et `external_url` requièrent
        `read:sensitive` (sinon `null`, `is_redacted=true`).
      x-required-permission: read
      responses:
        "200":
          description: La base.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Databases]
      operationId: updateDatabase
      summary: Modifier une base
      description: >-
        PATCH sensible — `If-Match` obligatoire. Certains changements
        (image, configuration, credentials) nécessitent un redémarrage pour
        prendre effet — le champ `restart_required` de la réponse l'indique.
      x-required-permission: write
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseUpdate"
      responses:
        "200":
          description: Base mise à jour.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Database"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Databases]
      operationId: deleteDatabase
      summary: Supprimer une base
      description: >-
        Suppression asynchrone (§20.6). Par défaut les volumes de données
        sont CONSERVÉS ; `delete_volumes=true` pour les détruire (INV-008).
        Refusé avec `409` si des plans de backup actifs référencent la base
        (les supprimer d'abord).
      x-required-permission: write
      parameters:
        - name: delete_volumes
          in: query
          required: false
          description: Détruire aussi les volumes de données.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Suppression acceptée — suivre le job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/start:
