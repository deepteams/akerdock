  # ---------------------------------------------------------------------------
  # S3 Storages (backup destinations, §7.2)
  # ---------------------------------------------------------------------------
  /s3-storages:
    get:
      tags: [S3Storages]
      operationId: listS3Storages
      summary: List S3 storages
      description: >-
        Lists the team's backup destinations. Credentials are
        never returned (INV-003); only `is_usable` indicates whether a
        write/read/delete round-trip succeeded (§20.5).
      x-required-permission: cloud:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of S3 storages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/S3Storage"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [S3Storages]
      operationId: createS3Storage
      summary: Register an S3 storage
      description: >-
        Registers an S3 destination (credentials encrypted at rest, §23.2).
        Connectivity is verified immediately with a
        write/read/delete round-trip: a storage that fails is created with
        `is_usable: false` and `last_check_error` populated — it cannot
        be referenced by a backup plan until it is usable.
      x-required-permission: cloud:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/S3StorageCreate"
      responses:
        "201":
          description: Storage registered (credentials never returned).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /s3-storages/{s3_storage_uuid}:
    parameters:
      - $ref: "#/components/parameters/S3StorageUuid"
    get:
      tags: [S3Storages]
      operationId: getS3Storage
      summary: S3 storage details
      x-required-permission: cloud:read
      responses:
        "200":
          description: The storage (without credentials).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [S3Storages]
      operationId: updateS3Storage
      summary: Update an S3 storage
      description: >-
        Updates the configuration or replaces the credentials. Sensitive
        PATCH — `If-Match` required (§24.1). Connectivity is
        re-verified after the update.
      x-required-permission: cloud:manage
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/S3StorageUpdate"
      responses:
        "200":
          description: Storage updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [S3Storages]
      operationId: deleteS3Storage
      summary: Delete an S3 storage
      description: >-
        Refused with `409` (`dependency_exists`) as long as a backup plan
        references it (§19.2). Objects already stored in the bucket are
        never deleted (INV-008).
      x-required-permission: cloud:manage
      responses:
        "204":
          description: Storage deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /s3-storages/{s3_storage_uuid}/validate:
    parameters:
      - $ref: "#/components/parameters/S3StorageUuid"
    post:
      tags: [S3Storages]
      operationId: validateS3Storage
      summary: Check an S3 storage's connectivity
      description: >-
        Replays the write/read/delete round-trip and updates
        `is_usable` and `last_check_error` (§20.5).
      x-required-permission: cloud:manage
      responses:
        "200":
          description: Check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Storage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Servers
  # ---------------------------------------------------------------------------
  /servers:
    get:
      tags: [Servers]
      operationId: listServers
      summary: List servers
      x-required-permission: servers:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of the team's servers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Server"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Servers]
      operationId: createServer
      summary: Register a server
      description: >-
        Registers an SSH server with `pending` status (§20.1). The
        referenced key must belong to the same team (INV-002). The actual
        validation (connectivity, Docker, prerequisites) is triggered via
        `POST /servers/{uuid}/validate`.
      x-required-permission: servers:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerCreate"
      responses:
        "201":
          description: Server registered (`pending` status).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: getServer
      summary: Server details
      x-required-permission: servers:read
      responses:
        "200":
          description: The server (desired and observed states, §21.2).
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Servers]
      operationId: updateServer
      summary: Update a server
      description: >-
        Sensitive PATCH — `If-Match` required. Changing the address, port,
        user or key moves the server back to `pending` and requires
        a new validation.
      x-required-permission: servers:manage
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerUpdate"
      responses:
        "200":
          description: Server updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Servers]
      operationId: deleteServer
      summary: Remove a server
      description: >-
        Removes the server from AkerDock (INV-008 — never destroys the
        machine). Refused with `409` (`dependency_exists`) as long as
        resources are deployed on it.
      x-required-permission: servers:manage
      responses:
        "204":
          description: Server removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/ca:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: getServerCA
      summary: Server CA certificate (database SSL)
      description: >-
        Platform-managed CA (§6.3, amendment #23), which signs the
        certificates of this server's databases. **Public by nature**: it is
        what a client must know to verify the database it
        connects to. The private key, however, never leaves the instance
        (encrypted at rest) and is never returned.
      x-required-permission: servers:read
      responses:
        "200":
          description: The CA certificate, in PEM.
          content:
            application/json:
              schema:
                type: object
                required: [ca_cert]
                properties:
                  ca_cert:
                    type: string
                    nullable: true
                    description: PEM; `null` until an SSL database has been created on this server.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/validate:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: validateServer
      summary: Validate a server and install prerequisites
      description: >-
        Starts the onboarding workflow (§20.1) — SSH connectivity, host key,
        sudo, OS/architecture, disk, Docker and helpers installation, proxy.
        Long-running operation — responds `202` with a tracking job. Each step
        of the job is visible and replayable; each failure produces a
        distinct error with remediation.
      x-required-permission: servers:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Validation accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/resources:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: listServerResources
      summary: List a server's resources
      description: >-
        Inventory of managed resources deployed on this server
        (applications and databases). Unmanaged resources discovered on
        the server do not appear here (INV-015).
      x-required-permission: servers:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of resources.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerResource"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/proxy/{action}:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
      - name: action
        in: path
        required: true
        description: >-
          Lifecycle of the server's managed proxy (§3). **`stop` cuts ALL the
          server's inbound traffic** — every domain routed by this proxy
          stops responding until it is restarted.
        schema:
          type: string
          enum: [start, stop, restart]
    post:
      tags: [Servers]
      operationId: proxyLifecycle
      summary: Start, stop or restart a server's proxy
      description: >-
        Long-running action → `202` + job (§4.2). The proxy's desired state is
        persisted: an explicit `stop` is not "repaired" by
        reconciliation. `409` if the server has no managed proxy
        (`proxy_type: none`).
      x-required-permission: servers:proxy
      responses:
        "202":
          description: Action accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/proxy/logs:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: getProxyLogs
      summary: Logs of a server's proxy
      description: >-
        The last lines of the proxy container (§3) — read directly on the
        server, never stored. `409` if the server has no managed proxy.
      x-required-permission: servers:read
      parameters:
        - name: lines
          in: query
          required: false
          description: Number of tail lines (default 200, max 2000).
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: Proxy logs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: createServerTerminalSession
      summary: Open a shell terminal session on the server
      description: >-
        Creates a terminal session (§5.7, §24.4) opening an SSH shell on the
        server with the configured user (`ssh_user`) — effectively a
        **root terminal** in the sense of the RBAC matrix (§10.4), subject to
        the double check: a browser session must have been re-authenticated
        by **passkey** recently (step-up — otherwise `403` with the code
        `stepup_required`), and an API token must carry the `root` permission.
        Returns a **short-lived single-use token** to present on the WebSocket
        `websocket_path` (outside OpenAPI, §27.24). Session scoped to the team,
        audited on open and close, idle timeout, maximum duration,
        guaranteed kill (§24.4). `409` if the team has reached its cap of
        concurrent sessions (`terminal_session_limit`).
      x-required-permission: terminal:root
      responses:
        "201":
          description: >-
            Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/cleanup:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: runServerCleanup
      summary: Run an immediate disk cleanup
      description: >-
        Triggers the server's Docker cleanup (§3.7), outside the schedule.
        The job only targets managed and safe objects — unused build cache,
        managed dangling images, orphaned deployment candidates in any Docker
        state, `/var/lib/akerdock/tmp`, plus the server's opt-in purges
        (managed anonymous volumes and managed networks) — and **never** an
        unmanaged or persistent object (INV-015), nor rollback images
        (ADR-006). It is durably postponed if a deployment is in progress on
        either the target server or a build server. `409`
        (`operation_in_progress`) if a cleanup is already running.
      x-required-permission: servers:maintain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cleanup accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/adoption-scans:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    post:
      tags: [Servers]
      operationId: createAdoptionScan
      summary: Scan a server's unmanaged Docker resources
      description: >-
        Inventories the server's containers and compose stacks that are NOT
        managed by AkerDock (no `akerdock.*` label — INV-015) and proposes a
        mapping to the AkerDock model (§20.7, ADR-013): application or
        service, volumes, variables (names only — INV-003), ports, networks
        and domains detected through inspection and labels. This is the
        inbound migration path from any platform (ADR-023).
        Long-running operation — responds `202` with a tracking job and the
        UUID of the scan to query. `409` (`operation_in_progress`) if a scan
        of this server is already in progress.
      x-required-permission: resources:adopt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Scan accepted — track the job then read the scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionScanAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    get:
      tags: [Servers]
      operationId: listAdoptionScans
      summary: List a server's adoption scans
      description: >-
        History of the server's adoption scans (§20.7), from newest to
        oldest.
      x-required-permission: resources:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of scans.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdoptionScan"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /adoption-scans/{adoption_scan_uuid}:
    parameters:
      - $ref: "#/components/parameters/AdoptionScanUuid"
    get:
      tags: [Servers]
      operationId: getAdoptionScan
      summary: Read an adoption scan and its candidates
      description: >-
        The scan result (§20.7): adoptable candidates with their proposed
        mapping and what will be modified, non-adoptable candidates with the
        reason — never a silent partial adoption. The values of
        environment variables NEVER appear in the scan (INV-003):
        only the names are listed; the values are captured and encrypted
        at adoption time.
      x-required-permission: resources:read
      responses:
        "200":
          description: The scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdoptionScan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /adoption-scans/{adoption_scan_uuid}/adopt:
    parameters:
      - $ref: "#/components/parameters/AdoptionScanUuid"
    post:
      tags: [Servers]
      operationId: adoptResources
      summary: Adopt candidates from a scan, without redeployment
      description: >-
        Takes control of the selected candidates WITHOUT restarting the
        workloads (§20.7, ADR-013): the AkerDock objects (application or
        service, encrypted variables, volumes, domains) are created
        pointing at the existing containers. The first redeployment
        fully normalizes the resource (labels, names, network) while
        preserving the data (volumes taken over under their original name).
        Long-running operation — responds `202` with a job; the job result
        lists the created resources. `409` (`invalid_state`) if the scan is
        not finished; `422` if a candidate is unknown or not adoptable.
      x-required-permission: resources:adopt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptRequest"
      responses:
        "202":
          description: Adoption accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/domains:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Servers]
      operationId: listServerDomains
      summary: List the domains served by a server
      description: Domains routed by the server's proxy, grouped by resource.
      x-required-permission: servers:read
      responses:
        "200":
          description: Domains per resource.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerDomain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /servers/{server_uuid}/certificates:
    parameters:
      - $ref: "#/components/parameters/ServerUuid"
    get:
      tags: [Certificates]
      operationId: listServerCertificates
      summary: List a server's certificates
      description: >-
        Inventory of the TLS certificates served by the server's proxy (ACME
        HTTP-01/DNS-01, custom, self-signed fallback). This collection is
        an **observed reflection** (`certificates` table): the actual state
        lives in `acme.json` and the server's files, synchronized after each
        proxy configuration application and by periodic reconciliation
        (§18.3) — see `observed_at`. Private key material never leaves
        the server and never appears in the API.
      x-required-permission: certificates:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: expiring_within_days
          in: query
          required: false
          description: >-
            Only returns certificates whose `not_after` is less than
            or equal to now + N days (already expired certificates
            included). Typical use for expiration monitoring (D-30/D-7
            alert).
          schema:
            type: integer
            minimum: 1
            maximum: 3650
        - name: status
          in: query
          required: false
          description: Filter by observed status (e.g. `failed`, `expired`).
          schema:
            $ref: "#/components/schemas/CertificateStatus"
      responses:
        "200":
          description: Page of certificates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Certificate"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Certificates
  # ---------------------------------------------------------------------------
  /certificates/{certificate_uuid}:
    parameters:
      - $ref: "#/components/parameters/CertificateUuid"
    get:
      tags: [Certificates]
      operationId: getCertificate
      summary: Certificate details
      description: >-
        Details of a certificate's observed reflection: covered domains
        (wildcards included), issuer, validity window
        (`not_before`/`not_after`), status and last issuance error.
        `observed_at` indicates the freshness of the observation.
      x-required-permission: certificates:read
      responses:
        "200":
          description: The certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /certificates/{certificate_uuid}/renew:
    parameters:
      - $ref: "#/components/parameters/CertificateUuid"
    post:
      tags: [Certificates]
      operationId: renewCertificate
      summary: Force a certificate's renewal
      description: >-
        Forces a new ACME issuance/renewal attempt:
        backup then targeted removal of the entry from the ACME storage
        (`/var/lib/akerdock/proxy/acme.json`), restart of the proxy which
        retries the issuance, then resynchronization of the reflection
        (`renewing` status during the operation). Long-running operation —
        responds `202` with a tracking job. `409` (`operation_in_progress`)
        if a renewal is already in progress for this certificate; `422`
        (`validation_failed`) for a certificate not renewable by the
        platform (`custom`, `self_signed`). Beware of Let's Encrypt
        rate limits: each validation failure consumes quota —
        fix the cause (DNS, port 80, DNS-01 credentials) before
        retrying. Audited action (§23.4).
      x-required-permission: certificates:renew
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Renewal accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Applications
  # ---------------------------------------------------------------------------
  /applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: List applications
      x-required-permission: applications:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: project_uuid
          in: query
          required: false
          description: Filter by project.
          schema:
            type: string
        - name: environment_uuid
          in: query
          required: false
          description: Filter by environment.
          schema:
            type: string
        - name: server_uuid
          in: query
          required: false
          description: Filter by server.
          schema:
            type: string
      responses:
        "200":
          description: Page of applications.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createApplication
      summary: Create an application
      description: >-
        Creates an application in an environment. The source type is
        determined by the `source_type` discriminator — `docker_image` and
        `dockerfile` (P0), public git or private via `private_key_uuid` (P1).
        Creation does not imply a deployment, unless `instant_deploy=true`
        (the `deployment_uuid` then appears in the response).
      x-required-permission: applications:create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: getApplication
      summary: Application details and configuration
      description: >-
        Returns the full application — desired configuration (source,
        build, domains, ports, health check, limits) and observed status
        (§21.2). The `ETag` header carries the optimistic version to reuse
        in `If-Match` for `PATCH`.
      x-required-permission: applications:read
      responses:
        "200":
          description: The application.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Applications]
      operationId: updateApplication
      summary: Update an application's configuration
      description: >-
        Partial update of the configuration. Sensitive PATCH —
        `If-Match` required; version conflict → `409` with the current
        version in `details` (§24.1). Changes are versioned
        (INV-014) and only take effect at the next deployment, except
        immediate-effect fields documented in the schema.
      x-required-permission: applications:update
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Application updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Applications]
      operationId: deleteApplication
      summary: Delete an application
      description: >-
        Asynchronous deletion (§20.6) — first removes routing, then the
        workloads, then the logical object. By default persistent volumes
        are KEPT; pass `delete_volumes=true` to destroy them
        (INV-008).
      x-required-permission: applications:delete
      parameters:
        - name: delete_volumes
          in: query
          required: false
          description: Also destroy the application's persistent volumes.
          schema:
            type: boolean
            default: false
      responses:
        "202":
          description: Deletion accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/storages:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: listApplicationStorages
      summary: List persistent storages
      description: >-
        Named volumes and bind mounts of the application (§8). A volume's
        name is prefixed with the resource's UUID (collision protection,
        INV-011).
      x-required-permission: applications:read
      responses:
        "200":
          description: The application's storages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PersistentStorage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createApplicationStorage
      summary: Declare a persistent storage
      description: >-
        Declares a named volume or a bind mount (§8). The remote volume is
        created at the next deployment, idempotently; the data
        survives redeployments and application deletion,
        unless `delete_volumes=true` is explicit (INV-008).
      x-required-permission: storages:manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersistentStorageCreate"
      responses:
        "201":
          description: Storage declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersistentStorage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/storages/{storage_uuid}:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - $ref: "#/components/parameters/StorageUuid"
    delete:
      tags: [Applications]
      operationId: deleteApplicationStorage
      summary: Remove a persistent storage
      description: >-
        Removes the storage declaration. The **remote data is
        never destroyed** by this operation (INV-008): the orphan volume
        stays on the server and is flagged by the cleanup. Takes effect at
        the next deployment.
      x-required-permission: storages:manage
      responses:
        "204":
          description: Storage removed from the configuration.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/envs:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: listApplicationEnvs
      summary: List environment variables
      description: >-
        The PRODUCTION set by default; `preview=true` returns the set
        dedicated to previews (§5.6, INV-010) — including platform-generated
        variables, such as `AKERDOCK_PREVIEW_BASIC_AUTH` (access credential
        of preview URLs, §20.4.4). Without `read:sensitive`, the `value`
        field of each variable is `null` and `is_redacted` is `true` (INV-003).
        `is_locked` variables never reveal their value, whatever
        the permission.
      x-required-permission: secrets:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: preview
          in: query
          required: false
          description: Returns the preview variable set instead of the production one.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Page of variables.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvironmentVariable"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Applications]
      operationId: createApplicationEnv
      summary: Create an environment variable
      description: >-
        In the PRODUCTION set by default; `preview=true` creates the variable
        in the dedicated preview set (INV-010) — this is how PR instances
        are given their keys (test versions), without ever copying
        production secrets.
      x-required-permission: secrets:write
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: preview
          in: query
          required: false
          description: Creates the variable in the preview set instead of the production one.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableCreate"
      responses:
        "201":
          description: Variable created (value returned depending on permission).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [Applications]
      operationId: replaceApplicationEnvs
      summary: Replace environment variables in bulk
      description: >-
        Full replacement of the variable set (PUT semantics) — variables
        absent from the body are DELETED, present ones are
        created or updated by `key`. Exception: existing `is_locked`
        variables absent from the body are kept (they can
        only be deleted individually). Equivalent of the Developer
        view / bulk editor (§5.4).
      x-required-permission: secrets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/EnvironmentVariableCreate"
      responses:
        "200":
          description: Variable set after replacement.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvironmentVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/envs/{env_uuid}:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
      - $ref: "#/components/parameters/EnvUuid"
    patch:
      tags: [Applications]
      operationId: updateApplicationEnv
      summary: Update an environment variable
      description: >-
        An `is_locked` variable cannot be re-edited (definitively write-only
        value) — only deleting then recreating it is possible
        (§5.4).
      x-required-permission: secrets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentVariableUpdate"
      responses:
        "200":
          description: Variable updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentVariable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Applications]
      operationId: deleteApplicationEnv
      summary: Delete an environment variable
      x-required-permission: secrets:write
      responses:
        "204":
          description: Variable deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/start:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: startApplication
      summary: Start an application
      description: >-
        Sets the desired state to `running` and starts the existing containers
        (without rebuild). Long-running remote operation — `202` + job.
      x-required-permission: applications:lifecycle
      responses:
        "202":
          description: Start accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/stop:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: stopApplication
      summary: Stop an application
      description: >-
        Sets the desired state to `stopped` and stops the containers (grace
        period configured on the application). `202` + job.
      x-required-permission: applications:lifecycle
      responses:
        "202":
          description: Stop accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/restart:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: restartApplication
      summary: Restart an application
      description: Restarts the containers without rebuild. `202` + job.
      x-required-permission: applications:lifecycle
      responses:
        "202":
          description: Restart accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/disown:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: disownApplication
      summary: Unadopt an application — made unmanaged, never destroyed
      description: >-
        Inverse of adoption (§20.7, ADR-013): AkerDock removes its
        routing, if any, then forgets the resource — the containers, volumes
        and remote files remain EXACTLY as they are. Works on any
        application, adopted or not: it is the destruction-free
        exit path. Long-running operation — responds `202` with a job.
      x-required-permission: resources:adopt
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Unadoption accepted — track the job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/terminal-sessions:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: createApplicationTerminalSession
      summary: Open a terminal session in the application's container
      parameters:
        - name: component
          in: query
          required: false
          description: >-
            (compose build pack) Name of the service whose shell to open — the
            stack has no container of its own (compose-spec §2.2). `404` if
            the component is unknown; required as soon as the stack has
            components.
          schema:
            type: string
            maxLength: 63
      description: >-
        Creates a terminal session (§5.7, §24.4) to the application's current
        container and returns a **short-lived single-use token** to present
        on the WebSocket `websocket_path` (outside OpenAPI, §27.24). The token
        is returned only once and expires within a few tens of
        seconds; the session is scoped to the team, audited on open and
        close, subject to an idle timeout and a maximum duration,
        with a guaranteed kill on disconnect (§24.4). Keystrokes are not
        recorded. `409` if the team has reached its cap of concurrent
        sessions (`terminal_session_limit`).
      x-required-permission: terminal:open
      responses:
        "201":
          description: >-
            Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/port-forwards:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: createApplicationPortForward
      summary: Open a TCP tunnel to a container of the application
      parameters:
        - name: component
          in: query
          required: false
          description: (compose build pack) Service whose container is targeted.
          schema:
            type: string
            maxLength: 63
      description: >-
        Creates a TCP tunnel session (ADR-032) to `port` of the current
        container and returns a **single-use token** to present on
        `/tunnel/ws` (outside OpenAPI). Scoped to the team, audited, idle/max/
        heartbeat/teardown like the terminal (§24.4). `409` if the team reaches
        `port_forward_limit`.
      x-required-permission: port-forwards:open
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortForwardCreate"
      responses:
        "201":
          description: Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortForwardSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /databases/{database_uuid}/port-forwards:
    parameters:
      - $ref: "#/components/parameters/DatabaseUuid"
    post:
      tags: [Databases]
      operationId: createDatabasePortForward
      summary: Open a TCP tunnel to a database
      description: >-
        Creates a TCP tunnel session (ADR-032) to `port` of the database's
        container and returns a **single-use token** to present on
        `/tunnel/ws` (outside OpenAPI). Same guarantees as the terminal (§24.4).
        `409` if the team reaches `port_forward_limit`.
      x-required-permission: port-forwards:open
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortForwardCreate"
      responses:
        "201":
          description: Session created — the token is only visible in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortForwardSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/logs:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: getApplicationLogs
      summary: Logs of the application's container
      description: >-
        The last lines of the application's current container (§5.7) —
        read directly on the server (`docker logs`), never stored.
        For a compose stack, `component` designates the service whose
        logs are wanted (required as soon as the stack has components — the
        stack has no container of its own). `409` if the container does not
        exist (application never deployed, or deleted) or if the server is
        unreachable over SSH; `404` if the component is unknown.
      x-required-permission: logs:read
      parameters:
        - name: lines
          in: query
          required: false
          description: Number of tail lines (default 200, max 2000).
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
        - name: component
          in: query
          required: false
          description: >-
            Name of the compose service (compose-spec §2.2) whose logs to read.
            Ignored for other build packs.
          schema:
            type: string
            maxLength: 63
      responses:
        "200":
          description: Container logs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Applications]
      operationId: streamApplicationLogs
      summary: SSE stream of the container's runtime logs
      description: >-
        Streaming of runtime logs as **Server-Sent Events** (ADR-024,
        `text/event-stream`), resume via `Last-Event-ID` (§27.24). Powers
        `akerdock logs -f`. Same targeting rules as the snapshot
        (`component` required as soon as the stack has components). `409` if
        the container does not exist or the server is unreachable; `404` if the
        component is unknown. The body below describes the `log` event;
        the SSE framing itself cannot be expressed in OpenAPI.
      x-required-permission: logs:read
      parameters:
        - name: component
          in: query
          required: false
          description: Name of the compose service whose logs to stream.
          schema:
            type: string
            maxLength: 63
        - name: Last-Event-ID
          in: header
          required: false
          description: Resume after a disconnect — last event `id` received (§27.24).
          schema:
            type: string
      responses:
        "200":
          description: SSE stream open; each `log` event carries a `LogLine`.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/LogLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/deploy:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: deployApplication
      summary: Trigger a deployment
      description: >-
        Queues a full deployment (§20.2, §21.1) — clone/pull depending on
        the source, build, health checks then switchover. Responds `202` with
        the `deployment_uuid` to track on `GET /deployments/{uuid}`. Subject
        to the per-server queue (`concurrent_builds`, `deployment_queue_limit`,
        §5.5); full queue → `429`.


        `skip_build` reruns the pipeline over the artifact already running
        (ADR-048): the environment variables and the runtime configuration are
        applied as they stand now, without a clone or a build. This is what a
        variable change needs — `restart` hands the process back the values
        frozen into the container at creation time.
      x-required-permission: applications:deploy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                `force_rebuild` and `skip_build` are mutually exclusive — one
                rebuilds everything, the other builds nothing.
              properties:
                force_rebuild:
                  type: boolean
                  default: false
                  description: Build without cache.
                skip_build:
                  type: boolean
                  default: false
                  description: >-
                    Redeploy the current artifact with the current
                    configuration; no clone, no build. `409` when the
                    application has no successful deployment to reuse.
      responses:
        "202":
          description: Deployment queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/rollback:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    post:
      tags: [Applications]
      operationId: rollbackApplication
      summary: Rollback to a previous image
      description: >-
        Redeploys a verified earlier image — by `deployment_uuid` or
        explicit `image_digest`, otherwise the latest previous image still
        available (registry by OCI digest if configured, otherwise local
        retention, §27.6). The requested artifact must still exist → otherwise `409`.
      x-required-permission: applications:deploy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: >-
                Rollback target. `deployment_uuid` and `image_digest` are
                mutually exclusive; empty body = most recent previous
                artifact.
              properties:
                deployment_uuid:
                  type: string
                  description: Successful deployment whose image must be redeployed.
                image_digest:
                  type: string
                  description: Explicit OCI digest (e.g. sha256:…).
      responses:
        "202":
          description: Rollback queued (rollback-type deployment).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /applications/{application_uuid}/deployments:
    parameters:
      - $ref: "#/components/parameters/ApplicationUuid"
    get:
      tags: [Deployments]
      operationId: listApplicationDeployments
      summary: An application's deployment history
      description: Cursor pagination, from newest to oldest.
      x-required-permission: deployments:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          description: Filter by deployment status.
          schema:
            $ref: "#/components/schemas/DeploymentStatus"
      responses:
        "200":
          description: Page of deployments.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Deployment"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
  # Deployments
  # ---------------------------------------------------------------------------
  /deployments/{deployment_uuid}:
    parameters:
      - $ref: "#/components/parameters/DeploymentUuid"
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: Deployment details
      x-required-permission: deployments:read
      responses:
        "200":
          description: The deployment (status §21.1, SHA, digest, duration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /deployments/{deployment_uuid}/logs:
    parameters:
      - $ref: "#/components/parameters/DeploymentUuid"
    get:
      tags: [Deployments]
      operationId: getDeploymentLogs
      summary: Build logs of a deployment (JSON or SSE)
      description: |
        Two representations, negotiated via the `Accept` header (§27.24):

        - `application/json` (default) — page of log lines, resumed via
          `?cursor=` (cursor = `sequence` of the last line received).
        - `text/event-stream` — real-time SSE stream. Each event has
          `event: log`, `id: <sequence>` and `data: <LogLine as JSON>`.
          A final `event: end` event is emitted when the deployment
          reaches a terminal status. Native resume via the
          `Last-Event-ID` header. Under backpressure, an
          `event: gap` event explicitly signals the dropped lines (§22.2).

        Lines are sanitized (ANSI/HTML, §23.3) and never contain
        secret values (INV-003).
      x-required-permission: deployments:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Deployment logs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogLine"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
            text/event-stream:
              schema:
                type: string
                description: >-
                  SSE stream — `log` events (data = LogLine JSON), `gap`
                  and `end`, id = sequence for Last-Event-ID resume.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /deployments/{deployment_uuid}/cancel:
    parameters:
      - $ref: "#/components/parameters/DeploymentUuid"
    post:
      tags: [Deployments]
      operationId: cancelDeployment
      summary: Cancel a deployment
      description: >-
        Cancels a `queued` or in-progress deployment before the traffic
        switchover (§21.1). A deployment already terminal or switching
        (`switching`) → `409`. Cancellation only removes the candidate,
        never the existing healthy container (INV-006).
      x-required-permission: deployments:cancel
      responses:
        "202":
          description: Cancellation requested — track the deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ---------------------------------------------------------------------------
