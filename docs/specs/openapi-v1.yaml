  /teams/{team_uuid}/tokens:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
    get:
      tags: [Teams]
      operationId: listApiTokens
      summary: List API tokens
      description: >-
        Lists the metadata of the team's API tokens. The token value is
        NEVER returned (only the identification prefix is) — it
        is visible only once, at creation (§10.3).


        Two readings, told apart by `scope`. `mine` (the default) returns only
        the caller's own tokens: a personal credential page must not show a
        colleague's. `team` returns every token of the team, each with its
        `owner_email` — the administrative reading, which is the one that makes
        "revoke what this person still holds" possible.
      x-required-permission: tokens:read
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [mine, team]
            default: mine
          description: >-
            `mine` (default): the caller's own tokens. `team`: every token of
            the team, with its owner.
      responses:
        "200":
          description: Page of tokens (metadata only).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Teams]
      operationId: createApiToken
      summary: Create an API token
      description: >-
        Creates an API token scoped to the team. The clear value is present
        only in this response (`token` field) and is never
        retrievable again. Privilege-escalation guard: a token cannot
        create a token carrying permissions it does not hold itself
        (otherwise `403`).
      x-required-permission: tokens:create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenCreate"
      responses:
        "201":
          description: Token created — the only occasion to read its clear value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /teams/{team_uuid}/tokens/{token_uuid}:
    parameters:
      - $ref: "#/components/parameters/TeamUuid"
      - $ref: "#/components/parameters/TokenUuid"
    delete:
      tags: [Teams]
      operationId: revokeApiToken
      summary: Revoke an API token
      description: >-
        Immediate and definitive revocation. A token can revoke
        itself. The operation is audited (§23.4).
      x-required-permission: tokens:revoke
      responses:
