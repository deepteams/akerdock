            type: string
        - name: server_uuid
          in: query
          required: false
          description: Filtrer par serveur.
          schema:
            type: string
      responses:
        "200":
          description: Page de bases.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
