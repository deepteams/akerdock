                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [DnsCredentials]
      operationId: createDnsCredential
      summary: Register a DNS-01 credential
      description: >-
        `config` carries the environment variables expected by Lego
        (`CF_DNS_API_TOKEN`, `AWS_ACCESS_KEY_ID`…). Encrypted at rest,
        materialized on the server as `/var/lib/akerdock/proxy/acme.env` (0600)
